# #Misfits Add - Medieval armor blueprint recipes.
#
# Gated by `requiresBlueprint: true`: a recipe only shows up in a workbench's lathe UI while the
# matching blueprint item sits in that workbench's storage (Content.Server/Lathe/LatheSystem.cs,
# AddBlueprintRecipesFromStorage).
#
# Made for wastelanders: no availableFaction, so anyone holding the blueprint can craft.
# Deliberately very expensive. 100 units = 1 sheet, so Steel: 40000 is 400 steel sheets.
# For scale, the heavy C-27 armor costs Steel: 22000 (blueprint_recipes_c27.yml).

