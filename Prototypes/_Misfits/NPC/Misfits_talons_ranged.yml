- type: entity
  name: Talon Mercenary Rifleman
  parent: N14BaseMobRaider
  id: MisfitsTalongunT1
  description: A rookie talon mercenary armed with a decent semi-auto rifle. althrough he only know how to hipfire, dangerous at close-distance.
  components:
    - type: Gun
      minAngle: 40
      maxAngle: 80
      angleIncrease: 10
      angleDecay: 20
      fireRate: 3.0
      soundGunshot: /Audio/_Nuclear14/Weapons/Guns/Rifles/N14RifleR91Gunshot.ogg
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: CombatMode
    - type: BasicEntityAmmoProvider
      proto: N14Cartridge556Rifle
      capacity: 26
      count: 26
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
    - type: Loadout
      prototypes:
        - MobTalonRifleT1Gear
    - type: Sprite
      layers: # Long boring part to make sure layering is correct
