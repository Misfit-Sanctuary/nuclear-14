# #Misfits Add - Medieval belts and harnesses. Sprites made by Chermaity for the Misfits server.
# A child's whitelist replaces its parent's list instead of adding to it, so both bases spell out
# the full list. Ammo entries match N14ClothingBeltStorageBase; med entries match ClothingBeltMedical
# plus Phial (RadAway phial) and Healing (bandages and other healing stacks).

- type: entity
  abstract: true
  parent: N14ClothingBeltStorageBase
  id: MisfitsClothingBeltMedievalBase
  components:
  - type: Storage
    whitelist:
      tags:
      # ammo
      - CigPack
      - N14AmmoCell
      - Document
      # meds
      - Bottle
      - Spray
      - Brutepack
      - Bloodpack
      - Gauze
      - Ointment
      - PillCanister
      - N14Bandage
      - N14TribalMedicine
      - Phial
      components:
      # ammo
      - BallisticAmmoProvider
      - CartridgeAmmo
      # meds
      - Hypospray
      - Injector
      - Pill
      - Healing
  - type: Appearance

# Tool entries match the utility belt (ClothingBeltUtility) plus N14Welder.
- type: entity
  abstract: true
  parent: MisfitsClothingBeltMedievalBase
  id: MisfitsClothingBeltMedievalToolBase
  components:
  - type: Storage
    whitelist:
      tags:
      # ammo
      - CigPack
      - N14AmmoCell
      - Document
      # meds
      - Bottle
      - Spray
      - Brutepack
      - Bloodpack
      - Gauze
      - Ointment
      - PillCanister
      - N14Bandage
      - N14TribalMedicine
      - Phial
      # tools
      - Powerdrill
      - Wirecutter
      - Crowbar
      - Screwdriver
      - Flashlight
      - Wrench
      - GeigerCounter
      - Flare
      - CableCoil
      - Radio
      - HolofanProjector
      - Multitool
      - AppraisalTool
      - JawsOfLife
      - GPS
      - WeldingMask
      - Torch
      - WeldingGoggles
      - N14Welder
      components:
      # ammo
      - BallisticAmmoProvider
      - CartridgeAmmo
      # meds
      - Hypospray
      - Injector
      - Pill
      - Healing
      # tools
      - SprayPainter
      - NetworkConfigurator
      - RCD
      - RCDAmmo
      - Welder
      - PowerCell
      - Geiger
      - TrayScanner
      - GasAnalyzer
      - HandLabeler

- type: entity
