# #Misfits Add - Medieval body armor. Sprites made by Chermaity for the Misfits server.
# Crimson pieces and azure pieces come from the two sides drawn in the source sheet.
# Armor coefficient = share of damage that still gets through (0.75 = blocks 25%).
# Crafted from blueprints in _Misfits/Entities/Objects/Blueprints/medieval_blueprints.yml.

- type: entity
  parent: N14FalloutArmorBase
  id: N14ClothingOuterMedievalJackOfPlatesCrimson
  name: crimson jack of plates
  description: A leather coat with small steel plates riveted inside, trimmed in crimson. Light enough to run in.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Medieval/OuterClothing/jack_of_plates_crimson.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Medieval/OuterClothing/jack_of_plates_crimson.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.75
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05

- type: entity
  parent: N14FalloutArmorBase
  id: N14ClothingOuterMedievalCorseletSteel
  name: steel corselet
  description: A steel breastplate with heavy shoulder plates, worn over a leather coat. Solid protection that still lets you move.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Medieval/OuterClothing/corselet_steel.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Medieval/OuterClothing/corselet_steel.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.65
        Piercing: 0.65
        Heat: 0.6
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.95

