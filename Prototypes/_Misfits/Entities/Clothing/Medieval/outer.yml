# The best armor in the set.
- type: entity
  parent: N14FalloutArmorBase
  id: N14ClothingOuterMedievalKnightHarness
  name: knight's full plate harness
  description: A complete harness of tempered steel plate, fitted piece by piece over mail and padding. It is brutally heavy and slows every step, but almost nothing gets through it.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Medieval/OuterClothing/knight_harness.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Medieval/OuterClothing/knight_harness.rsi
