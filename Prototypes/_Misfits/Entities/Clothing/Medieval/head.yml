# #Misfits Add - Medieval helmets. Sprites made by Chermaity for the Misfits server.
# Armor coefficient = share of damage that still gets through (0.9 = blocks 10%).
# Every helmet covers the face, so hair and facial hair are hidden like N14's metal helmet hides hair.

- type: entity
  abstract: true
  parent: ClothingHeadBase
  id: N14ClothingHeadMedievalBase
  components:
  - type: HideLayerClothing
    slots:
    - Hair
    - FacialHair

- type: entity
  parent: N14ClothingHeadMedievalBase
  id: N14ClothingHeadMedievalKettleHatCrimson
  name: crimson kettle hat
  description: A wide-brimmed steel war hat with a plate guarding the chin and a crimson scarf at the neck.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Medieval/Head/kettle_hat_crimson.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Medieval/Head/kettle_hat_crimson.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

- type: entity
  parent: N14ClothingHeadMedievalBase
  id: N14ClothingHeadMedievalKettleHatVisoredCrimson
