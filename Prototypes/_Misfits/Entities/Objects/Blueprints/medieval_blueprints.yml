# #Misfits Add - Medieval armor blueprints.
#
# Put one in a workbench's storage to unlock its recipes (blueprint_recipes_medieval.yml).
# Made for wastelanders: not given to any faction, loadout, loot table or vendor yet, so for now
# they only come from admin spawning.

- type: entity
  parent: N14BlueprintBase
  id: MisfitsBlueprintMedievalCrimson
  name: Crimson Armory Blueprint
  description: An armorer's patterns for the crimson-trimmed set. Covers the plate coats, helms, gauntlets and boots.
  components:
  - type: Blueprint
    recipes:
    - MisfitsBPMedievalJackOfPlatesCrimson
    - MisfitsBPMedievalCorseletSteel
    - MisfitsBPMedievalHalfPlateCrimson
    - MisfitsBPMedievalPlateCuirassCrimson
    - MisfitsBPMedievalKettleHatCrimson
    - MisfitsBPMedievalKettleHatVisoredCrimson
    - MisfitsBPMedievalCloseHelmBarred
    - MisfitsBPMedievalBarbuteCrimson
    - MisfitsBPMedievalSalletCrimson
    - MisfitsBPMedievalSugarloafHelm
    - MisfitsBPMedievalLeatherGloves
    - MisfitsBPMedievalGauntletsCrimson
    - MisfitsBPMedievalRidingBoots
    - MisfitsBPMedievalPlatedBootsCrimson

