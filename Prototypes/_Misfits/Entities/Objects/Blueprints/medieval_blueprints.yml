# #Misfits Add - Medieval armor blueprints.
#
# Put one in a workbench's storage to unlock its recipes (blueprint_recipes_medieval.yml).
# Made for wastelanders: not given to any faction, loadout, loot table or vendor yet, so for now
# they only come from admin spawning.

- type: entity
  parent: N14BlueprintBase
  id: N14BlueprintMedievalCrimson
  name: Crimson Armory Blueprint
  description: An armorer's patterns for the crimson-trimmed set. Covers the plate coats, helms, gauntlets and boots.
  components:
  - type: Blueprint
    recipes:
    - N14BPMedievalJackOfPlatesCrimson
    - N14BPMedievalCorseletSteel
    - N14BPMedievalHalfPlateCrimson
    - N14BPMedievalPlateCuirassCrimson
    - N14BPMedievalKettleHatCrimson
    - N14BPMedievalKettleHatVisoredCrimson
    - N14BPMedievalCloseHelmBarred
    - N14BPMedievalBarbuteCrimson
    - N14BPMedievalSalletCrimson
    - N14BPMedievalSugarloafHelm
    - N14BPMedievalLeatherGloves
    - N14BPMedievalGauntletsCrimson
    - N14BPMedievalRidingBoots
    - N14BPMedievalPlatedBootsCrimson

