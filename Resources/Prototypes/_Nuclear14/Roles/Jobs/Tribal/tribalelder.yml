- type: job
  id: TribalElder
  setPreference: true
  jobWhitelistBypassesRoleTimers: true
  weight: 60
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-tribal-elder
  description: job-description-tribal-elder
  playTimeTracker: TribalElder
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement
      department: Tribe
      min: 144000 # 40 hours
  startingGear: TribalElderGear
  alwaysUseSpawner: true
  icon: "JobIconTribalLeader" # Corvax-Change
  supervisors: job-supervisors-tribal-elder
  access:
  - TribeMember
  - TribeChief
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - Tribal
      - type: Warcry
        action: ActionTribalWarcry
        targetDepartment: Tribe
        range: 6
        speedBonus: 0.30
        duration: 10
        overlayColor: "#3FAF63"
        speechVerb: MisfitsTribalWarcry
        warcryMessage: warcry-message-tribal
        warcryMessageCount: 6
        buffPopup: warcry-popup-buffed-tribal
        excludedJobs:
        - SuperMutantTribal
        - SyntheticProtectronTribal
      - type: TribalHuntParticipant
        targetDepartment: Tribe
      - type: TribalHuntLeader
        startAction: ActionTribalStartHunt
        targetDepartment: Tribe
        requiredOfferings: 8
        huntDuration: 900
        rewardDuration: 180
        rewardSpeedBonus: 0.20
        activatorJobs: [ TribalElder ]
  - !type:AddTraitSpecial
    traits: [ LanguageTribal ]

- type: startingGear
  id: TribalElderGear
  equipment:
    wallet: N14Wallet
    jumpsuit: N14ClothingUniformJumpsuitTribal
    suitstorage: N14WeaponSniper45-70BrushGun
    outerClothing: N14ClothingOuterTribalCoat
    belt: N14ClothingBeltLeatherPouches
    shoes: N14ClothingShoesTribal
    gloves: N14ClothingHandsGlovesTribal
    back: N14ClothingBackpackTrekker # Corvax-Change
    pocket1: N14TribalKnife
    pocket2: Triballoadoutkits # Forge-Change
    id: N14IDTribeBossPendant
  innerClothingSkirt: N14ClothingUniformJumpskirtTribal
  satchel: N14ClothingBackpackSatchelTribalFilled
  storage: # Corvax-Change
    back:
    - Torch
    - Torch
    - Torch
    - N14Bandage
    - Ointment
    - N14ClothingDeathclawHelm #Misfits Add - New deathclaw helmet for chieftain
    - WarhornBrahmin # Misfits Add - Warhorn to give to whoever

- type: playTimeTracker
  id: TribalElder
