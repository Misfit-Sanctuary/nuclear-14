- type: entity
  id: N14ASRSAccountEnclave
  parent: N14ASRSAccount
  name: U.S. Army requisitions account
  categories: [ HideSpawnMenu ]
  components:
  - type: RequisitionsAccount
    group: Enclave
    startingBalance: 10000
    gain: 30

- type: entity
  parent: N14BaseCargoElevator
  id: N14CargoElevatorEnclave
  suffix: Enclave, Lowered
  components:
  - type: RequisitionsElevator
    group: Enclave
    accountProto: N14ASRSAccountEnclave
  - type: WarpPoint
    location: the Enclave ASRS pit

- type: entity
  parent: N14BaseRequisitionsConsole
  id: N14ASRSConsoleEnclave
  name: U.S. Army ASRS terminal
  description: A hardened military logistics terminal. Automated Storage and Retrieval System, U.S. Army pattern.
  suffix: Enclave
  components:
  - type: AccessReader
    access: [ [ "EnclaveNCO" ] ]
  - type: RequisitionsComputer
    group: Enclave
    accountProto: N14ASRSAccountEnclave
    acceptedCurrency: PrewarMoney
    sellEntries:
    - item: N14ScrapElectronic
      value: 10
    - item: N14ScrapCopper
      value: 5
    - item: N14ScrapSteel
      value: 3
    # R&D collection jobs. Four are drawn at random from the pool defined in
    # Requisitions/Bounties/enclave.yml, and each one is replaced as it is handed in.
    # Hand-in is the normal delivery pass: items on the platform, then lower it.
    bountyPool: Enclave
    maxActiveBounties: 4
    categories:
    - name: n14-requisitions-category-security
      entries:
      - cost: 400
        crate: N14CrateRequisitionsEnclaveSmoke
