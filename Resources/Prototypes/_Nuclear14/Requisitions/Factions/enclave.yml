    # R&D collection board. Every request is for researched genetics disks, gated on
    # the rarity of the mutation encoded on them - blanks never count. Slots seed at
    # round start and refill as they are handed in.
    requestPool: EnclaveRequestPool
    rewardPool: EnclaveRewardPool
    randomRequestSlots: 4
    randomRequestRerollDelay: 900
    randomRequestMinTargets: 1
    randomRequestMaxTargets: 2
    # No hard slot: payouts track the per-disk rates exactly (Common 100, Rare 400,
    # Mythical 1200), so a request is worth the same as handing the disks over would
    # have been. A score multiplier here would break that parity.
    hardRequestSlots: 0
