# Water Purification
- type: reaction
  id: WaterClean
  minTemp: 373 # Corvax-Change
  reactants:
    WaterFiltered:
      amount: 1
  products:
    Water: 1

# #Cythisiax Removed - charcoal no longer cleans dirty water, you boil it instead

# #Cythisiax Added - boiling dirty water makes it clean
- type: reaction
  id: WaterDirtyBoiled
  minTemp: 373
  reactants:
    WaterDirty:
      amount: 1
  products:
    Water: 1

# #Cythisiax Added - the fake dirty water from wells and sinks boils clean too
- type: reaction
  id: MisfitsWaterDirtyPlaceboBoiled
  minTemp: 373
  reactants:
    MisfitsWaterDirtyPlacebo:
      amount: 1
  products:
    Water: 1

- type: reaction
  id: WaterDirty
  reactants:
    Abraxocleaner:
      amount: 1
    WaterIrradiated:
      amount: 1
  products:
    WaterDirty: 1

- type: reaction
  id: WaterSalt
  minTemp: 374 # 100 degrees Celcius.
  reactants:
    WaterSalt:
      amount: 2 # Corvax-Change
  products:
    Water: 1
    TableSalt: 1

