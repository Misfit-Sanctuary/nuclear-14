# Town of [insert map here] should have its own NPCs for protection.
- type: entity
  name: Civil Militia
  parent: N14BaseMobWaster
  id: N14MobNPCTown
  suffix: NPC
  description: Uniformed angry mob ready to defend their homes, might not be the best at combat but he is trying his best.
  components:
    - type: NpcFactionMember
      factions:
      - Townsfolk
    - type: Loadout
      prototypes:
        - TownMilitiaNPC

- type: entity
  name: Town Enforcer
  parent: N14BaseMobWaster
  id: N14MobNPCTownGuard
  suffix: NPC
  description: Professional mercenary armed with a combat shotgun. He won't show mercy to anyone if they can't prove proof of their citizenship in a moment's notice.
  components:
    - type: NpcFactionMember
      friendlyOrderable: true
      factions:
      - TownsfolkSecureArea # Especialy made for the clinic & store, will attack anyone who steps in the storage and not a legal resident.
    - type: Gun
      minAngle: 23
      maxAngle: 104
      angleIncrease: 4
      angleDecay: 16
      fireRate: 1
      soundGunshot:
        collection: N14AutoShotgunGunshot
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: BasicEntityAmmoProvider
      proto: N14ShellShotgun12
      capacity: 8
      count: 8
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound:
        path: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
    - type: Loadout
      prototypes:
        - TownMilitiaGuardNPC
    - type: Sprite
      layers: # Long boring part to make sure layering is correct
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Face" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: Mobs/Species/Human/parts.rsi
      - shader: StencilMask
        map: ["enum.HumanoidVisualLayers.StencilMask"]
        sprite: Mobs/Customization/masking_helpers.rsi
        state: unisex_full
        visible: false
      - map: ["jumpsuit"]
      - map: ["enum.HumanoidVisualLayers.LFoot"]
      - map: ["enum.HumanoidVisualLayers.RFoot"]
      - map: ["enum.HumanoidVisualLayers.LHand"]
      - map: ["enum.HumanoidVisualLayers.RHand"]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "innerBelt" ]
      - map: [ "innerNeck" ]
      - map: [ "outerClothing" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "enum.HumanoidVisualLayers.Wings" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: ["enum.HumanoidVisualLayers.Handcuffs"]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - sprite: _Nuclear14/Objects/Weapons/Guns/Shotguns/combat_shotgun.rsi
        state: inhand-right  # Only part we change, the gun sprite.

# Midwestern chapter's humanoid NPCs for event making and such.
- type: entity
  name: Brotherhood Aspirant
  parent: N14BaseMobWaster
  id: N14MobNPCMBoSSerf
  suffix: NPC
  description: These wastelanders aim to join the Brotherhood of Steel, and so they have been given dangerous quests to prove they are worthy first. Most do not return, dead or discouraged.
  components:
    - type: NpcFactionMember
      friendlyOrderable: true
      factions:
      - BrotherhoodOfSteelSecureArea
    - type: Loadout
      prototypes:
        - MBoSSerfNPC

- type: entity
