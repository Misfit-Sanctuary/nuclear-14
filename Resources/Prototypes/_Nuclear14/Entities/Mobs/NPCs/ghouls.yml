- type: entity
  parent: N14MobBaseHostileFeral
  id: N14MobGhoulMaypole
  name: Maypole
  description: Towering over everything around it, the massive radiation this mutant gives off attracts a horde of feral ghouls like a radioactive lighthouse.
  components:
  - type: Damageable
    damageContainer: MisfitsNPCBiological  # Misfits Change - no starvation for feral ghouls
    damageModifierSet: N14ToughAnimal
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: N14GhoulAttack #Misfits Change
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Brute: 30
        Slash: 10
    range: 2.5
  - type: MeleeThrowOnHit
    speed: 15
    lifetime: 0.025
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.925
        Slash: 0.925
        Piercing: 0.95
        Heat: 0.95
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      sprite: _Nuclear14/Mobs/Ghouls/maypole.rsi
    # layers:
    # - state: alive
      # map: ["movement"]
  # - type: SpriteMovement
    # movementLayers:
      # movement:
        # state: alive
    # noMovementLayers:
      # movement:
        # state: sleeping
  - type: PointLight
    radius: 2
    energy: 0.5
    color: "#4CBB17FF"
  - type: MovementSpeedModifier
    baseWalkSpeed : 5
    baseSprintSpeed : 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.7
        density: 20
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Stamina
    critThreshold: 1000
  - type: MobThresholds
    thresholds:
      0: Alive
      1000: Critical
      1500: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: alive
      Critical:
        Base: sleeping
      Dead:
        Base: dead
  - type: StaminaDamageResistance
    coefficient: 0
  - type: NoPull #Misfits Add - Maypole is too large to be grabbed
  - type: AggroSound #Misfits Change
    sound:
      collection: N14GhoulAggro
      params:
        volume: -12
        maxDistance: 10
