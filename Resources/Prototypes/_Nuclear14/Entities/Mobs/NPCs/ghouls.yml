- type: entity
  name: Feral Ghoul
  id: N14MobGhoulFeral
  parent: N14MobBaseHostileFeral
  description: Humans who have lost all capacity for thought, driven only by instinct with an increased level of aggression and appetite. They cannot be saved.
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Dead
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: N14GhoulAttack #Misfits Change
    angle: 0
    animation: WeaponArcFist
    damage:
      types:
        Slash: 7
    range: 1
  - type: IdleSound #Misfits Change
  - type: SpamEmitSound #Misfits Change
    minInterval: 10
    maxInterval: 60
    sound:
      collection: N14GhoulIdle
      params:
        volume: -15
        maxDistance: 5
  - type: AggroSound #Misfits Change
    sound:
      collection: N14GhoulAggro
      params:
        volume: -12
        maxDistance: 10
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
      sprite: _Nuclear14/Mobs/Ghouls/ghoul-feral.rsi

