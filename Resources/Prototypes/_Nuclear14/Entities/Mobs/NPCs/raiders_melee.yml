- type: entity
  name: Locust Maggot
  parent: N14BaseMobRaider
  id: N14BaseMobMeleeRaider
  description: Weakest mongrels of the Locust Tribe, they’re armed with flimsy knives and pumped with chems. They are impossible to reason with, seeing your death as a chance to rise in the tribe's ranks.
  components:
    - type: Loadout
      prototypes:
      - PsychoRaider1Gear
      - PsychoRaider2Gear
      - PsychoRaider3Gear
      - PsychoRaider4Gear
      - PsychoRaider5Gear

- type: entity
  name: Cult of Liberty Conscript
  id: N14MobRaiderFernMelee
  parent: N14BaseMobRaider
  description: Pressed into service by backwoods crusaders, they now serve at the frontlines of the militia's push into the region. Confused and scared, they see you as a threat and will aim to kill.
  components:
    - type: Loadout
      prototypes:
      - FernConscript1Gear
      - FernConscript2Gear
      - FernConscript3Gear
      - FernConscript4Gear
      - FernConscript5Gear

- type: entity
  name: Warden Cudgel
  id: N14MobRaiderEnforcerMelee
  parent: N14BaseMobRaider
  description: Seasoned mercenaries promoted from the rank of Leadhead, they’ve been given full body armor and increased authority, and are often used as peacekeepers when hired by towns.
  components:
    - type: Loadout
      prototypes:
      - EnforcerBeatcop1Gear
      - EnforcerBeatcop2Gear
      - EnforcerBeatcop3Gear
      - EnforcerBeatcop4Gear
      - EnforcerBeatcop5Gear

- type: entity
  name: Warden Sentinel
  id: N14MobRaiderEnforcerShield
  parent: N14BaseMobShielderEnforcer
  description: Former Cudgels of the Wardens Company, now trained with a focus on shield tactics, they are often employed as bodyguards in non-combat-zones, and used as riot control in cities.
