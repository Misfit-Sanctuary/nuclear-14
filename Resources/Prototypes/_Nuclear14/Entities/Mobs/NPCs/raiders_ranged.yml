- type: entity
  name: Locust Buzzfly
  parent: N14BaseMobRaider
  id: N14MobRaiderPsychoRanged
  description: Once a Maggot of the Locust Tribe, they got at least a single kill and so have been armed with a basic pistol. If this chem fiend can do a successful raid, he’ll join the hostile tribe’s Swarmers.
  components:
    - type: Gun #Mobs currently cannot bolt a gun, so we have to simulate them firing it
      minAngle: 8
      maxAngle: 16
      angleIncrease: 4
      angleDecay: 4
      fireRate: 2.0
      soundGunshot:
        collection: N14Pistol10mmGunshot
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
    - type: CombatMode
    - type: BasicEntityAmmoProvider
      proto: N14CartridgePistol10
      capacity: 12
      count: 12
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 3
      rechargeSound:
        path: /Audio/_Nuclear14/Weapons/Effects/Reload/Pistols/pistol_magin.ogg
    - type: Loadout
      prototypes:
        - RaiderPistol1Gear
        - RaiderPistol2Gear
        - RaiderPistol3Gear
        - RaiderPistol4Gear
        - RaiderPistol5Gear
    - type: Sprite
      layers: # Long boring part to make sure layering is correct
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Face" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: Mobs/Species/Human/parts.rsi
      - shader: StencilMask
        map: ["enum.HumanoidVisualLayers.StencilMask"]
        sprite: Mobs/Customization/masking_helpers.rsi
        state: unisex_full
        visible: false
      - map: ["jumpsuit"]
      - map: ["enum.HumanoidVisualLayers.LFoot"]
      - map: ["enum.HumanoidVisualLayers.RFoot"]
      - map: ["enum.HumanoidVisualLayers.LHand"]
      - map: ["enum.HumanoidVisualLayers.RHand"]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "innerBelt" ]
      - map: [ "innerNeck" ]
      - map: [ "outerClothing" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "enum.HumanoidVisualLayers.Wings" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: ["enum.HumanoidVisualLayers.Handcuffs"]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/10mmPIPEpistol.rsi
        state: inhand-right  # Only part we change, the gun sprite.

