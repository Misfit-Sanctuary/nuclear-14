- type: entity        #Shield guy that tank stuff
  parent: BaseMobSpeciesOrganic
  id: N14BaseMobShielderEnforcer
  abstract: true
  name: Enforcer Shieldman
  suffix: AI
  components:
    #- type: RandomHumanoidAppearance #wassuy disabled for now may cause confusion
    - type: Damageable    # Misfits Add - Override from BaseMobSpeciesOrganic to prevent hunger/thirst damage
      damageContainer: MisfitsNPCBiological
    - type: NpcFactionMember
      factions:
      - Raider
    - type: MobThresholds
      thresholds:
        0: Alive
        160: Critical 
        240: Dead
    - type: MovementSpeedModifier
      baseWalkSpeed : 3.5
      baseSprintSpeed : 4.5
    - type: Armor
      modifiers:
        coefficients:
          Blunt: 0.50
          Slash: 0.50
          Piercing: 0.35
          Heat: 0.50
    - type: SlowOnDamage
      speedModifierThresholds:
        120: 0.8
    - type: Destructible #Misfits Change /Add: Drop bottle caps on death (1-7) #wassuy this do not work, please someone fixit
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 240
        behaviors:
        - !type:PlaySoundBehavior #Wassuy Change - raider death sound didnt really work tho, need fix too
          sound:
            collection: MisfitsRaiderDeath
    - type: PassiveDamage # It's mostly for the faction NPCs, but can be here nonetheless.
      allowedStates:
      - Critical
      damageCap: 300
      damage:
        groups:
          Brute: -0.1
          Burn: -0.1
          Toxin: -0.1
          Airloss: -1
    - type: MindContainer
      showExamineInfo: False
    - type: InputMover
    - type: MobMover
    - type: SurgeryTarget
      canOperate: false
    - type: ProximityNPC # Misfits Add — sleep distant NPCs to reduce tick load
    - type: HTN
      rootTask:
        task: N14RangedHostileCompound
      blackboard:
        NavInteract: !type:Bool    #Wassuy buncha Nav so better ai
          true
        NavClimb: !type:Bool
          true
        NavPry: !type:Bool
         true
        NavSmash: !type:Bool
         true
        VisionRadius: !type:Single #Wassuy added this so they detect you less
          10.5
        MeleeRange: !type:Single
          1.5
    - type: IdleSound #Wassuy added voiceline and combat sound here
    - type: SpamEmitSound
      minInterval: 30
      maxInterval: 90
      sound:
        collection: MisfitsRaiderIdle
        params:
          volume: 6
          maxDistance: 8
    - type: MeleeThrowOnHit
      speed: 10
      lifetime: 0.025
    - type: AggroSound 
      sound:
        collection: MisfitsRaiderAlert
        params:
          volume: 3
          maxDistance: 10
    - type: MeleeWeapon
      hidden: true
      soundHit:
        collection: MetalThud
      attackRate: 1.5
      range: 2.0
      angle: 30
      animation: WeaponArcPunch
      damage:
        types:
          Blunt: 10
    - type: Carriable
    - type: Perishable
      rotAfter: 1800 # Rots after half of an in-game day
    - type: RotInto
      entity: N14FoodMeatRadRaw # and becomes a single chunk of meat.
    - type: Butcherable
      butcheringType: Spike
      spawned:
      - id: N14FoodMeatRadRaw
        amount: 8
    - type: HumanoidAppearance
      species: Human
      hideLayersOnEquip:
      - Hair
      - Snout
    - type: Sprite
      layers:
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.Face" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: Mobs/Species/Human/parts.rsi #PJB on stencil clear being on the left leg: "...this is 'fine'" -https://github.com/space-wizards/space-station-14/pull/12217#issuecomment-1291677115
        # its fine, but its still very stupid that it has to be done like this instead of allowing sprites to just directly insert a stencil clear.
        # sprite refactor when
        state: l_leg
      - shader: StencilMask
        map: ["enum.HumanoidVisualLayers.StencilMask"]
        sprite: Mobs/Customization/masking_helpers.rsi
        state: unisex_full
        visible: false
      - map: ["jumpsuit"]
      - map: ["enum.HumanoidVisualLayers.LFoot"]
      - map: ["enum.HumanoidVisualLayers.RFoot"]
      - map: ["enum.HumanoidVisualLayers.LHand"]
      - map: ["enum.HumanoidVisualLayers.RHand"]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "innerBelt" ]
      - map: [ "innerNeck" ]
      - map: [ "outerClothing" ]
      - map: [ "eyes" ]
      - map: [ "belt" ]
      - map: [ "id" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "enum.HumanoidVisualLayers.Wings" ]
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: ["enum.HumanoidVisualLayers.Handcuffs"]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "clownedon" ] # Dynamically generated
        sprite: "Effects/creampie.rsi"
        state: "creampie_human"
        visible: false
      - sprite: _Nuclear14/Objects/Weapons/Melee/shield_heavy.rsi
        state: inhand-left  # Only part we change, the gun sprite.
