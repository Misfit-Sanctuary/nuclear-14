- type: entity
  name: minigun
  parent: BaseItem
  id: BaseWeaponMinigun
  abstract: true
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    size: Ginormous
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Weapons/spinon.ogg
    soundDeactivate:
      path: /Audio/Weapons/spinoff.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/spinloop.ogg
  - type: UseDelay
    delay: 1.5
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    minAngle: 2
    maxAngle: 12
    angleIncrease: 2
    angleDecay: 12
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: N14MinigunGunshot
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/sf_rifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14MagazineMinigun5mm
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - N14MagazineMinigun5mm
      gun_chamber:
        name: Chamber
        startingItem: N14CartridgePistol5
        priority: 1
        whitelist:
          tags:
            - N14CartridgePistol5
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: MultiHandedItem
  - type: HeldSpeedModifier
  - type: FollowDistance
    backStrength: 6
  - type: StaticPrice
    price: 500
  - type: Execution
  - type: MeleeWeapon
    attackRate: 1.3333
    damage:
      types:
        Blunt: 8.5
    bluntStaminaDamageFactor: 1.25
    swapKeys: true
    disableHeavy: true
    animation: WeaponArcThrust
    wideAnimationRotation: 180
    soundHit:
      collection: MetalThud
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 2.5
  - type: DamageOtherOnHit
    staminaCost: 7.5

- type: entity
  name: minigun
  parent: BaseWeaponMinigun
  id: N14WeaponMinigun
  description: An extremely heavy minigun with 3 barrels, it uses 5mm ammo. # TODO: Need to create projectiles, magazines and boxes for 5.56.
  components:
  - type: MinigunToggle
    ActivatedFireRate: 15
    InactiveWeaponFireRate: 1
  - type: Gun
    minAngle: 7 # #Burger - nerfed spread vs pre-buff (was 4); wider cone to make up for higher ROF
    maxAngle: 30 # #Burger - nerfed spread vs pre-buff (was 12)
    angleIncrease: 5 # # - nerfed spread vs pre-buff (was 2)
    angleDecay: 12
    fireRate: 15 # #Burger - prior proposed ROF (was 6)
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: HeldSpeedModifier
  - type: StaticPrice
    price: 800

- type: entity
  name: avenger minigun
  parent: BaseWeaponMinigun
  id: N14WeaponMinigunAvenger
  description: An extremely heavy advanced minigun with multiple barrels, it uses 5mm ammo. # TODO: Need to create projectiles, magazines and boxes for 5.56.
  components:
  - type: MinigunToggle
    ActivatedFireRate: 15
    InactiveWeaponFireRate: 1
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/avengerminigun.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/avengerminigun.rsi
  - type: Gun
    minAngle: 5
    maxAngle: 14
    angleIncrease: 4 # #Burger - makes the steady spread slightly less predictable (was 3)
    angleDecay: 8
    fireRate: 15 # #Burger - ROF to match buffed base minigun (was 8)
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: StaticPrice
    price: 850
