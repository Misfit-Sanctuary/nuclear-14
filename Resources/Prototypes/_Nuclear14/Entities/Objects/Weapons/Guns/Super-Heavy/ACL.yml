- type: entity
  name: automatic grenade launcher
  parent: BaseWeaponLauncher
  id: N14WeaponLauncherGrenadeAuto
  description: A belt-fed, fully automatic grenade launcher that hurls 30mm grenades downrange in a steady stream. Its bulk and recoil demand exceptional strength or a suit of power armor to control.  The ammo belt is fed from a dedicated ammo backpack rather than stored inside the weapon.
  components:
  - type: Tag
    tags:
      - N14AGL
  - type: N14BackpackFedWeapon
  - type: Wieldable
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -60
  - type: Sprite
    # #Misfits Fix - the icon art is 64x32, so it needs a 64x32 RSI. In the
    # 32x32 AGL.rsi it was read as two frames and the launcher rendered cut in half.
    sprite: _Nuclear14/Objects/Weapons/Guns/SuperHeavy/AGL_icon.rsi
    layers:
      - state: icon_AGL
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/grenadelauncher.rsi
    quickEquip: false
    slots:
    - Back
  - type: Item
    size: Ginormous
    sprite: _Nuclear14/Objects/Weapons/Guns/SuperHeavy/AGL.rsi
  - type: AmmoCounter
  - type: Gun
    # #Misfits Change - slightly tighter cone and slower bloom.
    minAngle: 20
    maxAngle: 84
    angleIncrease: 3.5
    angleDecay: 12
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: N14LauncherGrenadeGunshot
  - type: ClothingSlotAmmoProvider
    targetSlot: BACK
    providerWhitelist:
      tags:
        - N14AGLBackpack
  - type: Appearance
  - type: FollowDistance
    backStrength: 6
  - type: N14SpecialStatRequirement
    minimumStats:
      Strength: 7
    bypassWithPowerArmor: true
  - type: StaticPrice
    price: 1200
