- type: entity
  name: automatic grenade launcher
  parent: BaseWeaponLauncher
  id: N14WeaponLauncherGrenadeAuto
  description: A belt-fed, fully automatic grenade launcher that hurls 30mm grenades downrange in a steady stream. Its bulk and recoil demand exceptional strength or a suit of power armor to control.  The ammo belt is fed from a dedicated ammo backpack rather than stored inside the weapon.
  components:
  - type: Tag
    tags:
      - N14AGL
  - type: N14BackpackFedWeapon
  - type: Wieldable
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -60
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/grenadelauncher.rsi
    layers:
      - state: icon
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/grenadelauncher.rsi
    quickEquip: false
    slots:
    - Back
  - type: Item
    size: Ginormous
  - type: AmmoCounter
  - type: Gun
    minAngle: 22
    maxAngle: 90
    angleIncrease: 4
    angleDecay: 12
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: N14LauncherGrenadeGunshot
  - type: ClothingSlotAmmoProvider
    targetSlot: BACK
    providerWhitelist:
      tags:
        - N14AGLBackpack
  - type: Appearance
  - type: FollowDistance
    backStrength: 6
  - type: N14SuperHeavyWeapon
    minStrength: 7
  - type: StaticPrice
    price: 1200
