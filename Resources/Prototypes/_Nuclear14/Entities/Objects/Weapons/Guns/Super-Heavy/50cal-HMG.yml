- type: entity
  name: .50 machine gun
  parent: BaseWeaponRifle
  id: N14WeaponHMG50
  description: A crew-served, belt-fed heavy machine gun chambered in .50 anti-materiel ammunition. The sheer weight and recoil mean only the exceptionally strong or those in power armor can bring it to bear.
  components:
  - type: Clothing
    sprite: _Nuclear14/Objects/Weapons/Guns/LMGs/canadianhmg.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/LMGs/canadianhmg.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Ginormous
    sprite: _Nuclear14/Objects/Weapons/Guns/LMGs/canadianhmg.rsi
  - type: Wieldable
    wieldedSpeedModifier: 0.6
  - type: GunWieldBonus
    minAngle: -24 # Misfits Change - wielding this heavy weapon almost eliminates spread
    maxAngle: -64
    angleIncrease: -2 # Misfits Change - slower recoil buildup while braced
    angleDecay: 8 # Misfits Change - faster recovery while braced
  - type: Gun
    minAngle: 26
    maxAngle: 70
    angleIncrease: 4
    angleDecay: 14
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      collection: N14AutoRifleGunshot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14Magazine50HMG
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - N14Magazine50HMG
            - N14Magazine50HMGHEIAP
      gun_chamber:
        name: Chamber
        startingItem: N14Cartridge50HMG
        priority: 1
        whitelist:
          tags:
            - N14Cartridge50HMG
            - N14Cartridge50HEIAP
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: FollowDistance
    backStrength: 6
  - type: N14SuperHeavyWeapon
    minStrength: 7
  - type: StaticPrice
    price: 1500
