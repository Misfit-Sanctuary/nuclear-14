- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox50
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14Cartridge50
        - N14Cartridge50HEIAP
    proto: N14Cartridge50
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/50anti-material.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox #Misfits Change /Add/: Empty cardboard ammo boxes can fold back into one cardboard sheet.

- type: entity
  parent: BaseMagazineBox50
  id: MagazineBox50
  name: ammunition box (.50 anti materiel)
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge50
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

- type: entity
  parent: BaseMagazineBox50
  id: MagazineBox50HEIAP
  name: ammunition box (.50 anti materiel)
  suffix: HEIAP
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge50HEIAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]

# #Misfits Add - loose .50 HMG rounds. Deliberately does not accept the HEIAP variant.
- type: entity
  parent: BaseMagazineBox50
  id: MagazineBox50HMG
  name: ammunition box (.50 HMG)
  components:
  - type: BallisticAmmoProvider
    proto: N14Cartridge50HMG
    capacity: 125
    whitelist:
      tags:
        - N14Cartridge50HMG
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
