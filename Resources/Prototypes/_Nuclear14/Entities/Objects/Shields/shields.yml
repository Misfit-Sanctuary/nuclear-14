- type: entity
  name: base shield
  parent: BaseItem
  id: N14BaseShield
  description: Debug item, you shouldn't see it!
  abstract: true
  components:
    - type: Sprite
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_light.rsi
      state: icon
    - type: Item
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_light.rsi
      size: Ginormous
    # #Misfits Fix - Add Clothing so metal shields can be equipped to Back / armor suitStorage (matches Legion shield behavior)
    - type: Clothing
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_light.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: Damageable
      damageContainer: Shield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 50
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                N14Scrap:
                  min: 3
                  max: 3
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.8
      activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.7
        flatReductions:
          Blunt: 0
          Slash: 0
          Piercing: 0
          Heat: 5
    - type: Reflect
      spread: 150
    - type: ClothingSpeedModifier
      walkModifier: 0.975
      sprintModifier: 0.975
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: StaticPrice
      price: 50

- type: entity
  name: light metal shield
  parent: N14BaseShield
  id: N14ShieldMetalLight
  description: A sheet of metal with some bolts and welds here and there, it can protect you from some damage.
  components:
    - type: Construction
      graph: N14LightShield
      node: start
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.95
          Slash: 0.95
          Piercing: 0.95
          Heat: 0.8
      activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.7
        flatReductions:
          Blunt: 0
          Slash: 0
          Piercing: 0
          Heat: 5
    - type: Reflect # #Made the deflect change 15% to interact with the heavy shields double
      reflectProb: 0.40
      spread: 150
    - type: ClothingSpeedModifier
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: StaticPrice
      price: 150
    - type: Destructible
          thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - trigger:
                !type:DamageTrigger
                damage: 100
              behaviors:
                - !type:DoActsBehavior
                  acts: [ "Destruction" ]
                - !type:SpawnEntitiesBehavior
                  spawn:
                    N14ShieldMetalLight:
                      min: 1
                      max: 1

- type: entity
  name: heavy metal shield
  parent: N14BaseShield
  id: N14ShieldMetalHeavy
  description: A large chunk of metal with screws and fine welds, it can protect you from beast and gunfire.
  components:
    - type: SpearBlock # #Misfits Change Add: Shields deflect thrown polearms; falls to ground instead of embedding.
    - type: Sprite
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_heavy.rsi
    - type: Item
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_heavy.rsi
    # #Misfits Fix - Override Clothing sprite to match heavy shield RSI
    - type: Clothing
      sprite: _Nuclear14/Objects/Weapons/Melee/shield_heavy.rsi
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
        - trigger:
            !type:DamageTrigger
            damage: 250
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                N14ShieldMetalHeavy:
                  min: 1
                  max: 1
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.6
      activeBlockModifier:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.7
          Heat: 0.5
        flatReductions:
          Blunt: 3
          Slash: 3
          Piercing: 3
          Heat: 10
    - type: StaticPrice
      price: 300
    - type: Reflect
      reflectProb: 0.65
      spread: 150
    - type: ClothingSpeedModifier
      walkModifier: 0.875
      sprintModifier: 0.875
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: Construction
      graph: N14HeavyShield
      node: start

- type: entity
  parent: BaseItem
  id: N14InsectShield
  name: insect shield
  description: A shield made from various pieces of insects.
  components:
    - type: Sprite
      sprite: _Nuclear14/Objects/Weapons/Melee/insectshield.rsi
      state: icon
    - type: Item
      sprite: _Nuclear14/Objects/Weapons/Melee/insectshield.rsi
      size: Large
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 1.2 # brittle
          Slash: 0.7
          Piercing: 0.8
          Heat: 0.9
      activeBlockModifier:
        coefficients:
          Blunt: 1.2
          Slash: 0.6
          Piercing: 0.7
          Heat: 0.8
        flatReductions:
          Blunt: 0
          Slash: 0
          Piercing: 0
          Heat: 0
    - type: Damageable
      damageContainer: Shield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100 # Ermmm!! this is probably enough damage before it breaks
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
        - trigger:
            !type:DamageTrigger
            damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                N14InsectShield:
                  min: 1
                  max: 1
    - type: StaticPrice
      price: 100
