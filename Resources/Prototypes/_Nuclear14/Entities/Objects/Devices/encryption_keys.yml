- type: entity
  parent: EncryptionKey
  id: EncryptionKeyBrotherhoodOfSteel
  name: Brotherhood encryption key
  description: An encryption key used by the Brotherhood of Steel, repurposed from pre-war military hardware towards these new operations.
  components:
  - type: EncryptionKey
    channels:
    - BrotherhoodOfSteel
    defaultChannel: BrotherhoodOfSteel
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: common_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyEnclave
  name: Enclave encryption key
  description: An encryption key used by the Enclave, a piece of pre-war military hardware allocated through unofficial blackops channels.
  categories: [ HideSpawnMenu ]
  components:
  - type: EncryptionKey
    channels:
    - Enclave
    defaultChannel: Enclave
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyNCR
  name: NCR encryption key
  description: An encryption key used by the New California Republic, manufactured in the factories of the Boneyard by their free citizens. This one is set to a general government frequency, for non-civilian use.
  components:
  - type: EncryptionKey
    channels:
    - NCR
    defaultChannel: NCR
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyOSI
  name: OSI encryption key
  description: An encryption key for the NCR's Office of Science and Industry, a branch of the civilian government. Their work is what led to the factories that produced these being operational in the first place.
  components:
  - type: EncryptionKey
    channels:
    - OSI
    defaultChannel: OSI
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: rd_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyNCRRangers
  name: NCR Ranger encryption key
  description: An encryption key used by the New California Republic rangers, manufactured in the factories of the Boneyard by the nation's workers. This one is set to a special operations frequency, for use by field operatives.
  components:
  - type: EncryptionKey
    channels:
    - NCRRangers
    defaultChannel: NCRRangers
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyNCRCommand
  name: NCR command encryption key
  description: An encryption key for the NCR command net.
  components:
  - type: EncryptionKey
    channels:
    - NCRCommand
    defaultChannel: NCRCommand
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyNCRMaster
  name: NCR command encryption key
  description: An encryption key used by the New California Republic, manufactured in the factories of the Boneyard by free civilian workers. This one is an army command headset key, with access to a multitude of government frequencies at once.
  components:
  - type: EncryptionKey
    channels:
    - NCR
    # #Misfits Change - Ranger field net withheld from the command key; Rangers carry it on their own headsets.
    - OSI
    defaultChannel: NCR
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyVault
  name: Vault encryption key
  description: An encryption key used by Vault-Tec, manufactured pre-war and passed down through generations, and now in your hands. It is used by vault dwellers and Vault-Tec's own corporate offices alike, but good luck finding them still alive.
  components:
  - type: EncryptionKey
    channels:
    - VaultCommon
    defaultChannel: VaultCommon
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyPBS
  name: PBS encryption key
  description: An encryption key used for local broadcast messages, the public broadcast system ensures no matter where you are, you can stay up to date on important emergency updates, or some mad drifter rambling about their grievances.
  components:
  - type: EncryptionKey
    channels:
    - PBS
    defaultChannel: PBS
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

# #Misfits Change - Legion encryption key
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyLegion
  name: Legion encryption key
  description: An encryption key used by Caesar's Legion, scavenged from pre-war supplies stockpiled in the Grand Canyon. These are of a limited supply, and their circulation is tightly controlled, or it was until the Legion's split.
  components:
  - type: EncryptionKey
    channels:
    - Legion
    defaultChannel: Legion
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

# #Misfits Change - Global wasteland radio key, included in all headsets
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyEighties
  name: Eighties encryption key
  description: An encryption key used by the raider tribe known as The Eighties, scavenged from pre-war highway police headsets and car radios. They tend to find more of them as they scavenge the I-80 for replacement parts for their great war machines.
  components:
  - type: EncryptionKey
    channels:
    - Eighties
    defaultChannel: Eighties
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyWastelandGlobal
  name: wasteland radio encryption key
  description: An encryption key used by the common drifters of the wasteland, these are often pre-war corporate workplace chips or from domestic communication devices, wiped clean of their old configurations and tuned to the local general frequency.
  components:
  - type: EncryptionKey
    channels:
    - WastelandGlobal
    defaultChannel: WastelandGlobal
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

# #Misfits Add — Followers of the Apocalypse private encryption key
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyFollowers
  name: Followers encryption key
  description: An encryption key used by the Followers of the Apocalypse, manufactured in the Boneyard's factories in the New California Republic. The Followers often get these provided at no cost, due to the charity work they already do for the city's people.
  components:
  - type: EncryptionKey
    channels:
    - FollowersOfApocalypse
    defaultChannel: FollowersOfApocalypse
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: med_label

# #Misfits Add — Bazaar Townsfolk private encryption key
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyTown
  name: Town encryption key
  description: An encryption key used by the townsfolk of The Bazaar, produced by local mechanics from scavenged circuitry and other pre-war salvage. They are tuned to a private frequency for the settlement's use, and are kept in tight circulation.
  components:
  - type: EncryptionKey
    channels:
    - Townsfolk
    defaultChannel: Townsfolk
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: com_label

# #Misfits Add - Z.A.X binary encryption key for future Z.A.X equipment and comms devices.
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyZAX
  name: Z.A.X binary encryption key
  description: An encryption key used by silicon units linked to a Z.A.X. network, either produced pre-war or post-war by the Z.A.X. itself. It has proven impossible for humans to replicate this chip, only salvage it from networked units themselves.
  components:
  - type: EncryptionKey
    channels:
    - ZAXBinary
    defaultChannel: ZAXBinary
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: rd_label

