# #Misfits Change - Uncommented to fix missing prototype reference in Wendover map
- type: entity
  parent: EncryptionKey
  id: EncryptionKeyBrotherhoodMidwest
  name: Midwest Brotherhood Encryption Key
  description: An encryption key used by the Brotherhood of Steel, repurposed from pre-war military hardware towards these new operations. This one is set to a frequency used by the Midwest chapter of the Brotherhood.
  components:
  - type: EncryptionKey
    channels:
    - BrotherhoodOfSteel
    defaultChannel: BrotherhoodOfSteel
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: common_label

