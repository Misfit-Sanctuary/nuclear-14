- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommonUR
  name: common encryption key
  description: An encryption key made for general purpose domestic use, commonly found in office devices and in home electronics. Often repurposed by drifters and sold as salvage to be tuned to new frequencies.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyMedicalUR
  name: medical encryption key
  description: An encryption key used by pre-war clinics and hospitals, to keep paramedics, pharmacists and surgeons in close coordination. These can be seen used by post-war doctors and other, less savory individuals who are technically in the medical field.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Medical
    defaultChannel: Medical
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: med_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyScienceUR
  name: epistemics encryption key # DeltaV - Epistemics Department replacing Science
  description: An encryption key used by pre-war scientists, its a miracle you even got your hands on this. Likely worth a nice reward to the right person. But its still unlikely anyone's listening on the other end still.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Science
    defaultChannel: Science
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sci_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeySecurityUR
  name: security encryption key
  description: An encryption key used by pre-war corporate security officers, these got loose as the food riots swelled in number and defections became more commonplace. Its not uncommon to find these used by frontier militias and bandit gangs alike.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Security
    - Prison #deltaV
    defaultChannel: Security
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyStationMasterUR
  name: corporate master encryption key
  description: An encryption key used by pre-war corporate bosses, to keep a tight grip on their operations from the junior executives and middle management, all the way down to individual laborers and office drones. Perfect for the aspiring control freak.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Common
    - Command
    - Engineering
    - Justice # Delta V- adds Justice department
    - Medical
    - Science
    - Security
    - Service
    - Supply
    - Prison #DeltaV
    defaultChannel: Command
  - type: Sprite
    layers:
    - state: crypt_gold
    - state: cap_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyEngineeringUR
  name: engineering encryption key
  description: An encryption key used by pre-war engineers in the employement of local city governments, overworked and underpaid with mounting damages as supplies kept dwindling or ending up outright stolen. Its a nice bit of history to put in your collection.
  components:
  - type: Unremoveable
  - type: EncryptionKey
    channels:
    - Engineering
    defaultChannel: Engineering
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: eng_label
