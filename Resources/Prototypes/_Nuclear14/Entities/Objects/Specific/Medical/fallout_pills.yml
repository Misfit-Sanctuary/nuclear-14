- type: entity
  parent: Pill
  id: N14RadXPill
  description: A pill of Rad-X. It makes you more resistant to radiation.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Specific/Medical/ms13_drugs.rsi
    state: radx
  - type: Item
    sprite: _Nuclear14/Objects/Specific/Medical/pills.rsi
  - type: Food
    forceFeedDelay: 1
    transferAmount: null
    eatMessage: food-swallow
    useSound: /Audio/Items/pill.ogg
  - type: Label
    currentLabel: rad-x
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: RadX
          Quantity: 20
  - type: SolutionSpiker
    sourceSolution: food
  - type: DeleteOnTrigger
  - type: Extractable
    grindableSolutionName: food

