- type: entity
  parent: N14MobBaseSimple
  id: MisfitsBrahdo_Dev
  abstract: true
  components:
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: OpenSlot
    openSlots:
    - outerClothing
    - back
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _Misfits/Mobs/Animals/brahdo-standard.rsi
      state: base
    - map: [ "outerClothing" ]
  - type: Fixtures
    fixtures:
      fix1:
        hard: true
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: base
      Dead:
        Base: base-dead
  - type: Stamina
    critThreshold: 200
  - type: Strap
    #buckleOffset: 0.0, 0.5
    buckleSound:
      path: /Audio/_NC/Effects/lift-saddle.ogg
      params:
        volume: 20 # It's normal
    unbuckleSound:
      path: /Audio/_NC/Effects/dismount-saddle.ogg
      params:
        volume: 20 # It's normal
#  - type: BrahdoSpooked
#    spookDuration: 5
#    buckChance: 0.15
  - type: Tag
    tags:
    - FootstepSound
    - Brahdo
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: WastelandAnimal
  - type: MobThresholds
    allowRevives: true
    thresholds:
      0: Alive
      200: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      50: .95 # dont get hit chuds
      100: .90
      150: .80
      180: .70 # lol
  - type: MovementSpeedModifier
    baseWalkSpeed : 5.0
    baseSprintSpeed : 5.0
  - type: FootstepModifier
    footstepSoundCollection:
      collection: Horsestep
  - type: ReproductivePartner
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: UnequipOnTrigger
    slotsToUnequip:
    - outerClothing
  - type: Inventory
    templateId: brahdo
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: HTN
    rootTask:
      task: RuminantCompound
  - type: Body
    prototype: AnimalRuminant
  - type: DriveOnBuckle
  - type: Mountable
  - type: DirectionalBuckleOffset
    offsets:
      North: 0, -0.5
      South: 0, 0.5
      East: -0.5, 0
      West: 0.5, 0

- type: entity
  parent: MisfitsBrahdo_Dev
  id: DevBrahdo
  name: brahdo
  description: "Mutated horses common as mounts and pack animals, they'll bite your fingers if you aren't careful."
