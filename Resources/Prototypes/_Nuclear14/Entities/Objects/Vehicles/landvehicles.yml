- type: entity
  parent: BaseVehicle
  id: N14VehicleBuggyDune
  name: Locust Buggy
  description: These unpainted off-road vehicles are a common sight among raiders and recon infantry, slapped together for a quick salvage party or skirmish with an enemy encampment.
  components:
  - type: Vehicle
    renderOver: North, NorthEast, East, SouthEast, South, SouthWest, West, NorthWest
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: buggy_dune
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    - state: buggy_dune_cover
      map: ["enum.VehicleVisualLayers.Cover"]
    netsync: false
    noRot: true
  - type: MovementSpeedModifier
    acceleration: 1
    friction: 0.5
    baseWalkSpeed: 4.5
    baseSprintSpeed: 8
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3

