  description: Fast as the devil on your heels, this speed demon has a spirit that thirsts to chase down rangers and drag vault security officers behind it, painting the sacred I-80 red.
  components:
  - type: AmbientSound
    sound: "/Audio/_Nuclear14/Effects/motorcycle2.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: Sprite
    layers:
    - state: bike_flamy2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: Vehicle
