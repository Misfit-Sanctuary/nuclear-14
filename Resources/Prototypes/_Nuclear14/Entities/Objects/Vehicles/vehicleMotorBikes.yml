  name: Rustbird Motorbike
  description: She has suffered greatly since the fall of society, left without proper care or maintenance for decades before she was recovered. But she will be safe now, by your side.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_rust_light
