

- type: entity
  parent: BaseVehicle
  id: N14VehicleBikeBase
  abstract: true
  components:
  - type: Vehicle
  - type: Motorbike
  - type: Damageable
    # #Cythisiax Fixed - was Inorganic, which ignored Structural/Caustic/Radiation damage and made motorbikes take zero damage from plasma (BulletPlasma deals Caustic + Radiation + Structural). StructuralInorganic matches the windows.yml fix.
    damageContainer: StructuralInorganic
    damageModifierSet: Motorbike
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 15
    qualityNeeded: Welding
  - type: Destructible
    thresholds: []
  - type: ExplosionResistance
    worn: false
    damageCoefficient: 1.1
  - type: SolutionContainerManager
    solutions:
      motorbikeFuel:
        maxVol: 200
  - type: ExaminableSolution
    solution: motorbikeFuel
  - type: Strap
    # #Misfits Change - vehicle riding requires the shared riding perk instead of any humanoid.
    whitelist:
      requireAll: true
      components:
      - HumanoidAppearance
      - RidingPerk
    # #Misfits Fix - Super Mutants and Power Armor wearers are too heavy to ride motorbikes
    blacklist:
      tags:
      - CannotRide
      components:
      - PowerArmorWorn
  - type: MovementSpeedModifier
    acceleration: 5 # #Cythisiax Edited - Nerfed from 6 for balance
    friction: 0.15 # #Cythisiax Edited - Nerfed from 0.1 for balance (less slippery)
    baseWalkSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
    baseSprintSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
  - type: Fixtures # So they cant fit through 1 door.
    fixtures:
      fix1:
        hard: true
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - MotorbikeKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeGreen
  name: Harley Motorbike
  description: Hers is a spirit meant for warfare, a companion that will never betray you. She has seen the world before your time, and she will show it to you now, if you can keep up.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_green
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    netsync: false
    noRot: true

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeFlamey
  name: Chopper Motorbike
  description: Fast as the devil on your heels, this speed demon has a spirit that thirsts to chase down rangers and drag vault security officers behind it, painting the sacred I-80 red.
  components:
  - type: AmbientSound
    sound: "/Audio/_Nuclear14/Effects/motorcycle2.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_flamy2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: Vehicle
    renderOver: None
    overlayPrototype: VehicleBikeFlameyOverlay

- type: entity
  id: VehicleBikeFlameyOverlay
  name: flamey overlay
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
      - state: bike_flamy1_overlay
    noRot: true
    drawdepth: OverMobs # Set the drawdepth here to be above players non-clickable
  - type: Tag
    tags:
      - HideContextMenu
  - type: Appearance

- type: entity
