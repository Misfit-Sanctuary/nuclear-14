- type: entity
  parent: BaseVehicle
  id: N14VehicleBikeBase
  abstract: true
  components:
  - type: Spillable
    spillDelay: 5.0
  - type: SolutionContainerManager
    solutions:
      motorbikeFuel:
        maxVol: 200
  - type: RefillableSolution
    solution: motorbikeFuel
  - type: Vehicle
    renderOver: None
    overlayPrototype: MisfitsMountRiderOverlay
  - type: EngineNeedsFuel
  - type: VehicleEngine
  - type: DriveOnBuckle
  - type: SolutionConsumer
#  - type: DirectionalBuckleOffset
#    offsets:
#      North: 0, -0.05
#      South: 0, 0
#      East: -0.15, -0.18
#      West: 0.15, -0.18
  - type: Damageable
    damageContainer: MisfitsVehicleNormal
    damageModifierSet: Motorbike
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 15
    qualityNeeded: Welding
  - type: UseDelay
    delay: 0.5
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishOnInteract
    stackDelta: -1.0
    extinguishAttemptSound:
      path: /Audio/Items/candle_blowing.ogg
      params:
        variation: 0.05
        volume: 10
  - type: Flammable
    fireStackIncreaseMultiplier: 1.35
    fireSpread: true
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    firestacksOnIgnite: 3.0
    damage:
      types:
        Heat: 10
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: ExplodeOnTrigger
  - type: Explosive
    canCreateVacuum: false
    explosionType: FireBomb
    totalIntensity: 150
    intensitySlope: 5
    maxIntensity: 10
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageGroupTrigger
        damageGroup: Burn
        damage: 100
      behaviors:
      - !type:TriggerBehavior
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ExaminableSolution
    solution: motorbikeFuel
  - type: Strap
    size: 300
    whitelist:
      requireAll: true
      components:
      - HumanoidAppearance
    # #Misfits Fix - Super Mutants and Power Armor wearers are too heavy to ride motorbikes
    blacklist:
      tags:
      - CannotRide
      components:
      - PowerArmorWorn
  - type: MovementSpeedModifier
    acceleration: 5 # #Cythisiax Edited - Nerfed from 6 for balance
    friction: 0.15 # #Cythisiax Edited - Nerfed from 0.1 for balance (less slippery)
    baseWalkSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
    baseSprintSpeed: 7 # #Cythisiax Edited - Nerfed from 8 for balance
  - type: Fixtures # So they cant fit through 1 door.
    fixtures:
      fix1:
        hard: true
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 50
        mask:
        - MobMask
        layer:
        - MobLayer
      flammable:
        hard: false
        shape: !type:PhysShapeCircle
          radius: 0.76
  - type: ItemSlots
    slots:
      key_slot:
        name: Keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - MotorbikeKeys
        insertSound:
          path: /Audio/Effects/Vehicle/vehiclestartup.ogg
          params:
            volume: -3

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeGreen
  name: Harley Motorbike
  description: Hers is a spirit meant for warfare, a companion that will never betray you. She has seen the world before your time, and she will show it to you now, if you can keep up.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_green
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
    netsync: false
    noRot: true


- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeFlamey
  name: Chopper Motorbike
  description: Fast as the devil on your heels, this speed demon has a spirit that thirsts to chase down rangers and drag vault security officers behind it, painting the sacred I-80 red.
  components:
  - type: AmbientSound
    sound: "/Audio/_Nuclear14/Effects/motorcycle2.ogg"
    range: 10
    volume: -10
    enabled: false
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_flamy2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: Vehicle
    renderOver: None
    overlayPrototype: MisfitsMountRiderOverlay

- type: entity
  id: VehicleBikeFlameyOverlay
  name: flamey overlay
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
      - state: bike_flamy1_overlay
    noRot: true
    drawdepth: OverMobs # Set the drawdepth here to be above players non-clickable
  - type: Tag
    tags:
      - HideContextMenu
  - type: Appearance

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeRustLight
  name: Rustbird Motorbike
  description: She has suffered greatly since the fall of society, left without proper care or maintenance for decades before she was recovered. But she will be safe now, by your side.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_rust_light
      map: ["enum.VehicleVisualLayers.AutoAnimate"]

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeScrambler
  name: Scrambler Dirt Bike
  description: Rugged and dependable, these motorbikes are unique in that they are made for off-road activity. Often straying from the sacred I-80, some say they lack true souls.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike_scrambler2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
  - type: Vehicle
    renderOver: None
    overlayPrototype: MisfitsMountRiderOverlay
  - type: DirectionalBuckleOffset
    offsets:
      North: 0, -0.05
      South: 0, 0.12
      East: -0.22, -0.16
      West: 0.22, -0.16
# acceleration seems to be used wrong or is broken. Bike will stay perma slow
#  - type: MovementSpeedModifier
#    acceleration: 0.5 # #Cythisiax Added - Scrambler takes ~4.6s to reach max speed (heavy bike feel)
#    ignoreTileAcceleration: true # Planet tiles otherwise override this with their own acceleration.

- type: entity
  id: VehicleBikeScramblerOverlay
  name: scrambler overlay
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
      - state: bike_scrambler1_overlay
    noRot: true
    drawdepth: OverMobs # Set the drawdepth here to be above players non-clickable
  - type: Tag
    tags:
      - HideContextMenu
  - type: Appearance

- type: entity
  parent: N14VehicleBikeBase
  id: N14VehicleBikeClassic
  name: Thunderbird Motorbike
  description: Reliable as can be, this machine has a powerful spirit made to endure past the apocalypse. She can carry you from coast to coast without any issue.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Vehicles/bikesbuggy.rsi
    layers:
    - state: bike2
      map: ["enum.VehicleVisualLayers.AutoAnimate"]
