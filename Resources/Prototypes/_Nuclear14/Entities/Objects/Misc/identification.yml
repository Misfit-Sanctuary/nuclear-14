#MARK: Desert Rangers
- type: entity
  parent: N14IDNCRDogtag
  id: N14IDBadgeNCRDesertRangerRecruit
  name: ranger recruit badge
  description: An ID badge worn by Desert Ranger Recruits.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger_recruit
  - type: PresetIdCard
    job: NCRPatrolRanger
  # #Misfits Fix - Tag every ranger badge so the Rangers TacMap Overwatch tab only
  # tracks Ranger personnel, not the whole NCR. This is the base of ALL ranger badges
  # (Desert Ranger, Elite, Chief, Republic Ranger). NOTE: a child Tag component
  # REPLACES the parent's (composition is not additive for this field), so we must
  # re-list IdCardNCR here to keep rangers on the standard NCR map/Pip-Boy feed.
  - type: Tag
    tags:
    - IdCardNCR
    - IdCardNCRRanger

- type: entity
  parent: N14IDBadgeNCRDesertRangerRecruit
  id: N14IDBadgeNCRDesertRanger
  name: ranger badge
  description: An ID badge worn by Desert Rangers.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger
  - type: PresetIdCard
    job: NCRFieldRanger #Misfits Change - was NCRRanger

- type: entity
  parent: N14IDBadgeNCRDesertRangerRecruit
