- type: entity
  parent: N14IDPassportBlank
  id: N14IDPassportPhoto
  name: passport
  description: An old pre-war passport that's been scrubbed clean of its old print, now filled in with new information and used by wastelanders as personal ID.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_photo

- type: entity
  parent: N14IDPassportBlank
  id: N14IDPassportVIP
  name: passport
  description: An old pre-war passport that's been scrubbed clean of its old print, this one is in relatively pristine shape and used by a better class of wastelanders as personal ID.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential

- type: entity
  parent: N14IDPassportBlank
  id: N14IDDoctor
  name: doctors ID
  description: Out in the wasteland, this is the best guarantee you have someone actually knows what they're doing when they're poking around your injuries.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: doctor
  - type: Access
    tags:
    - FotA
    - FotADoctor


