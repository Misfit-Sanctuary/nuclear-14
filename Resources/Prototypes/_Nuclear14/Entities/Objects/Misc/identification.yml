# ID Cards
- type: entity
  parent: Clothing
  id: N14IDCard
  name: identification card
  description: Make sure you don't lose this, or you're in some deep shit.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    heldPrefix: default
    size: Small
  - type: Access
  - type: IdCard
  - type: NanoChatCard # #Misfits Add - PipBoy Hub requires NanoChatCard for number assignment and messaging
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener

#MARK: Vault
- type: entity
  parent: N14IDCard
  id: N14IDCardVault
  name: vault ID card
  description: Proof that you belong underground, but in a good way.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/tapes_cards.rsi
    scale: 0.7, 0.7
    layers:
    - state: keycard_vault
  - type: PresetIdCard
    job: VaultDweller
  - type: Tag
    tags:
    - IdCardVault
    - DoorBumpOpener
  - type: ClothingAddFaction
    faction: Vault

- type: entity
  parent: N14IDCardVault
  id: N14IDCardVaultEngineer
  name: vault engineer ID card
  description: Real engineers don't need this to get around, but it keeps security from thinking you're a break-in artist.
  components:
  - type: PresetIdCard
    job: VaultEngineer

- type: entity
  parent: N14IDCardVault
  id: N14IDCardVaultSecurity
  name: vault security ID card
  description: Down here you're the law, but only so long as there are others alive to follow that law.
  components:
  - type: PresetIdCard
    job: VaultSecurity

- type: entity
  parent: N14IDCardVault
  id: N14IDCardVaultDoctor
  name: vault doctor ID card
  description: Prevention is preferable to treatment, but you can't prevent your fellow dwellers from getting themselves hurt.
  components:
  - type: PresetIdCard
    job: VaultDoctor

- type: entity
  parent: N14IDCardVault
  id: N14IDCardVaultOverseer
  name: vault overseer ID card
  description: You're the person in charge down here, don't let anyone forget it. Above all else, don't mess this up.
  components:
  - type: PresetIdCard
    job: Overseer

- type: entity
  parent: N14IDCardVault
  id: MisfitsIDCardVaultCargo
  name: vault cargo specialist ID card
  description: Import what's needed, export what's not. No society is truly self sustaining, not indefinitely.
  components:
  - type: PresetIdCard
    job: VaultCargoSpecialist

- type: entity
  parent: N14IDCardVault
  id: MisfitsIDCardVaultCourier
  name: vault courier ID card
  description: Deliver messages and parcels to the right people, and try to make some profit out of it.
  components:
  - type: PresetIdCard
    job: VaultCourier

- type: entity
  parent: N14IDCardVault
  id: MisfitsIDCardVaultSalvage
  name: vault salvage specialist ID card
  description: Each week that passes the ore and salvage gets a bit thinner, but the vault still needs to be maintained.
  components:
  - type: PresetIdCard
    job: VaultSalvageSpecialist

#MARK: Passports
- type: entity
  parent: N14IDCard
  id: N14IDPassportBlank
  name: blank passport
  description: An old pre-war passport that's been scrubbed clean of its old print, now used by wastelanders as personal ID.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_blank
    scale: 0.7, 0.7
  - type: Clothing
    sprite: _Nuclear14/Objects/Misc/identification.rsi

- type: entity
  parent: N14IDPassportBlank
  id: N14IDPassport
  name: passport
  description: An old pre-war passport that's been scrubbed clean of its old print, stamped with some frontier settlement's seal and used by wastelanders as personal ID.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport

