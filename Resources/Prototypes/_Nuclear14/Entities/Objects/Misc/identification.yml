- type: entity
  parent: N14IDNCRDogtag
  id: N14IDNCRDogtagEngineer
  name: engineer's dogtags
  description: You can fix just about anything in this warzone, but you can't fix a bad battle plan. That's for the commanders to worry about.
  suffix: Engineer
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ncrdogtag
  - type: PresetIdCard
    job: NCREngineer

- type: entity
  parent: N14IDNCRDogtag
  id: N14IDNCRDogtagNCO
  name: sergeant's dogtags
  description: These mark you as a competent soldier, its own kind of curse. You have all the responsibility of a leader, but none of an officer's perks.
  suffix: SGT
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ncrdogtag
  - type: PresetIdCard
    job: NCRNCO

- type: entity
  parent: N14IDNCRDogtag
  id: N14IDNCRDogtagOfficer
  name: officer's dogtags
  description: These dogtags give you a special kind of authority, command over the local forces. But they can also make any incompetency, real or imagined, shine all the brighter for it.
  suffix: Officer
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ncrdogtag
  - type: PresetIdCard
    job: NCRExecutiveOfficer

#MARK: Desert Rangers
- type: entity
  parent: N14IDNCRDogtag
  id: N14IDBadgeNCRDesertRangerRecruit
  name: ranger recruit badge
  description: A shiny badge that marks you as someone who still has something to prove. Try to live up to the legacy of the rangers, or sink in the sand.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger_recruit
  - type: PresetIdCard
    job: NCRPatrolRanger
  # #Misfits Fix - Tag every ranger badge so the Rangers TacMap Overwatch tab only
  # tracks Ranger personnel, not the whole NCR. This is the base of ALL ranger badges
  # (Desert Ranger, Elite, Chief, Republic Ranger). NOTE: a child Tag component
  # REPLACES the parent's (composition is not additive for this field), so we must
  # re-list IdCardNCR here to keep rangers on the standard NCR map/Pip-Boy feed.
  - type: Tag
    tags:
    - IdCardNCR
    - IdCardNCRRanger

- type: entity
  parent: N14IDBadgeNCRDesertRangerRecruit
  id: N14IDBadgeNCRDesertRanger
  name: ranger badge
  description: A dull badge that marks you as someone who has worn in their boots. You're more than just a showboat, and trusted to get the job done.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger
  - type: PresetIdCard
    job: NCRFieldRanger #Misfits Change - was NCRRanger

- type: entity
  parent: N14IDBadgeNCRDesertRangerRecruit
  id: N14IDBadgeNCRDesertRangerElite
  name: ranger elite badge
  description: A scratched and weathered badge that marks you as the real deal. You have to serve twenty years to get one of these, and not by riding a desk.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger_elite
  - type: PresetIdCard
    job: NCRVeteranRanger #Misfits Change - was NCRRangerVeteran

- type: entity
  parent: N14IDBadgeNCRDesertRangerRecruit
  id: N14IDBadgeNCRDesertRangerChief
  name: ranger chief badge
  description: An old badge from the days of the Desert Rangers, carefully polished and preserved, with new names and places engraved on it. It marks you as the person bearing all the responsibility.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ranger_chief
  - type: PresetIdCard
    job: NCRVeteranRanger #Misfits Change - was NCRRangerVeteran

#MARK: NCR Rangers
- type: entity
  parent: N14IDBadgeNCRDesertRanger
  id: N14IDBadgeNCRRanger
  description: A badge that marks you as a particularly capable piece of equipment in the endless war that is wasteland law enforcement.
  suffix: NCR

- type: entity
  parent: N14IDBadgeNCRDesertRangerElite
  id: N14IDBadgeNCRRangerElite
  description: A badge that marks you as an unquestioning and loyal piece of government property, ready to do exactly as the president commands.
  suffix: NCR

#MARK: Townsfolk
- type: entity
  parent: N14IDPassportPhoto
  id: N14IDPassportTownsfolk
  name: passport
  description: Proof that you belong in the local settlement, that you're more trustworthy than the drifters in the wasteland.
  components:
  - type: ClothingAddFaction
    faction: Townsfolk
  - type: PresetIdCard # Forge-Change
    job: Townsperson # Forge-Change

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDShopkeeperTown
  name: Shopkeepers ID
  description: This settlement passport marks you as a person of some importance. Without a shopkeeper there is no shop, and without a shop there is no settlement.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential
  - type: PresetIdCard
    job: TownShopkeeper

- type: entity # Forge-Add-Start
  parent: N14IDPassportTownsfolk
  id: N14IDShopkeeperHelperTown
  name: ShopkeepersHelper ID
  description: Either by merit or by nepotism, you are here to help out at the general store. Learn what you can to eventually run your own caravan or shopfront.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential
  - type: PresetIdCard
    job: TownShopkeeperHelper # Forge-Add-End

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDPassportTownMechanic
  name: mechanics ID
  description: Good mechanics are hard to find in the wasteland, ones willing to put up with noisy drifters are even harder to find. And so your services are in demand, and well paid.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential
  - type: PresetIdCard
    job: TownMechanic

- type: entity
  parent: N14IDDoctor
  id: N14IDDoctorTown
  name: doctors ID
  description: Someone has to fix up your friends and neighbors when they get hurt, it might as well be someone who knows what they're doing. Hopefully that person is you.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: doctor
  - type: PresetIdCard
    job: TownDoctor
  - type: ClothingAddFaction
    faction: Townsfolk

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDReporterTown
  name: reporter ID
  description: Issued by the mayor's office to the citizens that make the most noise out of local happenings, this passport gives you a non-existant level of authority to pester the dangerous and powerful in the region for radio show content.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential
  - type: PresetIdCard
    job: WastelandReporter
  - type: ClothingAddFaction
    faction: Townsfolk

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDBartenderTown
  name: innkeeper ID
  description: People come to you with their problems and a desire to eat something besides pre-war processed junk food. So pour a drink, act as a non-licensed therapist, cook up some greasy eggs and meat, and possibly squeeze out a few caps.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport_presidential
  - type: PresetIdCard
    job: WastelandBartender
  - type: ClothingAddFaction
    faction: Townsfolk

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDBadgeTownDeputy
  name: town guard badge
  description: This tin badge marks you as one of the town's deputies, a person who has volunteered to help keep your settlement safe from drifters and raiders. Its up to you to prove that you should be trusted with that responsibility.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: deputy
  - type: PresetIdCard
    job: TownDeputy

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDBadgeTownSheriff
  name: town marshal badge
  description: This tin badge is worn by the town's marshal, someone who survived long enough as a deputy to prove their mettle and outlive their competition for the job. Advise the mayor and keep the town of out the clutches of outsiders.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: sheriff
  - type: PresetIdCard
    job: TownSheriff

- type: entity
  parent: N14IDPassportTownsfolk
  id: N14IDBadgeTownMayor
  name: town mayor badge
  description: This badge marks you as the mayor of the town, chosen by the citizens to lead them to prosperity and safety. If you fail they'll strip this off your body and toss you out of the gates.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: mayor
  - type: PresetIdCard
    job: TownMayor

- type: entity
  parent: N14IDPassportPhoto
  id: N14IDPassportWasteChaplain
  name: chaplain ID
  description: These papers mark you as a community leader in the local settlement, someone who can be trusted to act as a charity worker, spiritual guide and therapist. Its up to you to make these people care.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport
  - type: PresetIdCard
    job: WastelandChaplain
  - type: ClothingAddFaction # Forge-Add
    faction: Townsfolk

# Wastelanders
- type: entity
  parent: N14IDPassportPhoto
  id: N14IDPassportWasteFarmer
  name: farmer ID
  description: These papers mark you as a citizen of some merit, who can be trusted to grow food to keep everyone fed and not waste the seeds. Keep the crops alive and the innkeeper's storage full, and people will appreciate your efforts.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: passport
  - type: PresetIdCard
    job: WastelandFarmer

#MARK: Raiders / Tribes
- type: entity
  parent: N14IDPassportBlank
  id: N14IDTribeSawbonePendant
  name: healer pendant
  description: This talisman marks a member of the local village, a valued spiritual leader in the tribal community. A name has been etched into the ancient bonesaw.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: sawbone
  - type: PresetIdCard
    job: TribalShaman # #Misfits Fix - updated job ID after TribalHealer was renamed to TribalShaman
  # #Misfits Add - enables Tree TacMap tracking without dropping the inherited door tag.
  - type: Tag
    tags:
    - IdCardTribe
    - DoorBumpOpener
