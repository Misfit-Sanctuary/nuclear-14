# ID Cards
- type: entity
  parent: Clothing
  id: N14IDCard
  name: identification card
  description: A key to open certain doors.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/id_cards.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    heldPrefix: default
    size: Small
  - type: Access
  - type: IdCard
  - type: NanoChatCard # #Misfits Add - PipBoy Hub requires NanoChatCard for number assignment and messaging
  - type: StationRecordKeyStorage
  - type: Tag
    tags:
    - DoorBumpOpener

