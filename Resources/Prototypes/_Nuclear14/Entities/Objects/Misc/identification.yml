#MARK: Enclave
- type: entity
  parent: N14IDPassportBlank
  id: N14IDEnclaveTrooper
  name: holotag
  description: These holotags are proof you are a loyal piece of government property.
  suffix: Trooper
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: enclave_trooper
  - type: IdCard # #Misfits Add - display "holotags" instead of default "ID card"
    nameLocId: n14-id-holotag-name
    fullNameLocId: n14-id-holotag-full-name
  # - type: PresetIdCard
  #   job: EnclaveTrooper
  # #Misfits Change - enables Enclave shared map (tactical helmet HUDs, Pip-Boy)
  - type: Tag
    tags:
    - IdCardEnclave

- type: entity
  parent: N14IDPassportBlank
  id: N14IDEnclaveOfficer
  name: holotag
  description: Lead your fellow patriots to victory, and make sure everyone else remembers why America is the best country in the world.
  suffix: Officer
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: enclave_officer
  - type: IdCard # #Misfits Add - display "holotags" instead of default "ID card"
    nameLocId: n14-id-holotag-name
    fullNameLocId: n14-id-holotag-full-name
  # #Misfits Fix - Tag officer holotags so the Enclave TacMap Overwatch tracks them
  # (only Trooper holotags were tagged before, leaving officers off the Enclave feed).
  - type: Tag
    tags:
    - IdCardEnclave
  # - type: PresetIdCard
  #   job: EnclaveOfficer

- type: entity
  parent: N14IDPassportBlank
  id: N14IDEnclaveNoncombat
  name: holotag
  description: These holotags mark you as a valuable asset to the government, and a very valuable hostage to everyone else.
  suffix: Scientist , Noncombat
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: enclave_noncombat
  - type: IdCard # #Misfits Add - display "holotags" instead of default "ID card"
    nameLocId: n14-id-holotag-name
    fullNameLocId: n14-id-holotag-full-name
  # #Misfits Fix - Tag noncombat holotags so the Enclave TacMap Overwatch tracks them
  # (scientists/noncombat were missing the Enclave tag entirely).
  - type: Tag
    tags:
    - IdCardEnclave
  # - type: PresetIdCard
  #   job: EnclaveScientist

# MARK: NCR
- type: entity
  parent: N14IDPassportBlank
  id: N14IDNCRDogtag
  name: recruit's dogtags
  description: With any luck, this war will be over in time for the holidays.
  suffix: Recruit #Misfits Change - was Soldier, Cadet
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ncrdogtag
  - type: IdCard
    nameLocId: n14-id-dogtag-name
    fullNameLocId: n14-id-dogtag-full-name
  - type: PresetIdCard
    job: NCRCadet #Misfits Change - was NCRSoldier
  - type: Tag
    tags:
    - IdCardNCR  # #Misfits Change - enables NCR shared map in Pip-Boy; all NCR dogtags inherit this via parent
  - type: ClothingAddFaction
    faction: NCR

- type: entity
  parent: N14IDNCRDogtag
  id: N14IDNCRDogtagDoctor
  name: doctor's dogtags
  description: Killing a medic is a war crime, and these dogtags should prevent that. But most people in the wasteland will make a point of shooting you first.
  suffix: Doctor
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: ncrdogtag
  - type: PresetIdCard
    job: NCRMedic

