- type: entity
  parent: ClothingBackpack
  id: N14ClothingBackpackRadioNCR
  name: NCR radio backpack
  description: A hard-wearing radio backpack worn by the NCR.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Back/Backpacks/backpackncrradio.rsi
  - type: Headset
    requiredSlot: BACK
    # #Misfits Add - passively receive PBS (Broadcast) without a key; transmit requires EncryptionKeyPBS
    passiveChannels:
    - PBS
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyNCR
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: ClothingSpeedModifier
    walkModifier: 0.975
    sprintModifier: 0.975
  - type: HeldSpeedModifier

