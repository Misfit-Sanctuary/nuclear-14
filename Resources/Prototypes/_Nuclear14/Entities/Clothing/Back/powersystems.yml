- type: entity
  parent: [Clothing, ContentsExplosionResistanceBase]
  id: N14ClothingPowerSystemsBack
  name: armor power systems
  description: The power systems of a suit of armour, they ensure that you can even move.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Back/PowerSystems/basic.rsi
    state: icon
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    sprite: _Nuclear14/Clothing/Back/PowerSystems/basic.rsi
    slots:
    - back
  - type: ClothingSpeedModifier
    walkModifier: 4.5 # Don't be alarmed, it's this high to compensate for the suit's base slowdown.
    sprintModifier: 4.5
  - type: TemperatureProtection
    coefficient: 0.75
  - type: FireProtection
    reduction: 0.1

- type: entity
  parent: N14ClothingPowerSystemsBack
  id: N14ClothingPowerSystemsBackX02
  # #Misfits Change - Renamed X-02 -> APA MK II
  name: APA MK II armor power systems
  description: The refined power management system of X-02 Power Armor.
  categories: [ HideSpawnMenu ]
  components:
  - type: ClothingSpeedModifier
    walkModifier: 4.75 # Don't be alarmed, it's this high to compensate for the suit's base slowdown.
    sprintModifier: 4.75

- type: entity
  parent: N14ClothingPowerSystemsBack
  id: MisfitsCombustionEnginePowerSystemsBack
  name: combustion engine
  description: A jury-rigged combustion generator bolted where a fusion core once sat. Burns welding fuel to drive a hydraulic pump, pressurizing lines that run to piston actuators at each joint. Heavy, loud, and hot, but it keeps the suit moving when supply lines run dry. Internal tank holds 300 units of welding fuel.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Power/power.rsi
    state: diesel-off
    layers:
    - state: diesel-off
      map: [ "enum.CombustionEngineVisualLayers.Body" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    sprite: _Nuclear14/Structures/Power/power.rsi
    slots:
    - back
  - type: SolutionContainerManager
    solutions:
      fuel:
        maxVol: 300
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 300
  - type: RefillableSolution
    solution: fuel
  - type: AmbientSound
    sound: /Audio/_Misfits/N14/Machines/gennie.ogg
    range: 3
    volume: -8
    enabled: false
  - type: ExaminableSolution
    solution: fuel
    heldOnly: false
  - type: CombustionEngine
    fuelSolution: fuel
    fuelReagent: WeldingFuel
    fuelUsePerSecond: 0.15
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.CombustionEngineVisuals.Running:
        Body:
          True: { state: diesel-on }
          False: { state: diesel-off }
