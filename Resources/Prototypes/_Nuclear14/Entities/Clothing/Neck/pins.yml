# #Cythisiax Edited - each rank pin carries its own rank, whoever wears it gets the prefix in chat
- type: entity
  parent: ClothingNeckPinBase
  id: ClothingNeckPinNCRRecruit
  name: ncr recruit rank pin
  description: This shiny rank pin is handed out to those who have just joined the NCRA. Don't forget to pin it to your clothes!
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Neck/Misc/pins.rsi
    layers:
    - state: recruit
  - type: Clothing
    sprite: _Nuclear14/Clothing/Neck/Misc/pins.rsi # #Cythisiax Fixed - leading slash pointed outside /Textures, worn pins showed the error sprite
    clothingVisuals:
      neck:
      - state: empty-equipped
  - type: Tag
    tags:
    - SuperMutantWearable
  - type: FactionRank
    name: Recruit
    prefix: RCT
    paygrade: E-1
    color: "#d77715"

