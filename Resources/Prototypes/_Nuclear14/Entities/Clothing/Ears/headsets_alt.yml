# #Misfits Add — Followers of the Apocalypse headset; grants both faction and wasteland channels
- type: entity
  parent: N14ClothingHeadsetLightScribe
  id: N14ClothingHeadsetFollowers
  name: Followers radio headset
  description: A headset manufactured in the Boneyard's factories, used by the Followers of the Apocalypse to coordinate their paramedics in the field and manage their charitable efforts with local communities.
  components:
  - type: Item
    heldPrefix: off
    size: Small
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyFollowersUR
      - EncryptionKeyWastelandGlobal
  - type: Sprite
    sprite: _Misfits/Clothing/Ears/Headsets/followerslight.rsi
    layers:
    - state: icon
    - state: light-icon
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Clothing
    sprite: _Misfits/Clothing/Ears/Headsets/followerslight.rsi
    equippedPrefix: off
