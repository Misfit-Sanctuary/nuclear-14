- type: entity
  abstract: true
  parent: Clothing
  id: N14ClothingHeadsetAlt
  name: headset
  description: An earpiece with a built-in intercom, it takes encryption keys and is your main method of communication long distance.
  components:
  - type: Headset
    # #Misfits Add - all N14 headsets passively receive PBS (Broadcast) without a key; transmit requires EncryptionKeyPBS
    passiveChannels:
    - PBS
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommonUR
      - EncryptionKeyWastelandGlobal
  - type: EncryptionKeyHolder
    keySlots: 4
  - type: Sprite
    scale: 0.75, 0.75
    state: icon
  - type: Clothing
    # equippedPrefix: alt
    slots:
    - ears
  - type: Item
    size: Small

- type: entity
  parent: N14ClothingHeadsetAlt
  id: N14ClothingHeadsetVaulttec #No longer used, all Vault dwellers got the same headset now
  name: Vault-Tec headset
  description: A pre-war over-ear headset manufactured by Vault-Tec, issued to generations of vault dwellers and re-used by their descendants.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyStationMasterUR
      - EncryptionKeyWastelandGlobal
  - type: Sprite
    sprite: Clothing/Ears/Headsets/centcom.rsi
  - type: Clothing
    sprite: Clothing/Ears/Headsets/centcom.rsi

