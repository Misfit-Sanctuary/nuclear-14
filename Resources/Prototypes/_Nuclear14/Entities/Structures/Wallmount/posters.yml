- type: entity
  parent: BaseSign
  id: N14PosterBase # For 64x64 posters
  name: Poster
  suffix: Mapping
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: Overdoors
    sprite: _Nuclear14/Structures/Wallmounts/Posters/vault-tec.rsi
    scale: 0.45, 0.45
    snapCardinals: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: Transform
    anchored: true
    noRot: true

# NCR Propaganda+
- type: entity
  parent: N14SignNotice
  id: N14PosterWanted
  name: Old Bounty Ad
  description: A wanted poster for some drifter, this one is decades old. The face and name have long since faded away.
  components:
  - type: Sprite
    state: wanted_poster

# NCR Propaganda+
- type: entity
  parent: N14SignNotice
  id: N14PosterWantedGoose
  name: Nate the Rake Bounty Ad
  description: A wanted poster all the way from the occupied territory of Canada, likely around the time the bombs dropped. It appears to be a bounty posted by Canadian rebels for a war criminal from the United States military.
  components:
  - type: Sprite
    state: wanted_poster_goose

- type: entity
  parent: N14SignNotice
  id: N14PosterFallout
  name: Never Forget
  description: A post-war poster depicting a nuclear bomb going off in an American city. It urges the viewer to remember the mistakes of our ancestors and not repeat them.
  components:
  - type: Sprite
    state: poster_fallout

- type: entity
  parent: N14SignNotice
  id: N14PosterWecan
  name: We Can Do It!
  description: A post-war poster depicting a wastelander in overalls giving a thumbs up to the viewers. It urges you to start working in local salvage operations for competitive pay.
  components:
  - type: Sprite
    state: poster_wecan

- type: entity
  parent: N14SignNotice
  id: N14PosterNCR1
  name: NCR Propaganda - Help Build Your Future!
  suffix: wrench
