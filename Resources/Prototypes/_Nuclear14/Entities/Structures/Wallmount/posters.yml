- type: entity
  parent: N14PosterNCR1
  id: N14PosterNCR2
  name: NCR Propaganda - Enlist Today!
  suffix: enlist
  description: Fight for freedom, fight for the safety of your friends and family!
  components:
  - type: Sprite
    state: ncr_enlist

- type: entity
  parent: N14PosterNCR1
  id: N14PosterNCR3
  name: NCR Propaganda - Information Security
  suffix: looselip
  description: What I know - I keep to MYSELF! Careless talk costs lives!
  components:
  - type: Sprite
    state: ncr_looselip

- type: entity
  parent: N14PosterNCR1
  id: N14PosterNCR4
  name: NCR Propaganda - We Want YOU!
  suffix: you
  description: NCR Trooper... YOU bring democracy to this land!
  components:
  - type: Sprite
    state: ncr_you

- type: entity
  parent: N14PosterNCR1
  id: N14PosterNCR5
  name: NCR Propaganda - Military Espionage
  suffix: espionage
  description: Only you can prevent MILITARY ESPIONAGE! Be careful who you talk to, and secure your documents or radio headsets!
  components:
  - type: Sprite
    state: ncr_espionage

- type: entity
  parent: N14PosterNCR1
  id: N14PosterNCR6
  name: NCR Propaganda - Join the War Effort!
  suffix: bombs
