- type: entity
  parent: BaseSign
  id: N14SignBase # for non directional signs otherwise remove snapCardinals: true
  abstract: true
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: Overdoors
    sprite: _Nuclear14/Structures/Wallmounts/adverts.rsi
    snapCardinals: true # one direction
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# Flags
- type: entity
  parent: N14SignBase
  id: N14FlagWallUS
  name: Flag of the United States
  suffix: US
  description: The banner of the United States, an empire that fell over two centuries ago. Even with its dissolution in the Great War, many still believe the nation stands so long as its people believe in it.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Wallmounts/walldecor.rsi
    state: flag_us
  - type: Construction
    graph: MisfitsFlagUS
    node: flagus


- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallChina
  name: Flag of the People's Republic of China
  suffix: China
  description: The banner of the People's Republic of China, it existed over a century, inheritor of an empire of 3500 years, but its ultimate fate is a mystery in this wasteland.
  components:
  - type: Sprite
    state: flag_china
  - type: Construction
    graph: MisfitsFlagCH
    node: flagch

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallCalifornia
  name: Flag of the State of California
  suffix: California
  description: The banner of the State of California, home of both the Brotherhood of Steel and New California Republic's foundation. It is regarded by many as the state where America began to truly rebuild.
  components:
  - type: Sprite
    state: flag_cali
  - type: Construction
    graph: MisfitsFlagCI
    node: flagci

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallArizona
  name: Flag of the State of Arizona
  suffix: Arizona
  description: The banner of the State of Arizona, which is now the home of Caesar's Legion. Once a hive of lawless violence, the Legion's structured violence has now made it a safe place for civilians to live.
  components:
  - type: Sprite
    state: flag_arizona
  - type: Construction
    graph: MisfitsFlagAZ
    node: flagaz

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallEnclave
  name: Flag of the U.S. Army
  suffix: Enclave
  description: The banner of the U.S. Army, the descendents of America's elite who claim to be the true inheritors of the United States federal government.
  components:
  - type: Sprite
    state: flag_enclave
  - type: Construction
    graph: MisfitsFlagEN
    node: flagen

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallNCR
  name: Flag of the New California Republic
  suffix: NCR
  description: The banner of the New California Republic, a nation that despite enemies within and without, has done its best to provide comfort and equality to its citizens.
  components:
  - type: Sprite
    state: flag_ncr
  - type: Construction
    graph: MisfitsFlagNCR
    node: flagncr

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallLegion
  name: Flag of Caesar's Legion
  suffix: Legion
  description: The banner of Caesar's Legion, a slave army under the mighty warlord Caesar, whose monumental ego and sharp wit have seen the lawless east fall in line under his iron boot.
  components:
  - type: Sprite
    state: flag_legion
  - type: Construction
    graph: MisfitsFlagLE
    node: flagle

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallRangers
  name: Flag of the NCR Rangers
  suffix: Rangers
  description: The banner of the New California Republic Rangers, an elite military division in the New California Republic Army. Founded by the legendary Seth of Shady Sands, if you need a problem handled, call the Rangers.
  components:
  - type: Sprite
    state: flag_rangers
  - type: Construction
    graph: MisfitsFlagRG
    node: flagrg

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallWesternBrotherhood
  name: Flag of the Brotherhood of Steel
  suffix: BOS
  description: The banner of the Brotherhood of Steel, descendents of the United States military who now attempt to confiscate and safeguard dangerous technology to prevent another apocalypse.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Wallmounts/walldecor2.rsi
    state: flag_midwest
  - type: Construction
    graph: MisfitsFlagBOSW
    node: flagbosw

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallWashingtonBrotherhood
  name: Flag of the Washington Brotherhood of Steel
  suffix: Washington BOS
  description: The banner of the Washington Brotherhood of Steel, a chapter that split off from the Midwest Brotherhood and settled into Seattle, turning to conscription, slavery, and violent oppression of the locals under the rule of the Elder Immortal.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Wallmounts/walldecor3.rsi
    state: flag_washing
  - type: Construction
    graph: MisfitsFlagBOSE
    node: flagbose

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallColorado
  name: Flag of the State of Colorado
  suffix: colorado
  description: The banner of the State of Colorado. It served as a testing ground before the Great War for cyberdog police units, which saw heavy use when the Food Riots began in earnest.
  components:
  - type: Sprite
    state: flag_colorado
  - type: Construction
    graph: MisfitsFlagCL
    node: flagcl

- type: entity
  parent: N14FlagWallUS
  id: N14FlagWallDenver
  name: Flag of the City of Denver
  suffix: denver
  description: The banner of the city of Denver, Colorado. Home of the Hangdogs tribe, its stiff resistance nearly caused Caesar's Legion to break, until Legate Lanius forced the tribe's surrender by burning their dogs alive.
  components:
  - type: Sprite
    state: flag_denver
  - type: Construction
    graph: MisfitsFlagDE
    node: flagde

# Decor
- type: entity
  parent: N14SignBase
  id: N14WallDecorClock
  name: broken clock
  description: A clock. Looks like your time is up.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Wallmounts/walldecor.rsi
    snapCardinals: false
    state: clock

- type: entity
  parent: N14WallDecorClock
  id: N14WallDecorCalendar
  name: old calendar
  description: A calendar printed centuries ago, it has no purpose now.
  components:
  - type: Sprite
    snapCardinals: true
    state: calendar

- type: entity
  parent: N14WallDecorClock
  id: N14WallDecorCalendar1
  name: dusty calendar
  description: A calendar that never saw use, its opportunity has passed.
  components:
  - type: Sprite
    snapCardinals: true
    state: calendar_blank

- type: entity
  parent: N14WallDecorClock
  id: N14WallDecorCross
  name: cross
  description: Nations may rise and fall, but belief can be even harder to kill.
  components:
  - type: Sprite
    snapCardinals: true
    state: cross

- type: entity
  parent: N14WallDecorClock
  id: N14WallDecorWallscreen
  name: wall screen
  description: A cluster of monitors hung on the wall.
  components:
  - type: Sprite
    state: wallscreen
