# Late join spawnpoints (matrix, edge of map usually)

- type: entity
  id: N14LatejoinMarkerBase
  abstract: true
  description: right click > enter, to leave the round.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _Nuclear14/Structures/Walls/nc14/matrix.rsi
    state: matrix
  - type: Cryostorage
  - type: DragInsertContainer
    containerId: storage
  - type: ExitContainerOnMove
    containerId: storage
  - type: ContainerContainer
    containers:
      storage: !type:ContainerSlot
  - type: InteractionOutline

- type: entity
  name: latejoin spawn point
  parent: N14LatejoinMarkerBase
  id: N14SpawnPointLatejoin
  suffix: Wastelander
  components:
  - type: SpawnPoint
    spawn_type: LateJoin

# Brotherhood Midwest

- type: entity
  parent: N14SpawnPointLatejoin
  id: N14SpawnPointLatejoinMidwestCommander
  suffix: BOS Midwest Commander
  components:
  - type: SpawnPoint
    job_id: BoSMidPaladinCommander
    spawn_type: LateJoin

# Mapper-only paired warpers. A row can contain multiple copies of the same endpoint: every
# AtoB targets a BtoA, never another AtoB (and likewise for C/D, F/G, and J/H). If multiple
# opposite endpoints exist, travel selects one of them. These are not latejoin or cryo points.
- type: entity
  id: MisfitsWarperPointBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _Nuclear14/Structures/Walls/nc14/matrix.rsi
    state: matrix
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      warp-trigger:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        hard: false
        mask:
        - MobMask
        layer:
        - Impassable
  - type: StepTrigger
    stepOn: true
    requiredTriggeredSpeed: 0
    intersectRatio: 0.2

- type: entity
  parent: MisfitsWarperPointBase
  id: MisfitsWarperPointAtoB
  name: warper point A to B
  suffix: walk-over warp to B
  components:
  - type: AutoWarper
  - type: WarpPoint
    id: MisfitsWarperPointAtoB
    location: Misfits Warper Point A to B

- type: entity
  parent: MisfitsWarperPointBase
  id: MisfitsWarperPointBtoA
  name: warper point B to A
  suffix: walk-over warp to A
  components:
  - type: AutoWarper
  - type: WarpPoint
    id: MisfitsWarperPointBtoA
    location: Misfits Warper Point B to A

