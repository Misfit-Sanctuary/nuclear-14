- type: reagent
  id: M14BaseProduceExtract
  parent: BaseDrink
  abstract: true
  group: Extracts
  metabolisms:
    Drink:
      effects:
      - !type:AdjustReagent
        reagent: Nutriment
        amount: .2
      - !type:AdjustReagent
        reagent: Water
        amount: .2
    Poison:
      effects:
      - !type:HealthChange
        damage:
          types:
            Radiation: .1 # TODO: need more in-depth and nuanced way to handle radiation


