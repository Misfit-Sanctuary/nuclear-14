- type: reagent
  id: SuperStimpak #used in super stimpacks
  name: reagent-name-super-stimpak
  group: Chems
  desc: reagent-desc-super-stimpak
  physicalDesc: reagent-physical-desc-gleaming
  color: "#ff113a"
  metabolisms:
    Medicine:
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: SuperStimpakAmbient
        cooldown: 40
        messageKeys:
        - drug-ambience-super-stimpak-1
        - drug-ambience-super-stimpak-2
        - drug-ambience-super-stimpak-3
        - drug-ambience-super-stimpak-4
        - drug-ambience-super-stimpak-5
        - drug-ambience-super-stimpak-6
        - drug-ambience-super-stimpak-7
      - !type:HealthChange
        damage:
          groups:
            Burn: -9 # 150 healing of every type over 50 seconds
            Brute: -9 # 150 healing of every type over 50 seconds
