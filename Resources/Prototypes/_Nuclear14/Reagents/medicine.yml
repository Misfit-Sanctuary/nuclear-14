#MARK: Healing
- type: reagent
  id: Stimpak #used in regular stimpacks
  #Misfits Change /Fix:/ aligned metabolism effects list items under the same sequence.
  name: reagent-name-stimpak
  group: Chems
  desc: reagent-desc-stimpak
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Medicine:
      metabolismRate: 1.0
      effects:
        - !type:AmbientDrugFlavorText
          cooldownId: StimpakAmbient
          cooldown: 45
          messageKeys:
          - drug-ambience-stimpak-1
          - drug-ambience-stimpak-2
          - drug-ambience-stimpak-3
          - drug-ambience-stimpak-4
          - drug-ambience-stimpak-5
          - drug-ambience-stimpak-6
          - drug-ambience-stimpak-7
        - !type:HealthChange
          damage:
            groups:
              Burn: -9 # 9/3 = 3 | 3*25 = 75 of every type in 25 seconds.
              Brute: -9 # 9/3 = 3 | 3*25 = 75 of every type in 25 seconds.
              Airloss: -3
        - !type:ModifyBleedAmount
          amount: -2
        - !type:ChemVomit
          conditions:
          - !type:ReagentThreshold
            min: 30

- type: reagent
  id: DirtyStimpak
  name: reagent-name-dirty-stimpak
  group: Chems
  desc: reagent-desc-dirty-stimpak
  physicalDesc: reagent-physical-desc-soothing
  color: "#934435"
  metabolisms:
    Medicine:
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: DirtyStimpakAmbient
        cooldown: 45
        messageKeys:
        - drug-ambience-dirty-stimpak-1
        - drug-ambience-dirty-stimpak-2
        - drug-ambience-dirty-stimpak-3
        - drug-ambience-dirty-stimpak-4
        - drug-ambience-dirty-stimpak-5
        - drug-ambience-dirty-stimpak-6
        - drug-ambience-dirty-stimpak-7
      - !type:GenericStatusEffect # Misfits Add: mark entity as having an active recovery drug — enables 2s crit stand-up
        key: RecoveryDrugActive
        component: RecoveryDrugActiveComponent
        type: Add
        time: 3
        refresh: true
      - !type:HealthChange
        damage:
          groups:
            Burn: -2.0
            Brute: -2.0
            Airloss: -2.0
          types:
            Radiation: 0.25
            Poison: 0.25
      - !type:ModifyBleedAmount
        amount: -1
      - !type:HealthChange # to prevent doping
        conditions:
        - !type:ReagentThreshold
          min: 30
        damage:
          groups:
            Burn: -1.0
            Brute: -1.0
            Airloss: -1.0
          types:
            Poison: 0.75
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 50
        - !type:MobStateCondition #Misfits Tweak: OD can push to crit but never kill
        damage:
          types:
            Poison: 1

- type: reagent
  id: HealingPowder
  name: reagent-name-healing-powder
  group: Chems
  desc: reagent-desc-healing-powder
  physicalDesc: reagent-physical-desc-soothing
  color: "#00e5ff"
  metabolisms:
    Medicine:
      metabolismRate: 0.1 # Slow
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: HealingPowderAmbient
        cooldown: 150 # Misfits Tweak: raised from 55 — was flooding chat when multiple doses stacked
        messageKeys:
        - drug-ambience-healing-powder-1
        - drug-ambience-healing-powder-2
        - drug-ambience-healing-powder-3
        - drug-ambience-healing-powder-4
        - drug-ambience-healing-powder-5
        - drug-ambience-healing-powder-6
        - drug-ambience-healing-powder-7
      - !type:GenericStatusEffect
        key: HealingPowderHaze
        component: HealingPowderHaze
        type: Add
        time: 14
        refresh: true # Misfits Fix: was false — caused 14s effect to expire then re-add on every metabolism tick, looping the blur forever
      - !type:HealthChange
        damage: # Healing Powder is quite cheap to produce, and thus should not be as effective as it was, especially with more alternatives now in the game.
          groups:
            Burn: -1
            Brute: -1.75
      - !type:ModifyBleedAmount
        amount: -0.5
      - !type:ChemVomit
        conditions:
        - !type:ReagentThreshold
          min: 30
      - !type:SuppressChronicPainReagent
        SuppressionTime: 180

# Strong overtime healing
- type: reagent
  id: TraumaPowder
  name: reagent-name-trauma-powder
  group: Medicine
  desc: reagent-desc-trauma-powder
  physicalDesc: reagent-physical-desc-exotic-smelling
  color: "#990000"
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      - type: flavor
        id: lostfriendship
        flavorType: Complex
        description: flavor-complex-lost-friendship
      - !type:AmbientDrugFlavorText
        cooldownId: TraumaPowderAmbient
        cooldown: 55
        messageKeys:
        - drug-ambience-trauma-powder-1
        - drug-ambience-trauma-powder-2
        - drug-ambience-trauma-powder-3
        - drug-ambience-trauma-powder-4
        - drug-ambience-trauma-powder-5
        - drug-ambience-trauma-powder-6
        - drug-ambience-trauma-powder-7
      - !type:HealthChange
        damage: # Trauma powder is a 2x2, and can only have 5u, non grindable, non dissolvable. it can be quite good.
          groups:
            Burn: -9
            Brute: -9
            Airloss: -12
          types:
            Poison: -2
            Radiation: -1.5
      - !type:ModifyBleedAmount
        amount: -2.5
      - !type:SuppressChronicPainReagent
        SuppressionTime: 3600

