- type: entity
  name: bible
  description: New Interstellar Version 2340
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -15
        Burn: -15
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      groups:
        Burn: 10
  - type: Prayable
    bibleUserOnly: true
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: MeleeWeapon # Nyanotrasen - Bibles do Holy damage
    damage:
      types:
        Blunt: 4
        Holy: 20
    heavyRateModifier: 1.25
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 5
    maxTargets: 4
  - type: Tag
    tags:
    - Book
  - type: StealTarget
    stealGroup: Bible
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

- type: entity
  parent: Bible
  name: necronomicon
  description: "There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    locPrefix: "necro"
    healSound: "/Audio/Effects/lightburn.ogg"
  - type: Summonable
    specialItem: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  id: ActionBibleSummon
  name: Summon familiar
  description: Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    icon: { sprite: Clothing/Head/Hats/witch.rsi, state: icon }
    event: !type:SummonActionEvent
    useDelay: 1

- type: entity
  parent: BaseItem
  name: Flame of Mars
  description: A Special Torch carried by the Priesthood of Mars, ignited with an unnaturally red flame, said to be able to heal those he favors.
  id: BibleMars
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Items/Flare/flare_on.ogg
    soundDeactivate:
      path: /Audio/Items/candle_blowing.ogg
  - type: Sprite
    sprite: Objects/Misc/torch.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: torch_unlit
    # #Misfits Fix: Use plain string key so ToggleableLightVisualsSystem (SpriteLayer is string?) can find this layer via LayerMapTryGet.
    # Previously used enum.ExpendableLightVisualLayers.Glow which caused a string/enum key mismatch, preventing the fire sprite from showing on the ground.
    - map: [ "torch_glow" ]
      state: lit_overlay
      color: "#df0f0f"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: torch_nocloth
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      groups:
        Brute: -25
        Burn: -25
        Toxin: -10 #pretty fucking useful in the nucelar apocalypse
    damageOnFail:
      groups:
        Brute: 15
        Airloss: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      groups:
        Burn: 25 #Mars smite thee, profligate
  - type: Prayable
    bibleUserOnly: true
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Icon
    sprite: Objects/Misc/torch.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/torch.rsi
    heldPrefix: unlit
  - type: ToggleableLightVisuals
    spriteLayer: torch_glow
    inhandVisuals:
      left:
      - state: lit-inhand-left
        shader: unshaded
      right:
      - state: lit-inhand-right
        shader: unshaded
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#df0f0f"
    radius: 5.0
    energy: 7.0
    netsync: false
  - type: Clothing
    slots:
    - Belt
  - type: MeleeWeapon # Nyanotrasen - Bibles do Holy damage
    damage:
      types:
        Blunt: 5
        Heat: 35 # more in line with Misfits melee meta.
    heavyRateModifier: 1.25
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 5
    maxTargets: 4
  - type: IgnitionSource
    temperature: 400
    ignited: false
  - type: ItemToggleHot
  - type: ItemTogglePointLight
  - type: Tag
    tags:
    - Torch
