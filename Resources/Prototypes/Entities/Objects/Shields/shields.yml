- type: entity
  name: makeshift shield
  parent: BaseShield
  id: MakeshiftShield
  description: A rundown looking shield, not good for much.
  components:
    - type: Sprite
      state: makeshift-icon
    - type: Item
      heldPrefix: metal
    - type: Blocking
      passiveBlockFraction: .31 # thin as hell
      activeBlockFraction: .31
      passiveBlockModifier:
        coefficients: # Need about 1018 HP to outlive shield for .95 mod
          Piercing: .95
          Heat: .90
          Structural: .95 #
          Blunt: .95
          Slash: .8
          Caustic: 5.0
          Shock: 3
      activeBlockModifier:
        coefficients: # Need about 1018 HP to outlive shield for .95 mod
          Piercing: .95
          Heat: .90
          Structural: .95 #
          Blunt: .95
          Slash: .8
          Caustic: 5.0
          Shock: 3
    - type: Reflect
      innate: true # movement shield
      reflects:
        - Energy
      reflectProb: 0.01
      reflectProbByType:
        Energy: 0.01 # i dunno tin is reflective
      spread: 150
    - type: ClothingSpeedModifier # thin shield lol
      walkModifier: 0.95
      sprintModifier: 0.95
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: Construction
      graph: MakeshiftShield
      node: makeshiftShield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 300
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
        - trigger:
            !type:DamageTrigger
            damage: 400
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                MakeshiftShield_broken:
                  min: 1
                  max: 1

