- type: entity
  name: base shield
  parent: BaseItem
  id: BaseShield
  description: A shield!
  abstract: true
  components:
    - type: Repairable
      fuelCost: 2
      doAfterDelay: 2
    - type: Sprite
      sprite: Objects/Weapons/Melee/shields.rsi
      state: riot-icon
    - type: Item
      sprite: Objects/Weapons/Melee/shields.rsi
      size: Ginormous
      heldPrefix: riot
    # #Misfits Fix - Add Clothing so shields can be equipped to Back / armor suitStorage (matches Legion shield behavior)
    - type: Clothing
      sprite: Objects/Weapons/Melee/shields.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.9
          Slash: 0.9
          Piercing: 0.9
          Heat: 0.9
      activeBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 0.8
        flatReductions:
          Blunt: 1
          Slash: 1
          Piercing: 1
          Heat: 1
    - type: Damageable
      damageContainer: Shield
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
        - trigger:
            !type:DamageTrigger
            damage: 40 #This is probably enough damage before it breaks
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:SpawnEntitiesBehavior
              spawn:
                SheetSteel:
                  min: 2
                  max: 2
                SheetGlass:
                  min: 2
                  max: 2
    - type: StaticPrice
      price: 5

#Security Shields

- type: entity
  name: riot shield
  parent: BaseShield
  id: RiotShield
  description: A large tower shield. Good for controlling crowds.
  components:
    - type: Reflect # #Misfits Change Add: Riot shields deflect sub-5.56mm rounds at 30%; degrades while moving.
      reflects:
        - SmallCaliber
      reflectProb: 0.3
      spread: 90
    - type: SpearBlock # #Misfits Change Add: Riot shield deflects thrown polearms.
    - type: StaticPrice
      price: 90

- type: entity
  name: riot laser shield
  parent: BaseShield
  id: RiotLaserShield
  description: A riot shield built for withstanding lasers, but not much else.
  components:
    - type: Sprite
      state: riot_laser-icon
    - type: Item
      heldPrefix: riot_laser
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Heat: 0.8
      activeBlockModifier:
        coefficients:
          Heat: 0.7
        flatReductions:
          Heat: 2

- type: entity
  name: riot bullet shield
  parent: BaseShield
  id: RiotBulletShield
  description: A ballistic riot shield built for withstanding bullets, but not much else.
  components:
    - type: Sprite
      state: riot_bullet-icon
    - type: Item
      heldPrefix: riot_bullet
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.8
          Piercing: 0.8
      activeBlockModifier:
        coefficients:
          Blunt: 0.7
          Piercing: 0.7
        flatReductions:
          Blunt: 1.5
          Piercing: 1.5

#Craftable shields

- type: entity
  name: wooden buckler
  parent: BaseShield
  id: WoodenBuckler
  description: A small round wooden makeshift shield.
  components:
    - type: Sprite
      state: buckler-icon
    - type: Item
      heldPrefix: buckler
    - type: Construction
      graph: WoodenBuckler
      node: woodenBuckler
    - type: Clothing
      sprite: Corvax/Objects/Weapons/Melee/romanbuckler.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: ClothingSpeedModifier # pretty light cause wood
      walkModifier: .95
      sprintModifier: .95
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: Blocking
      passiveBlockFraction: .90 # lower than legion
      activeBlockFraction: 1 # prolly dont wanna do this with this shield
      passiveBlockModifier:
        coefficients:
          Piercing: 0.6
          Heat: 2
          # shit-wood is naturally more suited to melee damage types
          Structural: .6
          Caustic: .6
          Blunt: .6
          Slash: .6
          Shock: .5
      activeBlockModifier:
        coefficients:
          Piercing: 0.58
          Heat: 2
          Structural: .58
          Caustic: .58
          Blunt: .58
          Slash: .58
          Shock: .4
    - type: Reflect # IT IS FUCKING WOOD REFLECTION IS UNREALISM!!!!!
      innate: false
      reflects:
        - None
      reflectProb: 0.0
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:SpawnEntitiesBehavior
              spawn:
                MaterialWoodPlank1:
                  min: 2
                  max: 2
        - trigger:
            !type:DamageTrigger
            damage: 80 # iam lazy. legion buckler but less HP
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
            - !type:SpawnEntitiesBehavior
              spawn:
                WoodenBuckler_broken:
                  min: 1
                  max: 1

    - type: StaticPrice
      price: 5
