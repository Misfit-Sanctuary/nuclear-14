  graph:
  - node: start
    edges:
    - to: saddleStorage
      steps:
      - material: Leather
        amount: 15
      - material: Cloth
        amount: 5
        doAfter: 1
  - node: saddleStorage
    entity: ClothingBrahdoSaddle_BasicStorage

