#- Waster Burrito (Crafting Menu): 1 Cooked Meat (any), 1 dough slice
- type: constructionGraph
  id: WasterBurritoGraph
  start: start
  graph:
  - node: start
    edges:
    - to: WasterBurrito
      steps:
      - allTags:
        - Meat
        - Cooked
        name: Any Cooked Meat
        icon:
          sprite: Objects/Consumable/Food/meat.rsi
          state: plain-cooked
      - entity: N14FoodDoughSlice
        name: Dough Slice
        icon: {sprite: Objects/Consumable/Food/ingredients.rsi, state: dough-slice}
  - node: WasterBurrito
    entity: MisfitsFoodWasterBurrito

#- Waster Burrito Supreme (Crafting Menu): 1 Cooked Meat (any), 1 Cabbage, 1 Cheese Wedge, 1 Tato
- type: constructionGraph
  id: WasterBurritoGraph_super
  start: start
  graph:
  - node: start
    edges:
    - to: WasterBurrito_super
      steps:
      - allTags:
        - Meat
        - Cooked
        name: Any Cooked Meat
        icon:
          sprite: Objects/Consumable/Food/meat.rsi
          state: plain-cooked
      - entity: N14FoodDoughSlice
        name: Dough Slice
        icon: { sprite: Objects/Consumable/Food/ingredients.rsi, state: dough-slice }
      - entity: N14FloraProduceWildCabbage
        name: Cabbage
        icon: { sprite: _Nuclear14/Objects/Specific/Hydroponics/cabbage.rsi, state: produce }
      - entity: N14FoodCheeseSlice
        name: Cheese Wedge
        icon: { sprite: Objects/Consumable/Food/ingredients.rsi, state: cheesewedge }
      - entity: N14FloraProduceWildTato
        name: Tato
        icon: { sprite: _Nuclear14/Objects/Consumable/Flora/wastelandflora.rsi, state: Tato }
  - node: WasterBurrito_super
    entity: MisfitsFoodWasterBurrito_super


