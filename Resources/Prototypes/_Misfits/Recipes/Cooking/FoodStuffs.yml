# red fish cutlet
- type: entity
  parent: FoodMeatBase
  id: N14RedfishCutletRaw
  components:
  - type: Food
    eatMessage: food-desc-redFishCutlet-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: redFishCutlet
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: N14UncookedAnimalProteinsRad
          Quantity: 2
        - ReagentId: Vitamin
          Quantity: 2 # Red fish has vitamins even when raw
  - type: GeneralConstructs
    generalEnts:
      Cooked: N14RedfishCutletCooked
  - type: Construction
    graph: GraphCookAny
    node: start
    defaultTarget: CookNode

