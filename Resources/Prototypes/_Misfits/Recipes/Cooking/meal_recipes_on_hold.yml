# Here we store both working (but problematic) and non-working recipes
# Both need a deeper review/fixing beyond just ID name mismatch

# Breads & Sandwiches
- type: microwaveMealRecipe
  id: MisfitsRecipeSausageRoll
  name: Sausage Roll
  result: MisfitsFoodSausageRoll
  time: 10
  reagents:
    Egg: 6 # Add more reagents? Recipe works, but 6u raw eggs turns into 6u cooked eggs causing confusion
  solids:
    N14FoodDoughSlice: 1
    MisfitsFoodSausage: 1
    
# Deserts 
- type: microwaveMealRecipe
  id: MisfitsRecipeLollipop_VaultTech
  name: VaultTech Lollipop
  result: MisfitsFoodLollipop_VaultTech
  time: 5
  reagents:
    Sugar: 5
  solids:
    SheetPaper: 1 # Parent paper category, works with SheetPaper1 but not other papers. Problematic if added to Wiki and says "1 Paper", players will get it wrong with some other paper.

# Italian
- type: microwaveMealRecipe
  id: MisfitsRecipeLasagna # Produces N14CookedFoodMealPotatoLoaded. This is fucked: we use Tato (aka tomatoes) for recipes w potatoes...
  name: Lasagna
  result: MisfitsFoodLasagna
  time: 15
  solids:
    N14FoodMeatRadRaw: 1
    N14FoodCheeseSlice: 1
    N14FoodDoughSlice: 1
    N14FloraProduceWildTato: 1 # Gotta be replaced with potatoes, but not N14FoodPotato! Rather our own potato plant (flora produce)

# Kebabs & Skewers
- type: microwaveMealRecipe
  id: MisfitsRecipeSkewerSpicySweet # has no sprite in-game, currently invisible!
  name: Spicy n' Sweet Skewer
  result: MisfitsFoodSkewerSpicySweet
  time: 5
  solids:
    N14FloraProduceWildBlackberries: 2
    FoodKebabSkewer: 1
    N14FloraProduceWildGlowpepper: 1
    
# Meat
- type: microwaveMealRecipe
  id: MisfitsRecipeSausageChain
  name: Sausage Chain
  result: MisfitsFoodSausageChain
  time: 5
  reagents:
    N14UncookedAnimalProteinsRad: 20
  solids:
    OrganAnimalRuminantStomach: 1 # this one doesn't show up in F5 (but drops from brahmin), could you check, else testing becomes a nightmare

# Sushi
- type: microwaveMealRecipe
  id: MisfitsRecipeFishCarrotRaw # ID and Result ID have "Raw". Change entity definition?
  name: Fried Carrot Fish Sushi # Name indicates it's fried
  result: MisfitsFoodSushiFishCarrotRaw # ID and Result ID have "Raw". Change entity definition?
  time: 5
  reagents:
    Rice: 10
  solids:
    N14FloraProduceWildCarrot: 1
    N14RedfishCutletCooked: 1 # ID indicates it's fried
    
- type: microwaveMealRecipe
  id: MisfitsRecipeSushiSpicyRaw
  name: Fried Spicy Sushi
  result: MisfitsFoodSushiSpicyRaw
  time: 5
  reagents:
    Rice: 10
    Hotsauce: 2
  solids:
    FoodMeatCutlet: 1 # tried replacing with N14 version N14FoodMeatRadCutlet but it didn't work with all animal types. Keep vanilla but test it.
    N14FoodMeatBighornerCutlet: 2

