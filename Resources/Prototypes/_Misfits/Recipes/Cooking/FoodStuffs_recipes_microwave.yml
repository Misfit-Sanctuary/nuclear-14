#Carrot candy: 5u sugar, 5u Buffalo Gourd Juice, must be heated
- type: reaction
  id: CarrotCandy
  impact: Low
  quantized: true
  minTemp: 370
  reactants:
    JuiceCarrot:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodCarrotCandy
#Buffalo Gourd: 5u sugar, 5u Buffalo Gourd Juice, must be heated
- type: reaction
  id: BuffaloGourdCandy
  impact: Low
  quantized: true
  minTemp: 370
  reactants:
    ExtractBuffaloGourd:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
    entity: MisfitsFoodBuffaloGourdCandy
#Blackberry: 5u sugar, 5u Blackberry juice, must be heated
- type: reaction
  id: BlackberryCandy
  impact: Low
