#Butterscotch: 5u sugar, 5u butter, must be heated
- type: reaction
  id: ButterscotchCandy
  impact: Low
  quantized: true
  minTemp: 370
  reactants:
    Butterscotch:
      amount: 5
    Sugar:
      amount: 5
  effects:
  - !type:CreateEntityReactionEffect
