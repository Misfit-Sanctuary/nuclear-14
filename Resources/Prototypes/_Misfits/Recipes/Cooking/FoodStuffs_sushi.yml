





- type: entity
  parent: BaseItem
  id: MisfitsFoodBase
  abstract: true
  components:
  - type: Temperature
  - type: FlavorProfile
    flavors:
    - food
  - type: Food
  - type: Sprite
  - type: StaticPrice
    price: 0

- type: entity
  parent: MisfitsFoodBase
  id: MisfitsFoodSmallBase
  abstract: true
  components:
  - type: Item
    size: Small


# Raw sushi
- type: entity
  parent: MisfitsFoodSmallBase
  id: MisfitsFoodSushiMeatRaw
  components:
  - type: Food
    transferAmount: 10
    eatMessage: food-desc-sushi-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: sushiRoll
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: Protein
          Quantity: 3
        - ReagentId: Nutriment
          Quantity: 3
  - type: GeneralConstructs
    generalEnts:
      Cooked: MisfitsFoodSushiMeatCooked
  - type: Construction
    graph: GraphCookAny
    node: start
    defaultTarget: CookedNode

- type: entity
  parent: MisfitsFoodSmallBase
  id: MisfitsFoodSushiMeatCooked
  components:
  - type: Food
    transferAmount: 10
    eatMessage: food-desc-sushiCooked-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: sushiRoll
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 37
        reagents:
        - ReagentId: Rice
          Quantity: 10
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Nutriment
          Quantity: 4
  - type: GeneralConstructs
    generalEnts:
      Cooked: MisfitsFoodSushiMeatCooked
  - type: Construction
    graph: GraphCookAny
    node: CookedNode
    defaultTarget: start

