- type: reaction
  id: UraniumEMP
  reactants:
    Uranium:
      amount: 5
    Iron:
      amount: 10
  effects:
  - !type:EmpReactionEffect
      # One reaction unit consumes 5u uranium and 10u iron. Five units (25u/50u)
      # reach the chemical EMP cap, which is half the strength of a pulse grenade.
      rangePerUnit: 0.4
      maxRange: 2
      energyConsumptionPerUnit: 270000
      maxEnergyConsumption: 1350000
      disableDurationPerUnit: 6
      maxDisableDuration: 30
