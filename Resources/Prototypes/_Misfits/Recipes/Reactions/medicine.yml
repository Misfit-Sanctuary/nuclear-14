# ============================================================================
# COMBAT / PERFORMANCE CHEMS
# ============================================================================

# Fury is canonically made with a Berserk syringe + Buffout in Fallout 4.
# Misfits already has Berserkermix, so use the real server precursor instead of
# approximating it with Psycho. This also makes Fury meaningfully expensive.
- type: reaction
  id: MisfitsReactionFury
  minTemp: 340
  reactants:
    Berserkermix:
      amount: 3
    Buffout:
      amount: 2
    DamageResistMixture:
      amount: 1
  products:
    MisfitsFury: 2

# MisfitsCalmex is rare/non-craftable in Fallout 4; this is a Misfits chemistry route.
- type: reaction
  id: MisfitsReactionCalmex
  minTemp: 354
  reactants:
    Mentats:
      amount: 2
    DamageResistMixture:
      amount: 2
    Daytripper:
      amount: 1
    Ethanol:
      amount: 1
  products:
    MisfitsCalmex: 2

# Fallout 4 canon: Acid x2 + Nuka-Cola x1 + Psycho x1.
- type: reaction
  id: MisfitsReactionOverdrive
  minTemp: 340
  reactants:
    SulfuricAcid:
      amount: 2
    NukaCola:
      amount: 2
    DamageModifyingMixture:
      amount: 2
    Epinephrine:
      amount: 1
  products:
    MisfitsOverdrive: 2

# X-Cell was a pre-war prototype and is not normally craftable.
# This route intentionally consumes two of Misfits' own premium precursors:
# Berserkermix supplies the extreme physical stimulant base while Promethine
# supplies the advanced cellular stabilizer. A batch should hurt to lose.
- type: reaction
  id: MisfitsReactionXCell
  minTemp: 374
  reactants:
    Buffout:
      amount: 2
    Mentats:
      amount: 2
    Daytripper:
      amount: 2
    RadX:
      amount: 2
    Epinephrine:
      amount: 2
    DamageResistMixture:
      amount: 1
    RobustMovespeedMixture:
      amount: 1
    Berserkermix:
      amount: 2
    Promethine:
      amount: 1
  products:
    MisfitsXCell: 2

# MisfitsCrank has no canonical Fallout crafting formula; server-original stimulant route.
- type: reaction
  id: MisfitsReactionCrank
  minTemp: 354
  reactants:
    Epinephrine:
      amount: 1
    Ammonia:
      amount: 1
    Ethanol:
      amount: 1
  products:
    MisfitsCrank: 3

# ============================================================================
# CUSTOM POISONS / ANTIDOTES / EMERGENCY MEDICINE
# ============================================================================

- type: reaction
  id: MisfitsReactionGhostcapExtract
  reactants:
    ExtractFungus:
      amount: 2
    ExtractDatura:
      amount: 1
  products:
    MisfitsGhostcapExtract: 3

# Black Goo is used as the toxic carrier. Since blackgoo itself destroys valuable
# healing medicine during synthesis, this makes Widows' Mercy costly even before
# the creature venoms are added.
- type: reaction
  id: MisfitsReactionWidowsMercy
  reactants:
    blackgoo:
      amount: 2
    CazadorVenom:
      amount: 2
    NightstalkerVenom:
      amount: 1
    ExtractDatura:
      amount: 2
    ExtractWhiteHorsenettle:
      amount: 2
  products:
    MisfitsWidowsMercy: 2

# Black Goo serves as the unstable medical-toxin base, then FireToxin and datura
# turn it into a fast, aggressive poison.
- type: reaction
  id: MisfitsReactionRedBellPoison
  reactants:
    blackgoo:
      amount: 1
    FireToxin:
      amount: 2
    CazadorVenom:
      amount: 1
    ExtractDatura:
      amount: 2
    ExtractGlowpepper:
      amount: 2
  products:
    MisfitsRedBellPoison: 2

# Concentrated hybrid venom. Kept simple so it can also plausibly be harvested/synthesized.
- type: reaction
  id: MisfitsReactionAshViperVenom
  reactants:
    NightstalkerVenom:
      amount: 2
    FireToxin:
      amount: 2
    CazadorVenom:
      amount: 1
  products:
    MisfitsAshViperVenom: 2

# Experimental resuscitation cocktail.
# This is intentionally one of the most expensive medicines in the tree.
# Promethine stabilizes catastrophic cellular damage, Berserkermix forces the body
# to keep moving, and a trace of Black Goo represents the dangerous incompatible-med
# intermediate that makes Lazarus as hazardous as it is effective.
- type: reaction
  id: MisfitsReactionLazarusCompound
  minTemp: 374
  reactants:
    Epinephrine:
      amount: 3
    Epoetine:
      amount: 2
    RobustHealingMixture:
      amount: 2
    Antidote:
      amount: 2
    Phalanximine:
      amount: 1
    Hyronalin:
      amount: 1
    Promethine:
      amount: 2
    Berserkermix:
      amount: 1
    blackgoo:
      amount: 1
  products:
    MisfitsLazarusCompound: 2

# Emergency wakefulness stimulant.
- type: reaction
  id: MisfitsReactionClearwake
  reactants:
    Epinephrine:
      amount: 2
    SmellingSalts:
      amount: 2
    NukaCola:
      amount: 1
    MovespeedMixture:
      amount: 1
  products:
    MisfitsClearwake: 2

# Specific antidote. A trace of Widows' Mercy is a catalyst/sample and is not consumed.
- type: reaction
  id: MisfitsReactionWidowbane
  reactants:
    Antidote:
      amount: 2
    ExtractTarberries:
      amount: 2
    MisfitsWidowsMercy:
      amount: 1
      catalyst: true
  products:
    MisfitsWidowbane: 2

# Specific antidote for Red Bell Poison; poison sample acts as a catalyst/reference.
- type: reaction
  id: MisfitsReactionCinderSerum
  reactants:
    Antidote:
      amount: 2
    ExtractCactusWater:
      amount: 2
    MisfitsRedBellPoison:
      amount: 1
      catalyst: true
  products:
    MisfitsCinderSerum: 2

