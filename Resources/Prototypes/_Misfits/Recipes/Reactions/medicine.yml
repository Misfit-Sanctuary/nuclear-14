# Misfits - proposed chemistry reactions for additional Fallout medicines / chems
#
# ============================================================================
# MEDICINE / SURVIVAL
# ============================================================================

# Broad-spectrum medicine refined from MisfitsPenicillin and Antiseptic.
- type: reaction
  id: MisfitsReactionAntibiotics
  reactants:
    MisfitsPenicillin:
      amount: 2
    Antiseptic:
      amount: 2
    Water:
      amount: 1
  products:
    MisfitsAntibiotics: 3

- type: reaction
  id: MisfitsReactionRadShield
  minTemp: 354
  reactants:
    Antiseptic:
      amount: 3
    Water:
      amount: 1
    ExtractFungusRad:
      amount: 2
    RadX:
      amount: 3
    Uranium:
      amount: 1
      catalyst: true
  products:
    MisfitsRadShield: 6

