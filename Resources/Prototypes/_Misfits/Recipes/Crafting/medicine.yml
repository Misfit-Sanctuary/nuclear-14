# ============================================================================
# CONSTRUCTION GRAPHS
# ============================================================================

# Field-medic Glowing Blood Pack.
# The normal Bloodpack already carries the Bloodpack crafting tag.
# MisfitsEthanolBottle specifically targets the N14 medical ethanol bottle.
- type: constructionGraph
  id: MisfitsGlowingBloodPack
  start: start
  graph:
  - node: start
    edges:
    - to: glowingbloodpack
      steps:
      - tag: Bloodpack
        name: blood pack
        icon:
          sprite: Objects/Specific/Medical/medical.rsi
          state: bloodpack
      - material: CaveFungusRad
        amount: 2
      - tag: MisfitsEthanolBottle
        name: ethanol bottle
        icon:
          sprite: _Nuclear14/Objects/Specific/Medical/drugs.rsi
