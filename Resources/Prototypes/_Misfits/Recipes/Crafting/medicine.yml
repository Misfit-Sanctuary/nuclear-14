- type: entity
  parent: BaseHealingItem
  id: MisfitsDaturaHide
  name: datura hide
  description: A numbing datura ointment for severe thermal burns. It is specialized for Heat damage and is poor treatment for other wounds.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
    state: ointment4
  - type: Item
    heldPrefix: ointment
  - type: Healing
    damageContainers:
    - Biological
    # BURN SPECIALIST: HEAT.
    # Strong single-type healing is the reward for diagnosing the injury correctly.
    damage:
      types:
        Heat: -12
    delay: 2.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
