# ============================================================================
# CONSTRUCTION GRAPHS
# ============================================================================

# Honest Hearts canon: Sacred Datura Root x4 + Wonderglue x1.
- type: constructionGraph
  id: MisfitsDaturaHide
  start: start
  graph:
  - node: start
    edges:
    - to: daturahide
      steps:
      - material: DaturaFlower
        amount: 4
      - tag: WonderGlue
        name: Wonderglue
        icon:
          sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
          state: wonderglue
        doAfter: 3
  - node: daturahide
    entity: MisfitsDaturaHide10

# Lonesome Road canon: Buffalo Gourd Seed x1 + Surgical Tubing x1.
# Surgical tubing does not currently exist as an N14 crafting material, so Cloth & Plastic is used.
- type: constructionGraph
  id: MisfitsSnakebiteTourniquet
  start: start
  graph:
  - node: start
    edges:
    - to: snakebitetourniquet
      steps:
      - material: WildBuffaloGourd
      - material: Cloth
        amount: 1
      - material: Plastic
        amount: 1
        doAfter: 2
  - node: snakebitetourniquet
    entity: MisfitsSnakebiteTourniquet3

# Lonesome Road canon: Vodka or Ethanol x1 + Jalapeno x1 + White Horsenettle x1.
# WildGlowpepper substitutes for jalapeno
- type: constructionGraph
  id: MisfitsFieryPurgative
  start: start
  graph:
  - node: start
    edges:
    # Medical ethanol route.
    - to: fierypurgative
      steps:
      - tag: MisfitsEthanolBottle
        name: ethanol bottle
        icon:
          sprite: _Nuclear14/Objects/Specific/Medical/drugs.rsi
          state: ethanol
      - material: WildGlowpepper
      - material: WildWhiteHorsenettle
        doAfter: 4
  - node: fierypurgative
    entity: MisfitsFieryPurgative

# Honest Hearts canon: Spore Plant Pods x1 + Barrel Cactus Fruit x1 + Cave Fungus x1.
# Broc Flower substitutes for unavailable spore-plant pods as the medicinal binder.
- type: constructionGraph
  id: MisfitsBloodShield
  start: start
  graph:
  - node: start
    edges:
    - to: bloodshield
      steps:
      - material: BarrelCactusFruit
        amount: 2
      - material: CaveFungus
        amount: 2
      - material: BrocFlower
        amount: 2
        doAfter: 4
  - node: bloodshield
    entity: MisfitsBloodShield

# Misfits-original tribal remedy.
- type: constructionGraph
  id: MisfitsPilgrimsRemedy
  start: start
  graph:
  - node: start
    edges:
    - to: pilgrimsremedy
      steps:
      - material: BrocFlower
      - material: XanderRoot
      - material: CaveFungus
      - material: AgaveLeaf
      - material: DaturaFlower
        doAfter: 3
  - node: pilgrimsremedy
    entity: MisfitsPilgrimsRemedy

# Fallout 76's regional salves use local medicinal plants + boiled water.
# This N14 version uses the same local-survival idea with Broc, Xander and Agave.
- type: constructionGraph
  id: MisfitsHealingSalve
  start: start
  graph:
  - node: start
    edges:
    - to: healingsalve
      steps:
      - material: BrocFlower
      - material: XanderRoot
      - material: AgaveLeaf
        doAfter: 2
  - node: healingsalve
    entity: MisfitsHealingSalve3


# Misfits-original field purgative.
# The laboratory formulation uses Antidote + TableSalt + Ammonia.
# This rough field version substitutes ash and antitoxic wasteland plants.
- type: constructionGraph
  id: MisfitsGravesalt
  start: start
  graph:
  - node: start
    edges:
    - to: gravesalt
      steps:
      - tag: Ash
        name: ash
        icon:
          sprite: Objects/Materials/materials.rsi
          state: ash
      - material: CaveFungus
      - material: WildWhiteHorsenettle
        amount: 2
      - material: AgaveLeaf
        doAfter: 4
  - node: gravesalt
    entity: MisfitsGravesalt

# Misfits - additional field medicine crafting
#
# Adds:
# - Glowing Blood Pack
# - Herbal Anodyne
# - Herbal Antimicrobial
# - Herbal Stimulant
#
# Requires the MisfitsEthanolBottle tag introduced by the Fiery Purgative
# ethanol-bottle crafting update.
#

# ============================================================================
# CRAFTED MEDICINE ITEMS
# ============================================================================

# Uses the working RadAway bloodbag injector as its functional base, then swaps
# the contained reagent to MisfitsGlowingBloodPack.
- type: entity
  parent: N14RadAwayBloodbag
  id: MisfitsGlowingBloodPack
  name: glowing blood pack
  description: A blood pack treated with irradiated fungus and medical alcohol. It emits a faint, unhealthy glow.
  components:
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 10
        reagents:
        - ReagentId: MisfitsGlowingBloodPack
          Quantity: 10
  - type: Hypospray
    solutionName: pen
    transferAmount: 10
  - type: Construction
    graph: MisfitsGlowingBloodPack
    node: glowingbloodpack

