# #Misfits Add - Enclave energy weapon blueprint recipes.
# Plasma, laser and pulse arms. All require the N14BlueprintEnclaveWeapons blueprint
# item placed in a workbench, plus Enclave faction access.
#
# Every weapon here is already canon Enclave issue - enclave_rank_loadoutkits.yml
# hands out the plasma defender, auto plasma rifle, plasma pistol, wattz 2000 and
# AER-9 auto to Enclave ranks. This makes craftable what the faction already carries.
#
# Cells for these guns are crafted from the separate N14BlueprintEnclaveAmmo
# blueprint (blueprint_recipes_enclave_ammo.yml).
#
# Material amounts use the lathe's internal units where 100 units = 1 physical
# sheet / bar / ingot / piece, matching blueprint_recipes_enclave.yml.

- type: latheCategory
  id: N14BlueprintEnclaveWeapons
  name: lathe-category-blueprint-enclave-weapons

# =====================================================================
# PLASMA WEAPONS - all feed on N14PlasmaCartridge except the cutter
# =====================================================================

# Plasma cutter - melee, no cell. The only plasma cutter in the repo; it is
# Misfits content rather than vanilla SS14, hence the non-N14 prototype id.
- type: latheRecipe
  id: N14BPEnclaveWeaponPlasmaCutter
  result: MisfitsPlasmaCutter
  category: N14BlueprintEnclaveWeapons
  completetime: 10
  requiresBlueprint: true
  availableFaction:
  - Enclave
  materials:
    Steel: 4000
    Glass: 1000
    Circuitry: 500
    Plastic: 500

