# Extractor waves deliberately share WastelandAnimal. This keeps different
# species from attacking each other while preserving their normal hostility to
# players and their normal hostile-animal HTN behavior.

- type: entity
  abstract: true
  id: N14MobMaterialExtractorWaveBase
  parent: N14MobWaveAnimal
  components:
  # Wave mobs first close on the extractor itself. Once they arrive, their
  # normal hostile HTN can select and attack nearby players.
  - type: HTN
    rootTask:
      task: N14MaterialExtractorWaveCompound
  - type: NpcFactionMember
    factions:
    - WastelandAnimal

- type: htnCompound
  id: N14MaterialExtractorWaveCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:CoordinatesNotInRangePrecondition
        targetKey: FollowTarget
        rangeKey: MeleeRange
      operator: !type:MoveToOperator
        pathfindInPlanning: true
        targetKey: FollowTarget
        rangeKey: MeleeRange
        removeKeyOnFinish: false
  - tasks:
    - !type:HTNCompoundTask
      task: N14MeleeCombatCompound

- type: entity
  abstract: true
  id: N14MobMaterialExtractorRangedWaveBase
  parent: N14MobWave
  components:
  # N14MobWave defaults to melee-only planning. Armed raiders and mutants need
  # the ranged-first compound or their simulated guns are never fired.
  - type: HTN
    rootTask:
      task: N14RangedHostileCompound

