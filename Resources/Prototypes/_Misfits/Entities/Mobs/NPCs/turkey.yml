- type: entity
  name: turkey
  parent: SimpleMobBase
  id: MisfitsMobTurkey
  description: A big wasteland turkey. Somebody is having a feast.
  components:
  - type: Sprite
    drawdepth: Mobs
    scale: 1.2, 1.2
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: turkey
      sprite: _Misfits/Mobs/Animals/turkey.rsi
  - type: SpriteMovement
    movementLayers:
      movement:
        state: turkey-moving
    noMovementLayers:
      movement:
        state: turkey
  - type: Carriable
    freeHandsRequired: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 12
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Tag
    tags:
    - DoorBumpOpener
  - type: Appearance
  - type: DamageStateVisuals
    states:
      Alive:
        Base: turkey
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 3
  - type: InteractionPopup
    successChance: 0.7
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/chicken_cluck_happy.ogg
  - type: Bloodstream
    bloodMaxVolume: 150
  - type: NpcFactionMember
    factions:
    - Passive
