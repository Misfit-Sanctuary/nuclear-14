# Player-controlled Super Mutant entity.

- type: entity
  save: false
  name: Urist McSupermutant
  parent: N14BaseMobSuperMutant
  id: N14MobSuperMutant
  components:
    - type: NpcFactionMember
      factions:
      - Wastelander
    # #Misfits Add - huge frame, loud voice: speech renders in bigger chat text
    - type: SpeechFontOverride
      fontSizeBonus: 2
    # // #Cythisiax Added - player super mutants regenerate beyond the inherited 20 damage cap.
    - type: PassiveDamage
      allowedStates:
      - Alive
      - Critical
      damageCap: 350
      damage:
        groups:
          Brute: 0
        types:
          Blunt: -0.20
          Slash: -0.20
          Piercing: -0.20
          Heat: -0.20
          Cold: -0.20
          Shock: -0.20
          Caustic: -0.20
          Asphyxiation: -0.35
          Bloodloss: -0.10
