    normalRepair:
      groups:
        Brute: -1
      types:
        Heat: -1
        Caustic: -1
        Shock: -1
    activeRepair:
      groups:
        Brute: -6
      types:
        Heat: -6
        Caustic: -6
        Shock: -6
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      groups:
        Brute: -1
      types:
        Heat: -1
        Caustic: -1
        Shock: -1

