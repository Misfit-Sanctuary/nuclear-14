# === Integrator Configuration ===
- type: entity
  save: true
  name: c-27 humanoid robot (integrator)
  id: N14MobC27Integrator
  # #Misfits Add - biomech symbiosis. MobBloodstream parent supplies InjectableSolution (syringe) and a configured Bloodstream.
  parent: [N14BaseMobC27, MobBloodstream]
  description: Integrator - A pre-war C-27 model robot of unusual make with various pieces of tubing running along it's torso, arms, and legs joints as well as some sort of synthetic fibers mimicking musculature along it's chassis. Seem's unusually twitchy as compared to others of it's model.
  components:
  - type: HumanoidAppearance
    species: C27Integrator
  # #Misfits Add - Integrator body carries a heart and stomach; legs carry the 3.0/5.0 servos.
  - type: Body
    prototype: C27Integrator
    requiredLegs: 1
  # #Misfits Add - biomass-fed: Hunger only. Thirst deliberately omitted, so no water needed.
  - type: Hunger
  # #Misfits Add - zero the inherited thirst cost so blood regen is funded by food alone.
  - type: Bloodstream
    bloodRegenerationThirst: 0
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyWastelandGlobal
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: MisfitsC27IntegratorSilicon
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      300: Dead
    allowRevives: true
  - type: MovementSpeedModifier
    # #Misfits Add - matches the Integrator leg servos; the body system rewrites this on leg change.
    baseWalkSpeed: 3.0
    baseSprintSpeed: 5.0

# === Assault Configuration ===
- type: entity
  save: true
  name: c-27 humanoid robot (assault)
  id: N14MobC27Assault
