      key_slots:
      - EncryptionKeyWastelandGlobal
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: MisfitsC27AssaultSilicon
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      500: Dead
    allowRevives: true
  - type: MovementSpeedModifier
    # #Misfits Add - 10% under human baseline (3.0/5.0); matches the Assault leg servos.
    baseWalkSpeed: 2.7
    baseSprintSpeed: 4.5
  - type: Reflect
    reflects:
      - SmallCaliber
      - MediumCaliber
    reflectProb: 0.20
    innate: true
    spread: 90

# === Recon Configuration ===
- type: entity
  save: true
  name: c-27 humanoid robot (recon)
  id: N14MobC27Recon
  parent: N14BaseMobC27
  description: Recon - A pre-war C-27 model robot featuring a lankier build and lighter armor plating, additional optical sensors and a more advanced antenna can be noted quickly, and it seem's to move much more silently than other models.
  components:
  - type: HumanoidAppearance
    species: C27Recon
  # #Misfits Add - legs carry the 3.3/5.5 servos.
  - type: Body
    prototype: C27Recon
    requiredLegs: 1
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyWastelandGlobal
  - type: Damageable
    damageContainer: Silicon
    damageModifierSet: MisfitsC27ReconSilicon
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      300: Dead
    allowRevives: true
  # #Misfits Add - overrides the base -0.15 self-repair with a much faster rate.
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damage:
      groups:
        Brute: -0.8
      types:
        Heat: -0.8
        Caustic: -0.8
  - type: MovementSpeedModifier
    # #Misfits Add - 10% over human baseline (3.0/5.0); matches the Recon leg servos.
    baseWalkSpeed: 3.3
    baseSprintSpeed: 5.5
  # #Misfits Add - damped servos; -7dB keeps it under the N14Sneak trait's -10.
  - type: FootstepVolumeModifier
    sprintVolumeModifier: -7
    walkVolumeModifier: -7
    clothVolumeModifier: -7
  - type: NightVision
  # #Misfits Add - pulseTime makes this a timed sweep rather than a permanent overlay, as on ClothingEyesThermalVisionGoggles.
  - type: ThermalVision
    pulseTime: 5
    toggleAction: PulseThermalVision
  # #Misfits Add - WastelandMap data component and a registered BUI are both required; the action alone opens nothing.
  - type: WastelandMap
    mapTexturePath: _Misfits/Maps/wendover_map.png
    mapTitle: Recon Tactical Map
    tacticalFeed: C27 # #Misfits Add - resolved per viewer from the chassis's own ID card (NCR or BoS only)
    worldBounds: "-517,-308,484,311"
  # #Misfits Add - grant the map action the way N14MobC27ZAX grants its repair action, since WastelandMapAction only auto-grants for worn items.
  - type: ActionGrant
    actions:
    - ActionOpenWastelandMap
  - type: UserInterface
    interfaces:
      enum.WastelandMapUiKey.Key:
        type: WastelandMapBoundUserInterface
