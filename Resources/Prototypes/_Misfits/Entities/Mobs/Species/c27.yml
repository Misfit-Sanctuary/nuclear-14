  save: true
  name: c-27 humanoid robot (z.a.x)
  id: N14MobC27ZAX
  parent: N14BaseMobC27
  description: A C-27 humanoid robot rebuilt as a Z.A.X-linked rapid-response chassis.
  components:
  - type: ZaxLinkedUnit
  - type: HumanoidAppearance
    species: C27ZAX
  - type: Body
    # #Misfits Add - per-chassis body carries the matching MovementBodyPart leg servos.
    prototype: C27ZAX
    requiredLegs: 1
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyWastelandGlobal
      - EncryptionKeyZAX
  - type: LanguageKnowledge
    speaks:
    - English
    - N14Robot
    - N14BrotherBeep
    - Latin
    - Chinese
    - Tribal
    - Sign
    understands:
    - English
    - N14Robot
    - N14BrotherBeep
    - Latin
    - Chinese
    - Tribal
    - Sign
  - type: Damageable
