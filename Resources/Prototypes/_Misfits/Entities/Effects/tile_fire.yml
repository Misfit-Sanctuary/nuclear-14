# Plasma burns hot and dies fast: shorter than napalm, but it goes through anything standing in it.
- type: entity
  parent: MisfitsTileFire
  id: MisfitsTileFirePlasma
  name: plasma fire
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Misfits/Effects/fire.rsi
    noRot: true
    drawdepth: WallTops
    layers:
    - map: [ "base" ]
      state: green_4
  - type: PointLight
    radius: 5
    color: "#5CFFA8"
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: green_1 }
          Two: { state: green_2 }
          Three: { state: green_3 }
