      state: white_4
  - type: PointLight
    radius: 7
    color: "#F4F7FF"
  - type: GenericVisualizer
    visuals:
      enum.TileFireLayers.Base:
        base:
          One: { state: white_1 }
          Two: { state: white_2 }
          Three: { state: white_3 }
          Four: { state: white_4 }
