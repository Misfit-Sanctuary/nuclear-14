# ============================================================================
# MIXED ARMOR
# Power armor is intentionally excluded from random loot.
# ============================================================================

- type: entityTable
  id: MisfitsArmorLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsArmorLootLight
      weight: 30
    - !type:NestedSelector
      tableId: MisfitsArmorLootMedium
      weight: 27
    - !type:NestedSelector
      tableId: MisfitsArmorLootHeavy
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsArmorLootMilitary
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsArmorLootHelmets
      weight: 10


# ============================================================================
# VISIBLE ARMOR SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: armor loot spawner
  id: MisfitsArmorLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutcombat.rsi
      state: icon


# ============================================================================
# CATEGORY SPAWNERS
# ============================================================================

- type: entity
  parent: MisfitsArmorLootSpawnerBase
  id: MisfitsArmorLootSpawnerLight
  name: light armor loot spawner
  suffix: Misfits, Light, 1-2
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsArmorLootLight
      rolls: !type:RangeNumberSelector
        range: 1, 2
    offset: 0.45

