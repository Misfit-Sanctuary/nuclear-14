# #Misfits Add - Armor loot tables and mapper spawners
#
# Five rarity tiers:
#   Common      50
#   Uncommon    27
#   Rare        14
#   Very Rare    7
#   Legendary    2
#
# Categories:
# - Light armor
# - Medium armor
# - Heavy armor
# - Military armor
# - Helmets
# - Mixed armor
#
# Mapper spawners are visible and use offset: 0.45.
# Armor spawners intentionally roll fewer items than medicine/industrial loot.
# Power armor is intentionally excluded from all random armor loot.

# ============================================================================
# LIGHT ARMOR
# ============================================================================

- type: entityTable
  id: MisfitsArmorLootLight
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14ClothingOuterVestLeather
        weight: 4
      - !type:EntSelector
        id: N14ClothingOuterTribalArmor
        weight: 4
      - !type:EntSelector
        id: N14ClothingOuterLeatherArmor
        weight: 3

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14ClothingOuterVaultSecVest
        weight: 3
      - !type:EntSelector
        id: N14ClothingOuterCoatFollowersArmored
        weight: 2
      - !type:EntSelector
        id: N14ClothingOuterZealotDuster
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14ClothingOuterPoliceCombat
        weight: 3
      - !type:EntSelector
        id: N14ClothingOuterCombatTribal
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14ClothingOuterMetalArmor
        weight: 2
      - !type:EntSelector
        id: N14ClothingScavengerHeavyArmor

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14ClothingOuterCombatArmor


