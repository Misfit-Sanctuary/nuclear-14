# #Misfits Add - Valuables loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#
# NOTE: The verified repository does not expose a broad jewelry catalog. Jewelry uses real precious-metal currency/scrap rather than fabricated jewelry prototypes.
#

# ============================================================================
# CAPS
# ============================================================================

- type: entityTable
  id: MisfitsValuablesLootCaps
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14CurrencyCap
        weight: 3
      - !type:EntSelector
        id: N14CurrencyCap4
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14CurrencyCap10
        weight: 3

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14CurrencyCap50
        weight: 3

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14CurrencyCap100
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14CurrencyCap500
        weight: 3


