      tableId: MisfitsValuablesLootCaps
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsValuablesLootJewelry
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsValuablesLootPreWarMoney
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsValuablesLootCollectibles
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsValuablesLootLuxuryGoods
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsValuablesLootRareValuables
      weight: 2


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: valuables loot spawner
  id: MisfitsValuablesLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/currency.rsi
      state: caps3

- type: entity
  parent: MisfitsValuablesLootSpawnerBase
  id: MisfitsValuablesLootSpawnerCaps
  name: caps loot spawner
  suffix: Misfits, Caps, 1-3
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsValuablesLootCaps
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45

