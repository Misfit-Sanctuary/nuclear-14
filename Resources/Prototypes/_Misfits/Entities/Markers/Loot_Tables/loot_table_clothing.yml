# #Misfits Add - Clothing loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# CIVILIAN CLOTHING
# ============================================================================

- type: entityTable
  id: MisfitsClothingLootCivilianClothing
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitRags
        weight: 3
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitCaravan
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitMerchant
        weight: 3
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitCowboyOld
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitChinese
        weight: 3
      - !type:EntSelector
        id: N14ClothingBootsLeather
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: ClothingShoesBootsJack
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: ClothingBackpackSatchelLeather
        weight: 3


