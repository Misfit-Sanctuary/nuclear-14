# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: clothing loot spawner
  id: MisfitsClothingLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutleather.rsi
      state: icon

- type: entity
  parent: MisfitsClothingLootSpawnerBase
  id: MisfitsClothingLootSpawnerCivilianClothing
  name: civilian clothing loot spawner
  suffix: Misfits, Civilian Clothing, 1-2
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsClothingLootCivilianClothing
      rolls: !type:RangeNumberSelector
        range: 1, 2
    offset: 0.45

