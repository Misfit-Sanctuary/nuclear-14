# ============================================================================
# MASTER WEAPON TABLE
# ============================================================================
# Category chance when this table is rolled:
# Improvised 30%, Melee 25%, Civilian 22%, Military 12%, Energy 6%,
# Explosives 3%, Heavy 1.5%, Rare 0.5%.

- type: entityTable
  id: MisfitsWeaponLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsWeaponLootImprovised
      weight: 30
    - !type:NestedSelector
      tableId: MisfitsWeaponLootMelee
      weight: 25
    - !type:NestedSelector
      tableId: MisfitsWeaponLootCivilianFirearms
      weight: 22
    - !type:NestedSelector
      tableId: MisfitsWeaponLootMilitaryFirearms
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsWeaponLootEnergy
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsWeaponLootExplosives
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsWeaponLootHeavy
      weight: 1.5
    - !type:NestedSelector
      tableId: MisfitsWeaponLootRare
      weight: 0.5

# ============================================================================
# MAPPER SPAWNERS
# ============================================================================
# These markers always roll once. Add `prob:` under NestedSelector if a mapper
# needs a chance for the marker to produce nothing.

