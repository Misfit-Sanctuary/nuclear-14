# #Misfits Add - Categorized weapon loot tables and mapper spawners.
#
# Each category table returns exactly one weapon. The master table selects a
# category first, then rolls one of five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Two parallel classifications are provided:
# - Location/use categories: improvised, melee, civilian, military, energy,
#   explosives, heavy, and rare.
# - Weapon families: melee, ballistic, laser, and plasma.
# Ammunition is intentionally excluded and should use separate loot tables.

# ============================================================================
# IMPROVISED WEAPONS
# ============================================================================

- type: entityTable
  id: MisfitsWeaponLootImprovised
  table: !type:GroupSelector
    children:
    # Common - 50%.
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14BrokenPipe
        weight: 3
      - !type:EntSelector
        id: N14NailBoard
        weight: 3
      - !type:EntSelector
        id: N14KitchenKnife
        weight: 2
      - !type:EntSelector
        id: N14PoolCue
        weight: 2
    # Uncommon - 27%.
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14ScrapMachete
        weight: 2
      - !type:EntSelector
        id: BowImprovised
      - !type:EntSelector
        id: N14WeaponPistol10mmPipe
        weight: 2
      - !type:EntSelector
        id: N14WeaponShotgunPipe
        weight: 2
    # Rare - 14%.
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14WeaponSniper308PipeRifle
        weight: 2
      - !type:EntSelector
        id: N14WeaponRifle556Pipe
      - !type:EntSelector
        id: N14WeaponSMG10mmPipe
    # Very Rare - 7%.
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14WeaponSMG12mmPipe
      - !type:EntSelector
        id: N14WeaponShotgunBloodyStick
    # Legendary - 2%.
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14WeaponSniper50Pipe
      - !type:EntSelector
        id: N14WeaponRevolver45-70HandcannonUpgraded

