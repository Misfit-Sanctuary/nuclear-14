# ============================================================================
# MASTER SURVIVAL TABLE
# ============================================================================

- type: entityTable
  id: MisfitsSurvivalLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootCampingGear
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootNavigation
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootHuntingSupplies
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootWaterSupplies
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootFireStarting
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootFieldMedical
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootWildernessGear
      weight: 10


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: survival loot spawner
  id: MisfitsSurvivalLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Tools/wrench.rsi
      state: icon

- type: entity
  parent: MisfitsSurvivalLootSpawnerBase
  id: MisfitsSurvivalLootSpawnerCampingGear
  name: camping gear loot spawner
  suffix: Misfits, Camping Gear, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsSurvivalLootCampingGear
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

