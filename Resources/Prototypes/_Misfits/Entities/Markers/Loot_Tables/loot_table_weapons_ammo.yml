# ============================================================================
# MIXED WEAPON + AMMO TABLE
# ============================================================================

- type: entityTable
  id: MisfitsWeaponAmmoLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootPistols
      weight: 25
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootSMGs
      weight: 18
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLoot556Rifles
      weight: 16
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLoot762Rifles
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootShotguns
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootHunting
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootEnergy
      weight: 4


# ============================================================================
# VISIBLE MAPPER SPAWNERS
# ============================================================================

- type: entity
  parent: MarkerBase
  id: MisfitsWeaponAmmoLootSpawnerPistols
  name: pistol with ammo loot spawner
  suffix: Weapon + Magazine/Ammo Box, Pistols
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsWeaponAmmoLootPistols
    offset: 0.45

