# #Misfits Add - Weapon + matching ammunition loot spawners
#
# Each weapon package uses !type:AllSelector so the weapon and its matching
# ammunition spawn together.
#
# Detachable-magazine firearms:
#   50% extra fitting magazine
#   50% fitting ammo box
#
# Internal-magazine / revolver / tube-fed firearms:
#   fitting ammo box
#
# Energy weapons:
#   fitting power cell / microfusion cell
#
# All mapper markers are visible.
# Spawned entities use offset: 0.45.


# ============================================================================
# PISTOLS
# ============================================================================

- type: entityTable
  id: MisfitsWeaponAmmoLootPistols
  table: !type:GroupSelector
    children:

    - !type:AllSelector
      weight: 4
      children:
      - !type:EntSelector
        id: N14WeaponPistol22lr
      - !type:GroupSelector
        children:
        - !type:EntSelector
          id: N14MagazinePistol22lr
        - !type:EntSelector
          id: N14AmmoBox22lr

    - !type:AllSelector
      weight: 5
      children:
      - !type:EntSelector
        id: N14WeaponPistol9mm
      - !type:GroupSelector
        children:
        - !type:EntSelector
          id: N14MagazinePistol9mm
        - !type:EntSelector
          id: N14AmmoBox9mm

    - !type:AllSelector
      weight: 4
      children:
      - !type:EntSelector
        id: N14WeaponPistol10mm
      - !type:GroupSelector
        children:
        - !type:EntSelector
          id: N14MagazinePistol10mm
