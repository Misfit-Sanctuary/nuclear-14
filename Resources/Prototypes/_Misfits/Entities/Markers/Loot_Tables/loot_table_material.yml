# #Misfits Add - Material loot tables and mapper spawners
#
# Rarity weights:
# Common 50, Uncommon 27, Rare 14, Very Rare 7, Legendary 2
#
# All mapper markers are visible.
# Spawned loot uses offset: 0.45.

# ============================================================================
# BUILDING MATERIALS
# ============================================================================

- type: entityTable
  id: MisfitsMaterialLootBuilding
  table: !type:GroupSelector
    children:
    - !type:GroupSelector # Common
      weight: 50
      children:
      - !type:EntSelector
        id: SheetSteel1
        weight: 4
      - !type:EntSelector
        id: SheetPlastic1
        weight: 3
      - !type:EntSelector
        id: SheetGlass1
        weight: 3
      - !type:EntSelector
        id: MaterialWoodPlank1
        weight: 3

    - !type:GroupSelector # Uncommon
      weight: 27
      children:
      - !type:EntSelector
        id: MaterialWoodPlank2
        weight: 3
      - !type:EntSelector
        id: SheetSteel15
        weight: 2
      - !type:EntSelector
        id: SheetPlastic15
        weight: 2

    - !type:GroupSelector # Rare
      weight: 14
      children:
      - !type:EntSelector
        id: SheetGlass15
        weight: 3
      - !type:EntSelector
        id: MaterialWoodPlank15
        weight: 2
      - !type:EntSelector
        id: MaterialCloth15

    - !type:GroupSelector # Very Rare
      weight: 7
      children:
      - !type:EntSelector
        id: SheetSteel
        weight: 3
      - !type:EntSelector
        id: SheetPlastic
        weight: 2
      - !type:EntSelector
        id: SheetGlass

    - !type:GroupSelector # Legendary
      weight: 2
      children:
      - !type:EntSelector
        id: MaterialWoodPlank
        weight: 2
      - !type:EntSelector
        id: SheetSteel


