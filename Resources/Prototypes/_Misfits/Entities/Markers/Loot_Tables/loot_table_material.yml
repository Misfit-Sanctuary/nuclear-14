# ============================================================================
# MASTER MATERIAL TABLE
# ============================================================================

- type: entityTable
  id: MisfitsMaterialLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsMaterialLootBuilding
      weight: 30
    - !type:NestedSelector
      tableId: MisfitsMaterialLootMetals
      weight: 25
    - !type:NestedSelector
      tableId: MisfitsMaterialLootOrganic
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsMaterialLootCircuitry
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsMaterialLootPowders
      weight: 13
    - !type:NestedSelector
      tableId: MisfitsMaterialLootRare
      weight: 5


# ============================================================================
# MATERIAL SPAWNERS
# ============================================================================

- type: entity
  parent: MarkerBase
  id: MisfitsMaterialLootSpawnerBuilding
  name: building material loot spawner
  suffix: Materials, Building, 2-5
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/materials.rsi
      state: ingot_iron
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMaterialLootBuilding
      rolls: !type:RangeNumberSelector
        range: 2, 5
    offset: 0.45

- type: entity
  parent: MarkerBase
  id: MisfitsMaterialLootSpawnerMetals
