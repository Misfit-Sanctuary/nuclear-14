# #Misfits Add - Ammunition loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# COMMON AMMO
# ============================================================================

- type: entityTable
  id: MisfitsAmmoLootCommonAmmo
  table: !type:GroupSelector
      children:
          # Common - 50
          - !type:GroupSelector
              weight: 50
              children:
                  - !type:EntSelector
                      id: N14AmmoBox22lr
                      weight: 3
                  - !type:EntSelector
                      id: N14AmmoBox9mm
                      weight: 2

          # Uncommon - 27
          - !type:GroupSelector
              weight: 27
              children:
                  - !type:EntSelector
                      id: N14AmmoBox10mm
                      weight: 3

          # Rare - 14
          - !type:GroupSelector
              weight: 14
              children:
                  - !type:EntSelector
                      id: MagazineBox20gauge
                      weight: 3

          # Very Rare - 7
          - !type:GroupSelector
              weight: 7
              children:
                  - !type:EntSelector
                      id: N14AmmoBox12gauge
                      weight: 3

          # Legendary - 2
          - !type:GroupSelector
              weight: 2
              children:
                  - !type:EntSelector
                      id: N14AmmoBox45
                      weight: 3


