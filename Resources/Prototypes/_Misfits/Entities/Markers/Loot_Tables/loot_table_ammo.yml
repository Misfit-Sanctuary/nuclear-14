# ============================================================================
# MASTER AMMUNITION TABLE
# ============================================================================

- type: entityTable
  id: MisfitsAmmoLootAll
  table: !type:GroupSelector
      children:
          - !type:NestedSelector
              tableId: MisfitsAmmoLootCommonAmmo
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootRifleAmmo
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootPistolAmmo
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootShotgunAmmo
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootEnergyAmmo
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootExplosivesGrenades
              weight: 10
          - !type:NestedSelector
              tableId: MisfitsAmmoLootRareAmmo
              weight: 2


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: ammunition loot spawner
  id: MisfitsAmmoLootSpawnerBase
  parent: MarkerBase
  components:
      - type: Sprite
        layers:
            - state: red
            - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
              state: icon

- type: entity
  parent: MisfitsAmmoLootSpawnerBase
  id: MisfitsAmmoLootSpawnerCommonAmmo
  name: common ammo loot spawner
  suffix: Misfits, Common Ammo, 2-4
  components:
      - type: EntityTableSpawner
        table: !type:NestedSelector
            tableId: MisfitsAmmoLootCommonAmmo
            rolls: !type:RangeNumberSelector
                range: 2, 4
        offset: 0.45

