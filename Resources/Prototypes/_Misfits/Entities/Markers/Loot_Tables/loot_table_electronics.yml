      tableId: MisfitsElectronicsLootCommonElectronics
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootCircuitComponents
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootBatteries
      weight: 10
    - !type:NestedSelector
