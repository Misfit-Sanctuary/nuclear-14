      weight: 2


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: electronics loot spawner
  id: MisfitsElectronicsLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Objects/Misc/proximity_sensor.rsi
      state: icon

- type: entity
  parent: MisfitsElectronicsLootSpawnerBase
  id: MisfitsElectronicsLootSpawnerCommonElectronics
  name: common electronics loot spawner
  suffix: Misfits, Common Electronics, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsElectronicsLootCommonElectronics
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

