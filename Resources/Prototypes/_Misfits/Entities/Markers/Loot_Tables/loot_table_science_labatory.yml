# #Misfits Add - Science / Laboratory loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# LABORATORY SUPPLIES
# ============================================================================

- type: entityTable
  id: MisfitsScienceLootLaboratorySupplies
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: BoxBeaker
        weight: 3
      - !type:EntSelector
        id: BoxVial
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: BoxBottle
        weight: 3
      - !type:EntSelector
        id: Dropper
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: Jug
        weight: 3
      - !type:EntSelector
        id: HandLabeler
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: ClothingHandsGlovesChemist
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: ClothingEyesGlassesChemist
        weight: 3


