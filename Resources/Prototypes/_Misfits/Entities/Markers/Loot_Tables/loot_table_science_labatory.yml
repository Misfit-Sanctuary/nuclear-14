# ============================================================================
# MASTER SCIENCE / LABORATORY TABLE
# ============================================================================

- type: entityTable
  id: MisfitsScienceLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsScienceLootLaboratorySupplies
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootChemicals
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootGlassware
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootResearchEquipment
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootBiologicalSamples
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootExperimentalComponents
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsScienceLootRareResearchLoot
      weight: 2


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: science / laboratory loot spawner
  id: MisfitsScienceLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Objects/Misc/proximity_sensor.rsi
      state: icon

- type: entity
  parent: MisfitsScienceLootSpawnerBase
  id: MisfitsScienceLootSpawnerLaboratorySupplies
  name: laboratory supplies loot spawner
  suffix: Misfits, Laboratory Supplies, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsScienceLootLaboratorySupplies
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

