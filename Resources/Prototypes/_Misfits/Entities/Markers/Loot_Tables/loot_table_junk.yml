# #Misfits Add - Junk loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# HOUSEHOLD JUNK
# ============================================================================

- type: entityTable
  id: MisfitsJunkLootHouseholdJunk
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14Junk8Ball
        weight: 3
      - !type:EntSelector
        id: N14JunkBaseball
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14JunkCoffeepot
        weight: 3
      - !type:EntSelector
        id: N14JunkCookpot
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14JunkToaster
        weight: 3

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14JunkAbraxoCleaner
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14FoodTinCanTrash
        weight: 3


