# ============================================================================
# MASTER JUNK TABLE
# ============================================================================

- type: entityTable
  id: MisfitsJunkLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsJunkLootHouseholdJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootOfficeJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootIndustrialJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootMedicalJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootElectronicJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootMilitaryJunk
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsJunkLootScrap
      weight: 10


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: junk loot spawner
  id: MisfitsJunkLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: abraxo

- type: entity
  parent: MisfitsJunkLootSpawnerBase
  id: MisfitsJunkLootSpawnerHouseholdJunk
  name: household junk loot spawner
  suffix: Misfits, Household Junk, 3-7
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsJunkLootHouseholdJunk
      rolls: !type:RangeNumberSelector
        range: 3, 7
    offset: 0.45

