# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: military loot spawner
  id: MisfitsMilitaryLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutcombat.rsi
      state: icon

- type: entity
  parent: MisfitsMilitaryLootSpawnerBase
  id: MisfitsMilitaryLootSpawnerBarracks
  name: barracks loot spawner
  suffix: Misfits, Barracks, 1-3
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMilitaryLootBarracks
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45

