# #Misfits Add - Military loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# BARRACKS
# ============================================================================

- type: entityTable
  id: MisfitsMilitaryLootBarracks
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14BoxCardboardMREBoxCFilled
        weight: 3
      - !type:EntSelector
        id: N14ClothingBackpackMilitary
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14ClothingUniformJumpsuitMilUniform
        weight: 3
      - !type:EntSelector
        id: N14ClothingUniformNCRDesert
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14ClothingBootsCombatFilled
        weight: 3

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14ClothingHeadHatCombatHelmet
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14ClothingOuterCombatArmor
        weight: 3


