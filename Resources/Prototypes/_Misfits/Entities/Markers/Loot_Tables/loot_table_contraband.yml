# ============================================================================
# MASTER CONTRABAND TABLE
# ============================================================================

- type: entityTable
  id: MisfitsContrabandLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsContrabandLootIllegalChems
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsContrabandLootStolenMilitaryEquipment
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsContrabandLootRestrictedTechnology
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsContrabandLootForgedDocuments
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsContrabandLootFactionIntelligence
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsContrabandLootBlackMarketGoods
      weight: 10


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: contraband loot spawner
  id: MisfitsContrabandLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

- type: entity
  parent: MisfitsContrabandLootSpawnerBase
  id: MisfitsContrabandLootSpawnerIllegalChems
  name: illegal chems loot spawner
  suffix: Misfits, Illegal Chems, 1-2
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsContrabandLootIllegalChems
      rolls: !type:RangeNumberSelector
        range: 1, 2
    offset: 0.45

