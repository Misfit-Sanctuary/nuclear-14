# #Misfits Add - Contraband loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#
# NOTE: Forged Documents uses real identity-document prototypes as stand-ins; dedicated forged variants can replace them later without changing the table structure.
#

# ============================================================================
# ILLEGAL CHEMS
# ============================================================================

- type: entityTable
  id: MisfitsContrabandLootIllegalChems
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14Jet
        weight: 3
      - !type:EntSelector
        id: N14Psycho
        weight: 2
      - !type:EntSelector
        id: N14BuffoutCanisterFilled

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14Med-X
        weight: 3
      - !type:EntSelector
        id: MisfitsPillCanisterCrank
        weight: 2
      - !type:EntSelector
        id: MisfitsPillCanisterFury

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: MisfitsPillCanisterCalmex
        weight: 3
      - !type:EntSelector
        id: MisfitsPillCanisterOverdrive
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14Turbo
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: MisfitsPillCanisterXCell
        weight: 3


