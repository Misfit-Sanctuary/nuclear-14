# ============================================================================
# MASTER FOOD & DRINK TABLE
# ============================================================================

- type: entityTable
  id: MisfitsFoodDrinkLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootPackagedFood
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootFreshWastelandFood
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootDrinks
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAlcohol
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootCookingIngredients
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootRarePreWarFood
      weight: 2


# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: food & drink loot spawner
  id: MisfitsFoodDrinkLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Consumable/Food/pre-war.rsi
      state: cram

- type: entity
  parent: MisfitsFoodDrinkLootSpawnerBase
  id: MisfitsFoodDrinkLootSpawnerPackagedFood
  name: packaged food loot spawner
  suffix: Misfits, Packaged Food, 2-5
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsFoodDrinkLootPackagedFood
      rolls: !type:RangeNumberSelector
        range: 2, 5
    offset: 0.45

- type: entity
  parent: MisfitsFoodDrinkLootSpawnerBase
  id: MisfitsFoodDrinkLootSpawnerFreshWastelandFood
  name: fresh / wasteland food loot spawner
