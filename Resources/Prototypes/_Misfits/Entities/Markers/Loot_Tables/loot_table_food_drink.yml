# #Misfits Add - Food & Drink loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# PACKAGED FOOD
# ============================================================================

- type: entityTable
  id: MisfitsFoodDrinkLootPackagedFood
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14FoodDogfood
        weight: 3
      - !type:EntSelector
        id: N14FoodCrisps
        weight: 2
      - !type:EntSelector
        id: N14FoodInstamash

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14FoodPorkBeans
        weight: 3
      - !type:EntSelector
        id: N14FoodCram
        weight: 2
      - !type:EntSelector
        id: N14FoodBlamcomaccheese

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14FoodSalisburysteak
        weight: 3
      - !type:EntSelector
        id: N14FoodDandyboyapples
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14FoodFancyladssnackcakes
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14FoodSugarbombs
        weight: 3


