# #Misfits Add - Documents & Personal Items loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#
# NOTE: No dedicated photograph prototype was found in the verified repository search. The Photographs table uses paper/personal-record stand-ins instead of invented IDs.
#

# ============================================================================
# PAPERS
# ============================================================================

- type: entityTable
  id: MisfitsDocumentsLootPapers
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: Paper
        weight: 3

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: BoxFolderGrey
        weight: 3

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: Clipboard
        weight: 3

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: Clipboard
        weight: 3
      - !type:EntSelector
        id: BookRandom
        weight: 2

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: BookRandom
        weight: 3


