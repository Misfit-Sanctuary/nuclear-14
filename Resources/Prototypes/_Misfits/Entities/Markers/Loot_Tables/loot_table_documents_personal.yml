# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: documents & personal items loot spawner
  id: MisfitsDocumentsLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/currency.rsi
      state: prewar3

- type: entity
  parent: MisfitsDocumentsLootSpawnerBase
  id: MisfitsDocumentsLootSpawnerPapers
  name: papers loot spawner
  suffix: Misfits, Papers, 1-3
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsDocumentsLootPapers
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45

