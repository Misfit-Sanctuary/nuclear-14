# #Misfits Add - Scrap loot tables and mapper spawners
#
# Scrap tables favor small stacks at low rarity and larger / more valuable
# scrap stacks at higher rarity.
#
# All mapper markers are visible.
# Spawned loot uses offset: 0.45.

# ============================================================================
# GENERAL SCRAP
# ============================================================================

- type: entityTable
  id: MisfitsScrapLootGeneral
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14Scrap1
        weight: 5
      - !type:EntSelector
        id: N14ScrapSteel1
        weight: 3

    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14Scrap5
        weight: 4
      - !type:EntSelector
        id: N14ScrapSteel5
        weight: 3

    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14Scrap10
        weight: 3
      - !type:EntSelector
        id: N14ScrapSteel10
        weight: 2

    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14ScrapElectronic5
        weight: 2
      - !type:EntSelector
        id: N14ScrapCopper5

    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14ScrapElectronic10
        weight: 2
      - !type:EntSelector
        id: N14ScrapCopper10


