# ============================================================================
# MASTER SCRAP TABLE
# ============================================================================

- type: entityTable
  id: MisfitsScrapLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsScrapLootGeneral
      weight: 30
    - !type:NestedSelector
      tableId: MisfitsScrapLootSteel
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsScrapLootElectronic
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsScrapLootNonferrous
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsScrapLootComponents
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsScrapLootPrecious
      weight: 5


# ============================================================================
# SCRAP SPAWNERS
# ============================================================================

- type: entity
  parent: MarkerBase
  id: MisfitsScrapLootSpawnerGeneral
  name: general scrap loot spawner
  suffix: Scrap, General, 3-7
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/materials.rsi
      state: scrap_2
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsScrapLootGeneral
      rolls: !type:RangeNumberSelector
        range: 3, 7
    offset: 0.45

- type: entity
