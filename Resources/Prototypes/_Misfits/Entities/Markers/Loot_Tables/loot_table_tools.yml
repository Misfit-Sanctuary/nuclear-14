# #Misfits Add - Tools loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#
# NOTE: No dedicated verified lockpick/bobby-pin prototype was found; Locksmith Tools uses real access-oriented prying/electrical tools.
#

# ============================================================================
# BASIC TOOLS
# ============================================================================

- type: entityTable
  id: MisfitsToolsLootBasicTools
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14Wrench
        weight: 3
      - !type:EntSelector
        id: N14Screwdriver
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14Wirecutter
        weight: 3
      - !type:EntSelector
        id: N14Welder
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14Shovel
        weight: 3

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14Saw
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14Multitool
        weight: 3


