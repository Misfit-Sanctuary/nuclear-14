# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: tools loot spawner
  id: MisfitsToolsLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Tools/wrench.rsi
      state: icon

- type: entity
  parent: MisfitsToolsLootSpawnerBase
  id: MisfitsToolsLootSpawnerBasicTools
  name: basic tools loot spawner
  suffix: Misfits, Basic Tools, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsToolsLootBasicTools
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

