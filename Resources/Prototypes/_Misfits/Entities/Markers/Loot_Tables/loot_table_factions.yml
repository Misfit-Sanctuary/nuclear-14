# #Misfits Add - Faction loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# NCR
# ============================================================================

- type: entityTable
  id: MisfitsFactionLootNcr
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14CurrencyNCRDollar10
        weight: 3
      - !type:EntSelector
        id: N14ClothingUniformNCRDesert
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14ClothingHeadHatNCRHelmetMetalDesert
        weight: 3
      - !type:EntSelector
        id: N14ClothingOuterNCRVestDesert
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14WeaponRifle556Service
        weight: 3
      - !type:EntSelector
        id: N14ClothingOuterNCRPouchedVestDesert
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14HolotapeLoreNCRRecon
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: MisfitsNCREliteCombatArmor
        weight: 3


