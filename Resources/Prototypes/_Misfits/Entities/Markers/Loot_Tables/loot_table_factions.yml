# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: faction loot spawner
  id: MisfitsFactionLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutcombat.rsi
      state: icon

- type: entity
  parent: MisfitsFactionLootSpawnerBase
  id: MisfitsFactionLootSpawnerNcr
  name: ncr loot spawner
  suffix: Misfits, NCR, 1-3
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsFactionLootNcr
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45

