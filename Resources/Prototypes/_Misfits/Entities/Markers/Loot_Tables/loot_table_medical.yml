# #Misfits Add - Medical loot tables and mapper spawners.
#
# Five internal rarity tiers:
# Common 50%, Uncommon 27%, Rare 14%, Very Rare 7%, Legendary 2%.
#
# Visible mapper markers; spawned loot uses offset: 0.45.
# Lists are ordered from lower-value/common items toward rarer items.
#

# ============================================================================
# BASIC MEDICAL
# ============================================================================

- type: entityTable
  id: MisfitsMedicalLootBasicMedical
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14CleanGauze10
        weight: 3
      - !type:EntSelector
        id: N14Ointment10
        weight: 2
      - !type:EntSelector
        id: Brutepack

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: Bloodpack
        weight: 3
      - !type:EntSelector
        id: N14HealingPowder
        weight: 2
      - !type:EntSelector
        id: N14HealingPoultice

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: MisfitsHealingSalve10
        weight: 3
      - !type:EntSelector
        id: N14Stimpak
        weight: 2

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: N14Antidote
        weight: 3

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: N14SuperStimpak
        weight: 3


