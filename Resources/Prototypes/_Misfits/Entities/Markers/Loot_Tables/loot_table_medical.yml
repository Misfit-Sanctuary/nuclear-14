# ============================================================================
# VISIBLE MAPPER SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: medical loot spawner
  id: MisfitsMedicalLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
      state: ointment1

- type: entity
  parent: MisfitsMedicalLootSpawnerBase
  id: MisfitsMedicalLootSpawnerBasicMedical
  name: basic medical loot spawner
  suffix: Misfits, Basic Medical, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMedicalLootBasicMedical
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

- type: entity
