# ============================================================================
# MIXED INDUSTRIAL LOOT
# ============================================================================

- type: entityTable
  id: MisfitsIndustrialLootAll
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootTools
      weight: 24
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootMechanical
      weight: 24
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootElectrical
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootMaterials
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootWorkshop
      weight: 12


# ============================================================================
# VISIBLE INDUSTRIAL SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: industrial loot spawner
  id: MisfitsIndustrialLootSpawnerBase
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Tools/wrench.rsi
      state: icon


# ============================================================================
# CATEGORY SPAWNERS
# ============================================================================

- type: entity
  parent: MisfitsIndustrialLootSpawnerBase
  id: MisfitsIndustrialLootSpawnerTools
  name: industrial tool loot spawner
  suffix: Misfits, Tools, 2-4
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsIndustrialLootTools
      rolls: !type:RangeNumberSelector
        range: 2, 4
    offset: 0.45

