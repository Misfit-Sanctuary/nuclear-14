
# #Misfits Add - Industrial loot tables
#
# Five rarity tiers:
#   Common      50
#   Uncommon    27
#   Rare        14
#   Very Rare    7
#   Legendary    2
#
# Includes:
# - Hand tools
# - Mechanical parts
# - Electrical parts
# - Construction materials
# - Workshop / heavy industrial gear
# - Mixed industrial loot
#
# Mapper spawners are visible and scatter spawned loot with offset: 0.45.

# ============================================================================
# HAND TOOLS
# ============================================================================

- type: entityTable
  id: MisfitsIndustrialLootTools
  table: !type:GroupSelector
    children:
    # Common - 50
    - !type:GroupSelector
      weight: 50
      children:
      - !type:EntSelector
        id: N14Wrench
        weight: 4
      - !type:EntSelector
        id: N14Screwdriver
        weight: 4
      - !type:EntSelector
        id: N14Wirecutter
        weight: 3
      - !type:EntSelector
        id: N14Shovel
        weight: 2

    # Uncommon - 27
    - !type:GroupSelector
      weight: 27
      children:
      - !type:EntSelector
        id: N14Welder
        weight: 4
      - !type:EntSelector
        id: N14Saw
        weight: 3
      - !type:EntSelector
        id: N14Multitool
        weight: 2

    # Rare - 14
    - !type:GroupSelector
      weight: 14
      children:
      - !type:EntSelector
        id: N14PowerDrill
        weight: 3
      - !type:EntSelector
        id: N14Multitool
        weight: 2
      - !type:EntSelector
        id: ToolboxMechanicalFilled

    # Very Rare - 7
    - !type:GroupSelector
      weight: 7
      children:
      - !type:EntSelector
        id: ToolboxMechanicalFilled
        weight: 2
      - !type:EntSelector
        id: ToolboxElectricalFilled
        weight: 2
      - !type:EntSelector
        id: PowerCellHigh

    # Legendary - 2
    - !type:GroupSelector
      weight: 2
      children:
      - !type:EntSelector
        id: RCD


