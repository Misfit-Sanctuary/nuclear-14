# --- Fire gecko nest. The alpha is a mob takeover: the ghost becomes the gecko itself, and shapes its own nest. ---

# No longer spawned by the event: the alpha's make nest action leaves one behind.
- type: entity
  parent: BaseStructure
  id: MisfitsGeckoNest
  name: fire gecko nest
  description: A mound of warm shells and half-eaten bones.
  suffix: event
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/mob_drops.rsi
    state: egg_deathclaw
    scale: 1.4,1.4
  - type: MisfitsGeckoNest

# A gecko of the pack: the fire gecko with hands and clothing slots, so the alpha's brood can carry and wear things.
- type: entity
  parent: N14MobGeckoFire
  id: MisfitsMobGeckoFirePack
  suffix: event
  categories: [ HideSpawnMenu ]
  components:
  - type: Hands
  - type: ComplexInteraction
  - type: MisfitsMobHands
  # Claws and teeth: a gecko can butcher a corpse without a knife.
  - type: Sharp
  # Wasteland animals inherit an accent that replaces every word with a growl; the pack talks instead.
  - type: ReplacementAccent
    replacementChance: 0
  # English for talking to wastelanders, plus the pack's own tongue.
  - type: LanguageKnowledge
    speaks:
    - English
    - N14Gecko
    understands:
    - English
    - N14Gecko
  # Pockets, belt, back and a hat slot that shows on the sprite.
  - type: Inventory
    templateId: misfitsGecko
  - type: InventorySlots
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  # Hat sprites are drawn for a human head: slide them onto the gecko's head in each side view, and raise every
  # view a few pixels so the brim sits on the skull rather than over the eyes.
  - type: MisfitsClothingDirectionOffset
    slots:
      head:
        South: 0, 0.09375
        North: 0, 0.09375
        East: 0.15625, 0.09375
        West: -0.15625, 0.09375

- type: entity
  parent: MisfitsMobGeckoFirePack
  id: MisfitsMobGeckoFireAlpha
  name: alpha fire gecko
  description: A fire gecko grown huge on easy meals, mean enough to hold a nest.
  suffix: event
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    scale: 1.5,1.5
  # The ghost that takes the alpha names it on the spot.
  - type: MisfitsNamePrompt
  - type: ActionGrant
    actions:
    - ActionGeckoMakeNest
  - type: GhostRole
    name: misfits-ghost-role-gecko-name
    description: misfits-ghost-role-gecko-description
    rules: misfits-ghost-role-gecko-rules
    allowMovement: true
  - type: GhostTakeoverAvailable

# A pack gecko ghost role: the nest grows one each time it is fed enough.
- type: entity
  parent: MarkerBase
  id: MisfitsSpawnPointGeckoFire
  name: fire gecko ghost role
  suffix: event
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    visible: false
  - type: GhostRole
    name: misfits-ghost-role-gecko-pack-name
    description: misfits-ghost-role-gecko-pack-description
    rules: misfits-ghost-role-gecko-pack-rules
  - type: GhostRoleMobSpawner
    prototype: MisfitsMobGeckoFirePack
    deleteOnSpawn: true

