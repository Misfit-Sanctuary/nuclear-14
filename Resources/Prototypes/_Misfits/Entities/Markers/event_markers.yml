# Markers used by the event pool: where events spawn, and the ghost role spawners they place.
# Place these at map entrances in the map editor; events pick one at random, and renaming
# the instance gives that anchor a readable name in the logs and the admin tab.
- type: entity
  id: MisfitsEventAnchor
  name: event anchor
  suffix: event
  parent: MarkerBase
  components:
  - type: Sprite
    sprite: Corvax/Markers/jobs.rsi
    state: green
  - type: MisfitsEventAnchor

# Town and wilderness anchors, so events that want one kind can find them.
- type: entity
  parent: MisfitsEventAnchor
  id: MisfitsEventAnchorTown
  name: event anchor (town)
  suffix: event
  components:
  - type: MisfitsEventAnchor
    kind: Town

- type: entity
  parent: MisfitsEventAnchor
  id: MisfitsEventAnchorWilderness
  name: event anchor (wilderness)
  suffix: event
  components:
  - type: MisfitsEventAnchor
    kind: Wilderness

# Ghost roles placed by events: spawned at runtime, hidden from the spawn menu.
- type: entity
  id: MisfitsSpawnPointGhostGhoul
  name: sentient ghoul ghost role
  suffix: event
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    visible: false
  # The ghost picks one of their own ghoul characters, or a randomly generated ghoul.
  - type: MisfitsGhostRoleCharacterPicker
    allowedSpecies: [ Ghoul ]
    allowRandom: true
    gear: [ MisfitsGhoulHordeGear ]
    # One of the horde, not meat for it: the feral ghouls' own faction, and a shout to send them in.
    addComponents:
    - type: NpcFactionMember
      factions:
      - Feral
    - type: MisfitsGhoulRally
  - type: GhostRole
    name: misfits-ghost-role-ghoul-name
    description: misfits-ghost-role-ghoul-description
    rules: misfits-ghost-role-ghoul-rules
  # Bans key off this prototype id: roleban <player> MisfitsSpawnPointGhostGhoul <reason>

# What the sentient ghoul arrives wearing and carrying; slot names are the wearer's.
- type: startingGear
  id: MisfitsGhoulHordeGear
  equipment:
    jumpsuit: N14ClothingUniformJumpsuitRags
    shoes: N14ClothingShoesRags
    ears: MisfitsClothingHeadsetWastelandScrap

# --- Event ghost roles. The picker offers the taker their own characters (any species
# unless allowedSpecies is set); gear and objective come from here, not from code. ---

- type: entity
  id: MisfitsSpawnPointGhostRaider
  name: sentient raider ghost role
  suffix: event
  parent: MarkerBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    visible: false
  - type: MisfitsGhostRoleCharacterPicker
    allowedSpecies: [ Human, Ghoul, GhoulGlowing ]
    radioTeam: raiders
    # The motive is rolled once by the event, so the whole crew shares it.
    # One of these at random per raider, so a raid is not four identical kits.
    gear:
    - MisfitsRaiderGear
    - MisfitsRaiderGearShotgun
    - MisfitsRaiderGearPistol
    - MisfitsRaiderGearScrap
    objective: misfits-objective-raider
    objectiveDescription: misfits-objective-raider-desc
  - type: GhostRole
    name: misfits-ghost-role-raider-name
    description: misfits-ghost-role-raider-description
    rules: misfits-ghost-role-raider-rules

