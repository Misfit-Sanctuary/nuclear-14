# #Misfits Add - Vehicle Loot location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# CIVILIAN CAR
# ============================================================================

- type: entityTable
  id: MisfitsVehicleLootCivilianCar
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 24
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 9
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsScrapLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 3

- type: entity
  parent: MarkerBase
  id: MisfitsVehicleLootSpawnerCivilianCar
  name: civilian car loot spawner
  suffix: Vehicle Loot, Civilian Car, 1-4
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: 8_ball
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsVehicleLootCivilianCar
      rolls: !type:RangeNumberSelector
        range: 1, 4
    offset: 0.45


