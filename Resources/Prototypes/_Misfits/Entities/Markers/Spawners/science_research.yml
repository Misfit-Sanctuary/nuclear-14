# #Misfits Add - Science / Pre-War Research location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# CHEMISTRY LAB
# ============================================================================

- type: entityTable
  id: MisfitsResearchLocationLootChemistryLab
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsScienceLootAll
      weight: 38
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 9
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 1
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsResearchLocationLootSpawnerChemistryLab
  name: chemistry lab loot spawner
  suffix: Science / Pre-War Research, Chemistry Lab, 3-7
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Objects/Misc/proximity_sensor.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsResearchLocationLootChemistryLab
      rolls: !type:RangeNumberSelector
        range: 3, 7
    offset: 0.45


