# #Misfits Add - Loot Condition location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# PICKED CLEAN
# ============================================================================

# Very sparse leftovers. Intended for visibly looted areas.
- type: entityTable
  id: MisfitsConditionLootPickedClean
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 40
    - !type:NestedSelector
      tableId: MisfitsScrapLootAll
      weight: 24
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 1
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsConditionLootSpawnerPickedClean
  name: picked clean loot spawner
  suffix: Loot Condition, Picked Clean, 1-3
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: tincan
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsConditionLootPickedClean
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45


