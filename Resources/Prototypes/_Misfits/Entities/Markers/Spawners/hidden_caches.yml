# #Misfits Add - Hidden Caches location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# CIVILIAN STASH
# ============================================================================

- type: entityTable
  id: MisfitsHiddenCacheLootCivilianStash
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 16
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 9
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 3

- type: entity
  parent: MarkerBase
  id: MisfitsHiddenCacheLootSpawnerCivilianStash
  name: civilian stash loot spawner
  suffix: Hidden Caches, Civilian Stash, 2-5
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/materials.rsi
      state: ingot_gold
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsHiddenCacheLootCivilianStash
      rolls: !type:RangeNumberSelector
        range: 2, 5
    offset: 0.45


