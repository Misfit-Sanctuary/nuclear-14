# #Misfits Add - Medical Locations location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# DOCTOR'S OFFICE
# ============================================================================

- type: entityTable
  id: MisfitsMedicalLocationLootDoctorSOffice
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 42
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 16
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 9
    - !type:NestedSelector
      tableId: MisfitsScienceLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 2

- type: entity
  parent: MarkerBase
  id: MisfitsMedicalLocationLootSpawnerDoctorSOffice
  name: doctor's office loot spawner
  suffix: Medical Locations, Doctor's Office, 2-5
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Specific/Medical/ms13_medical_new.rsi
      state: ointment1
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMedicalLocationLootDoctorSOffice
      rolls: !type:RangeNumberSelector
        range: 2, 5
    offset: 0.45


