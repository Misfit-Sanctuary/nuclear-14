# #Misfits Add - Vault Loot location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# VAULT RESIDENTIAL
# ============================================================================

- type: entityTable
  id: MisfitsVaultLootVaultResidential
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 22
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 14
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsVaultLootSpawnerVaultResidential
  name: vault residential loot spawner
  suffix: Vault Loot, Vault Residential, 3-7
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: lunchbox
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsVaultLootVaultResidential
      rolls: !type:RangeNumberSelector
        range: 3, 7
    offset: 0.45


