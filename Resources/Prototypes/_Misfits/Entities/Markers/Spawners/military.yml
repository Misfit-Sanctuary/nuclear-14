# #Misfits Add - Military Locations location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# BARRACKS LOCKER
# ============================================================================

- type: entityTable
  id: MisfitsMilitaryLocationLootBarracksLocker
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsMilitaryLootAll
      weight: 26
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 22
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 3

- type: entity
  parent: MarkerBase
  id: MisfitsMilitaryLocationLootSpawnerBarracksLocker
  name: barracks locker loot spawner
  suffix: Military Locations, Barracks Locker, 2-5
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutcombat.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMilitaryLocationLootBarracksLocker
      rolls: !type:RangeNumberSelector
        range: 2, 5
    offset: 0.45


