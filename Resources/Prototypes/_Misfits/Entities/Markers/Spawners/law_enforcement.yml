# #Misfits Add - Law Enforcement location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# POLICE LOCKER
# ============================================================================

- type: entityTable
  id: MisfitsLawEnforcementLootPoliceLocker
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 24
    - !type:NestedSelector
      tableId: MisfitsArmorLootAll
      weight: 22
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 14
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 14
    - !type:NestedSelector
      tableId: MisfitsMilitaryLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 2

- type: entity
  parent: MarkerBase
  id: MisfitsLawEnforcementLootSpawnerPoliceLocker
  name: police locker loot spawner
  suffix: Law Enforcement, Police Locker, 1-3
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Clothing/OuterClothing/Armor/falloutcombat.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsLawEnforcementLootPoliceLocker
      rolls: !type:RangeNumberSelector
        range: 1, 3
    offset: 0.45


