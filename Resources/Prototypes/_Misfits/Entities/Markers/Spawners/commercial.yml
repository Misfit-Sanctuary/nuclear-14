# #Misfits Add - Commercial location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# GENERAL STORE
# ============================================================================

- type: entityTable
  id: MisfitsCommercialLootGeneralStore
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 15
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 6
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 2

- type: entity
  parent: MarkerBase
  id: MisfitsCommercialLootSpawnerGeneralStore
  name: general store loot spawner
  suffix: Commercial, General Store, 4-9
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: lunchbox
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsCommercialLootGeneralStore
      rolls: !type:RangeNumberSelector
        range: 4, 9
    offset: 0.45


