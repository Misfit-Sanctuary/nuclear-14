# #Misfits Add - Industrial Locations location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# FACTORY FLOOR
# ============================================================================

- type: entityTable
  id: MisfitsIndustrialLocationLootFactoryFloor
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsIndustrialLootAll
      weight: 28
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 22
    - !type:NestedSelector
      tableId: MisfitsScrapLootAll
      weight: 18
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsIndustrialLocationLootSpawnerFactoryFloor
  name: factory floor loot spawner
  suffix: Industrial Locations, Factory Floor, 5-12
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/materials.rsi
      state: ingot_iron
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsIndustrialLocationLootFactoryFloor
      rolls: !type:RangeNumberSelector
        range: 5, 12
    offset: 0.45


