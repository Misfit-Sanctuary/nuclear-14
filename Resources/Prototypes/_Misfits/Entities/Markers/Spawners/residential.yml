# #Misfits Add - Residential / Civilian location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# KITCHEN
# ============================================================================

- type: entityTable
  id: MisfitsResidentialLootKitchen
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 45
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsScrapLootAll
      weight: 4

- type: entity
  parent: MarkerBase
  id: MisfitsResidentialLootSpawnerKitchen
  name: kitchen loot spawner
  suffix: Residential / Civilian, Kitchen, 3-7
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: coffeepot
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsResidentialLootKitchen
      rolls: !type:RangeNumberSelector
        range: 3, 7
    offset: 0.45


