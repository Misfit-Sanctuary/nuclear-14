# #Misfits Add - Food-Specific Locations location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# KITCHEN PANTRY
# ============================================================================

- type: entityTable
  id: MisfitsFoodLocationLootKitchenPantry
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 65
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 1
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsFoodLocationLootSpawnerKitchenPantry
  name: kitchen pantry loot spawner
  suffix: Food-Specific Locations, Kitchen Pantry, 4-10
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: lunchbox
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsFoodLocationLootKitchenPantry
      rolls: !type:RangeNumberSelector
        range: 4, 10
    offset: 0.45


