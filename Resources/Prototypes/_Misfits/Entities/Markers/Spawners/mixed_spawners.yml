# ============================================================================
# VISIBLE MIXED LOOT SPAWNER BASE
# ============================================================================

- type: entity
  abstract: true
  name: mixed loot spawner
  id: MisfitsMixedLootSpawnerBase
  parent: MarkerBase


# Sprite legend:
# Tiny       -> 8-ball
# Small      -> tin can
# Medium     -> Vault-Tec lunchbox
# Large      -> toaster
# Huge       -> coffee pot
# Civilian   -> Cram
# Workshop   -> wrench
# Medical    -> healing salve
# Military   -> 9mm pistol
# Science    -> proximity sensor
# Faction    -> NCR helmet
# Contraband -> suppressed 10mm SMG
# High Value -> money bag
# Random     -> blue / green / red holotapes by size
#
# ============================================================================
# GENERAL LOOT - VARYING AMOUNTS
# ============================================================================

- type: entity
  parent: MisfitsMixedLootSpawnerBase
  id: MisfitsMixedLootSpawnerTiny
  name: mixed loot spawner
  suffix: General, Tiny, 1-2
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: 8_ball
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsMixedLootGeneral
      rolls: !type:RangeNumberSelector
        range: 1, 2
    offset: 0.45

