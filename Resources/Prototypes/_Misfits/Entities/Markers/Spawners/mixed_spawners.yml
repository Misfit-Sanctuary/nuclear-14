# #Misfits Add - Mixed loot tables and mapper spawners
#
# These tables reference the MASTER tables from the category loot files:
#
#   MisfitsMedicalLootAll
#   MisfitsFoodDrinkLootAll
#   MisfitsClothingLootAll
#   MisfitsWeaponLootAll
#   MisfitsAmmoLootAll
#   MisfitsArmorLootAll
#   MisfitsToolsLootAll
#   MisfitsIndustrialLootAll
#   MisfitsElectronicsLootAll
#   MisfitsScienceLootAll
#   MisfitsSurvivalLootAll
#   MisfitsMilitaryLootAll
#   MisfitsFactionLootAll
#   MisfitsDocumentsLootAll
#   MisfitsValuablesLootAll
#   MisfitsJunkLootAll
#   MisfitsContrabandLootAll
#
# The mixed pools deliberately use different category weights.
# Spawn amount is controlled by the spawner's roll range.
#
# All mapper markers are visible and spawned loot uses offset: 0.45.


# ============================================================================
# GENERAL WASTELAND LOOT
# ============================================================================
# Broad everyday loot.
# Junk, food, survival gear, tools and industrial items dominate.
# Weapons, armor and contraband are possible but uncommon.

- type: entityTable
  id: MisfitsMixedLootGeneral
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 18
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 14
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 11
