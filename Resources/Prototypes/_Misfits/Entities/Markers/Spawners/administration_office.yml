# #Misfits Add - Office / Administrative location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# DESK
# ============================================================================

- type: entityTable
  id: MisfitsOfficeLootDesk
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 34
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 18
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 12
    - !type:NestedSelector
      tableId: MisfitsElectronicsLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsContrabandLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsOfficeLootSpawnerDesk
  name: desk loot spawner
  suffix: Office / Administrative, Desk, 1-4
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/tapes_cards.rsi
      state: holotape_blue
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsOfficeLootDesk
      rolls: !type:RangeNumberSelector
        range: 1, 4
    offset: 0.45


