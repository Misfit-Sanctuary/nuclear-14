# #Misfits Add - Wasteland Locations location/context loot.
#
# These tables mix the existing category master tables.
# Rarity is inherited from the underlying item-category tables.
# Every mapper spawner is visible and uses offset: 0.45.
#

# ============================================================================
# CAMPSITE
# ============================================================================

- type: entityTable
  id: MisfitsWastelandLocationLootCampsite
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: MisfitsSurvivalLootAll
      weight: 28
    - !type:NestedSelector
      tableId: MisfitsFoodDrinkLootAll
      weight: 20
    - !type:NestedSelector
      tableId: MisfitsJunkLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsMedicalLootAll
      weight: 10
    - !type:NestedSelector
      tableId: MisfitsToolsLootAll
      weight: 8
    - !type:NestedSelector
      tableId: MisfitsClothingLootAll
      weight: 7
    - !type:NestedSelector
      tableId: MisfitsWeaponLootAll
      weight: 5
    - !type:NestedSelector
      tableId: MisfitsAmmoLootAll
      weight: 4
    - !type:NestedSelector
      tableId: MisfitsDocumentsLootAll
      weight: 3
    - !type:NestedSelector
      tableId: MisfitsMaterialLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsValuablesLootAll
      weight: 2
    - !type:NestedSelector
      tableId: MisfitsScrapLootAll
      weight: 1

- type: entity
  parent: MarkerBase
  id: MisfitsWastelandLocationLootSpawnerCampsite
  name: campsite loot spawner
  suffix: Wasteland Locations, Campsite, 2-6
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Misc/crafting_junk.rsi
      state: vault_113_canteen
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: MisfitsWastelandLocationLootCampsite
      rolls: !type:RangeNumberSelector
        range: 2, 6
    offset: 0.45


