    content: |2

      [head=2]Community Outreach Initiative[/head]
      [color=#1b4f9c]▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬[/color]
      [bold]Form:[/bold] [color=#e8c547]VT-14-204[/color]
      [color=#AAAAAA][italic]Vault 14 — Department of Charitable Affairs[/italic][/color]
      [color=#1b4f9c]▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬[/color]

      To Our Neighbors on the Surface,

      On behalf of everyone here in Vault 14, we are delighted, genuinely delighted to extend a small token of our continued goodwill to you & yours during what we understand has been a trying several decades.

      Enclosed you will find a care package curated personally by our Outreach Committee: bandages, drinking water, & a modest cash stipend, selected after careful consideration of what we believe the surface community values most.

      We recognize that life beyond the vault door has not been easy. Please know that we think of you often, typically around budget season, & that your continued survival is a source of great pride to everyone here.

      Should you wish to express your gratitude, we ask only that you refrain from approaching the blast door, per Overseer Directive 14-C.

      [bold]Warmly,[/bold]
      [color=#1b4f9c][italic]The Vault 14 Outreach Committee[/italic][/color]
      [color=#e8c547]▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬[/color]
      [italic][color=#AAAAAA]Please recycle this document responsibly. Vault-Tec thanks you for your commitment to sustainability.[/color][/italic]
      [italic][color=#ff0000]Tampering with or forging this document is a violation of the Vault 14 Resident Charter.[/color][/italic]

