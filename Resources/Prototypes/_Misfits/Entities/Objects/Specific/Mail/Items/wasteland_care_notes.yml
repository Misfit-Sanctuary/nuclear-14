      [color=#AAAAAA][italic]Vault 14 — Office of Public Relations[/italic][/color]
      [color=#1b4f9c]▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬[/color]

      [bold]VAULT 14 PROSPERITY PROGRAM: A RESOUNDING SUCCESS[/bold]

      This quarter, the Vault 14 Prosperity Program is proud to report the successful distribution of aid to [italic]one (1)[/italic] surface recipient, bringing our lifetime total to [bold]fourteen[/bold] individuals reached.

      Internal surveys indicate that 100% of recipients who did not discard this letter unread rated the experience as "acceptable." We consider this an outstanding endorsement of the program's continued value.

      Vault 14 remains fully committed to the wellbeing of the surface community, insofar as it does not require opening the vault door for longer than regulations strictly permit.

      Thank you for your continued participation in this initiative. You have been randomly selected & may not decline.

      [bold]In partnership,[/bold]
      [color=#1b4f9c][italic]Vault 14 Office of Public Relations[/italic][/color]
