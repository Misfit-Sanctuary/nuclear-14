# #Misfits Add - Mech variants for power armor suits that previously had none.
# Completes the power armor -> mech coverage so every wearable PA variant has an
# enterable exosuit form. Pattern matches powerarmor_mechs.yml: each mech inherits
# BasePowerArmorMech (size/scale 1.2 + 0.40 fixture radius, speed, mech stats) and
# overrides only its suit + helmet sprite layers and its tier's integrity/damage set.
#
# Tier reference (maxIntegrity / damageModifierSet):
#   T45 tier  -> 400 / MisfitsMechPowerArmorT45 (base default)
#   T51 tier  -> 480 / MisfitsMechPowerArmorT51
#   T60 tier  -> 445 / MisfitsMechPowerArmorT60
#   APA MK I  -> 460 / MisfitsMechPowerArmorX01
#   APA MK II -> 485 / MisfitsMechPowerArmorX02
#   T51BC     -> 490 / MisfitsMechPowerArmorT51BC
#   Midwest Cmd -> 485 / MisfitsMechPowerArmorMidwestCommander
#   Legion    -> 350 / base (salvaged, deliberately lighter)

# --- T-45 [BoS] ---
- type: entity
  id: N14MechPowerArmorT45BOS
