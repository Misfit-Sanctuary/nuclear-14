# Misfits - medicine pills
#
# ROUTE POLICY:
# - Pills are only used for medicines that make sense as stable oral/tablet doses.
# - Potent drugs use smaller doses; routine medicines use larger doses.
# - Liquid field remedies, surgical drugs, topicals, transfusions and poisons
#   are intentionally not represented as pills.
# - Each pill carries a Label showing the actual reagent dose.
#
# ANTIBIOTICS
- type: entity
  name: antibiotics
  parent: Pill
  id: MisfitsPillAntibiotics
  description: A broad-spectrum antimicrobial treatment intended for serious or uncertain infections.
  components:
  - type: Label
    currentLabel: antibiotics 20u
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: MisfitsAntibiotics
          Quantity: 20

