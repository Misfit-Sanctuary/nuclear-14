# #Misfits Add - dedicated NCR Heavy Trooper armor variants.
# The regular Heavy Trooper uses salvaged T-45 mechanics; the lead's T-51 visual
# suit uses the full working T-45 baseline. NCR visuals and helmets are selected
# here without duplicating armor statistics.

- type: entity
  parent: N14ClothingOuterPowerArmorT45NCRSalvaged
  id: MisfitsNCRHeavyTrooperSalvagedPowerArmorT45
  name: NCR Heavy Trooper T-45 Salvaged Power Armor
  description: A salvaged T-45 power armor suit issued to NCR heavy troopers.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: MisfitsNCRHeavyTrooperT45Helmet
      gloves: N14ClothingPAGauntlets
      shoes: N14ClothingPABoots

- type: entity
  parent: N14ClothingOuterPowerArmorT45
  id: MisfitsNCRHeavyTrooperLeadPowerArmorT51
  name: NCR Heavy Trooper Lead T-51 Salvaged Power Armor
  description: A T-51 power armor suit refitted for NCR heavy trooper leadership. The original fusion core and servo drives have been stripped and replaced with a bulky combustion engine and hydraulic actuators, crude but reliable. The engine belches exhaust from the back-mounted generator, driving hydraulic pistons where servos once whined. Reserved for veteran heavy trooper leads who can tolerate the noise, heat, and fuel logistics.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: MisfitsNCRHeavyTrooperLeadT51Helmet
      gloves: N14ClothingPAGauntlets
      shoes: N14ClothingPABoots
      back: MisfitsCombustionEnginePowerSystemsBack
  - type: Explosive
    explosionType: N14DefaultStructural
    totalIntensity: 5
    maxIntensity: 5
    intensitySlope: 20
    tileBreakScale: 0
    maxTileBreak: 0
    deleteAfterExplosion: false
  - type: DelayedExplosionOnBreak
    delay: 3
  - type: PowerArmorIntegrity
    disableServosLock: true

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45NCR
  id: MisfitsNCRHeavyTrooperT45Helmet
  name: NCR Heavy Trooper T-45 Power Armor Helmet
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_t45_helmet.rsi
    layers:
    - state: icon
    - state: equipped-HELMET
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
  # The supplied NCR helmet RSI has no light-overlay/on-equipped-HELMET states.
  # Keep its functional PointLight, but do not request missing visual states.
  - type: ToggleableLightVisuals
    spriteLayer: null
    inhandVisuals: {}
    clothingVisuals: {}

- type: entity
  parent: N14ClothingHeadHelmetPowerArmorT45NCR
  id: MisfitsNCRHeavyTrooperLeadT51Helmet
  name: NCR Heavy Trooper Lead T-51 Salvaged Power Armor Helmet
  description: A T-51 helmet refitted for the salvaged lead suit. The original recon optics have been removed to simplify maintenance; the interior is lined with heat-resistant padding to cope with the engine's exhaust bleed.
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/NCR/ncr_heavy_trooper_lead_t51_helmet.rsi
    layers:
    - state: icon
    - state: equipped-HELMET
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
  # The supplied NCR helmet RSI has no light-overlay/on-equipped-HELMET states.
  # Keep its functional PointLight, but do not request missing visual states.
  - type: ToggleableLightVisuals
    spriteLayer: null
    inhandVisuals: {}
    clothingVisuals: {}

# X-01 is intentionally not referenced by a job or loadout. It is spawn-menu only.
- type: entity
  parent: N14ClothingOuterPowerArmorAdvanced1
  id: MisfitsNCRX01PowerArmor
