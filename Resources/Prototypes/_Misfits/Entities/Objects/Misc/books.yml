  components:
  - type: PaperRandomStory
    storySegments:
    - "This is a "
    - falloutbook_genre
    - " about a "
    - falloutbook_character_prewartrait
    - " "
    - falloutbook_characterprewar
    - " and "
    - falloutbook_character_prewartrait
    - " "
    - falloutbook_characterprewar
    - ". Due to "
    - falloutbook_prewarevent
    - ", they "
    - falloutbook_action_trait
    - " "
    - falloutbook_action
    - " "
    - falloutbook_characterprewar
    - " "
    - falloutbook_prewarlocation
    - ". \n\n"
    - falloutbook_element
    - " is "
    - falloutbook_element_trait
    - "."
