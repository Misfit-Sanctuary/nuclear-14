#MARK: Bookbase
- type: entity
  name: Pre-War Book
  parent: BaseItem
  id: FalloutBookBase
  description: A pre-war book that has survived the fallout.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Misc/books.rsi
    layers:
    - state: falloutpaper
    - state: fallout_cover_base
      color: "#566556"
      map: [ "cover" ]
    - state: fallout_decor_stripe
      color: "#575A43"
      map: [ "decor" ]
    - state: fallout_icon_null
      map: [ "icon" ]
    - state: fallout_overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
      - Book
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_Misfits/Interface/Paper/paper_background_fallout.svg.96dpi.png"
    backgroundPatchMargin: 14.0, 15.0, 23.0, 16.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

- type: entity
  name: Burned Book
  parent: BaseItem
  id: FalloutBookBaseBurned
  description: A book that has not survived the fallout.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Misc/books.rsi
    layers:
    - state: falloutpaperburned
    - state: fallout_cover_base_burned
      color: "#24211A"
      map: [ "cover" ]
    - state: fallout_decor_stripe
      color: "#5E473F"
      map: [ "decor" ]
    - state: fallout_icon_null
      map: [ "icon" ]
    - state: fallout_overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
      - Book
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_Misfits/Interface/Paper/paper_background_falloutburned.svg.96dpi.png"
    backgroundPatchMargin: 14.0, 15.0, 23.0, 16.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

- type: entity
  name: Damaged Book
  parent: BaseItem
  id: FalloutBookBaseDamaged
  description: A book that has not survived the fallout.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Misc/books.rsi
    layers:
    - state: falloutpaperdamaged
    - state: fallout_cover_base_damaged
      color: "#5b3f33"
      map: [ "cover" ]
    - state: fallout_decor_stripe
      color: "#766c5c"
      map: [ "decor" ]
    - state: fallout_icon_null
      map: [ "icon" ]
    - state: fallout_overlay_null
      map: [ "overlay" ]
  - type: Paper
    contentSize: 12000
  - type: ActivatableUI
    key: enum.PaperUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
  - type: Tag
    tags:
      - Book
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_Misfits/Interface/Paper/paper_background_falloutdamaged.svg.96dpi.png"
    backgroundPatchMargin: 14.0, 15.0, 23.0, 16.0
    contentMargin: 20.0, 20.0, 20.0, 20.0
  - type: EmitSoundOnPickup
    sound: /Audio/SimpleStation14/Items/Handling/book_pickup.ogg
  - type: EmitSoundOnDrop
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg
  - type: EmitSoundOnLand
    sound: /Audio/SimpleStation14/Items/Handling/book_drop.ogg

