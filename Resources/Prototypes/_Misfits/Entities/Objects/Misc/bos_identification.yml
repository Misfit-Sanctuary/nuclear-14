##MARK: Brotherhood Midwest
- type: entity
  parent: N14IDPassportBlank
  id: N14IDBrotherhoodHolotag
  name: senior scribe's holotags
  description: The chapter cannot be allowed to repeat the past, forgetting the teachings of the Codex. Keep them on the right path, show them the way.
  suffix: Senior Scribe
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: bos_holotag
  - type: IdCard
    nameLocId: n14-id-holotag-name
    fullNameLocId: n14-id-holotag-full-name
  - type: PresetIdCard
    job: BoSMidScribe
  - type: Tag
    tags:
    - IdCardBrotherhood
  - type: ClothingAddFaction
    faction: BrotherhoodOfSteel

- type: entity
  parent: N14IDBrotherhoodHolotag
  id: N14IDBrotherhoodHolotagSquire
  name: squire's holotags
  description: You still have something to prove, and all the opportunity to mess it all up first.
  suffix: Squire
  components:
  - type: PresetIdCard
    job: BoSMidSquire

- type: entity
  parent: N14IDBrotherhoodHolotag
  id: MisfitsIDBOSOffDuty
  name: off-duty holotags
  description: You've been given a brief moment of rest, yet these holotags still feel heavy as an anchor around the neck.
  suffix: Off-Duty
  components:
  - type: PresetIdCard
    job: BoSOffDuty

- type: entity
  parent: N14IDBrotherhoodHolotag
  id: N14IDBrotherhoodHolotagKnight
  name: senior knight's holotags
  description: These holotags are only issued to those who have proven both competent and responsible, worthy of keeping the chapter from descending into insanity.
  suffix: Senior Knight
  components:
  - type: PresetIdCard
    job: BoSMidKnight

- type: entity
  parent: N14IDBrotherhoodHolotag
  id: N14IDBrotherhoodHolotagPaladin
  name: senior paladin's holotags
  description: These holotags are issued to those who have shown bravery in combat, diplomatic skill with outsiders, and loyalty towards their brothers and sisters.
  suffix: Senior Paladin
  components:
  - type: PresetIdCard
    job: BoSMidPaladin

- type: entity
  parent: N14IDBrotherhoodHolotag
  id: N14IDBrotherhoodHolotagCommander
  name: head paladin's holotags
  description: The safety of the chapter is in your hands, and all eyes are on you for a possible fumble of diplomacy or a failure to win the upcoming battles.
  suffix: Head Paladin
  components:
  - type: PresetIdCard
    job: BoSMidPaladinCommander

##MARK: Brotherhood Unified Live Jobs
- type: entity
  parent: N14IDPassportBlank
  id: N14IDBrotherhoodOfSteelHolotagBase
  name: Brotherhood holotags
  description: Holotags marking a member of the Brotherhood of Steel, words flicker over the surface, the names and ranks on its memory ready to be committed to memorial.
  suffix: Brotherhood
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/identification.rsi
    state: bos_holotag
  - type: IdCard
    nameLocId: n14-id-holotag-name
    fullNameLocId: n14-id-holotag-full-name
  - type: Tag
    tags:
    - IdCardBrotherhood
  - type: ClothingAddFaction
    faction: BrotherhoodOfSteel

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagInitiate
  name: initiate's holotags
  description: These holotags mark you as a hopeful of the chapter's brothers and sisters, ready to cement your life into a rigid caste system for a higher cause.
  suffix: Initiate
  components:
  - type: PresetIdCard
    job: BoSInitiate  #Misfits Change /Tweak/: Updated to new consolidated BoS Initiate job

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagSquire
  name: squire's holotags
  description: You still have something to prove, and all the opportunity to mess it all up first.
  suffix: Squire
  components:
  - type: PresetIdCard
    job: BoSMidSquire

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagScribe
  name: scribe's holotags
  description: These holotags have a heavy weight to them, that of responsibility and tradition. Bear this burden with dignity and noble purpose.
  suffix: Scribe
  components:
  - type: PresetIdCard
    job: BoSScribe  #Misfits Change /Tweak/: Updated to new consolidated BoS Scribe job

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagSeniorScribe
  name: senior scribe's holotags
  description: The chapter cannot be allowed to repeat the past, forgetting the teachings of the Codex. Keep them on the right path, show them the way.
  suffix: Senior Scribe
  components:
  - type: PresetIdCard
    job: BoSMidScribe

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagHeadScribe
  name: head scribe's holotags
  description: The chapter looks to you for guidance. Do not just recycle past knowledge, they need you to make new discoveries for humanity's survival.
  suffix: Head Scribe
  components:
  - type: PresetIdCard
    job: BoSWestScribe

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagKnight
  name: knight's holotags
  description: Sort the supplies, manage the defense, tend to the prisoners; yours is a practical duty, needed for the daily maintenance of life.
  suffix: Knight
  components:
  - type: PresetIdCard
    job: BoSKnight  #Misfits Change /Tweak/: Updated to new consolidated BoS Knight job

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagSeniorKnight
  name: senior knight's holotags
  description: These holotags are only issued to those who have proven both competent and responsible, worthy of keeping the chapter from descending into insanity.
  suffix: Senior Knight
  components:
  - type: PresetIdCard
    job: BoSMidKnight

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagHeadKnight
  name: head knight's holotags
  description: Issued only to those who can bear the stress of managing the problems of the chapter from the guidance of the scribes, and enforce the teachings of the Codex without failure.
  suffix: Head Knight
  components:
  - type: PresetIdCard
    job: BoSHeadKnight  #Misfits Change /Tweak/: Updated to new consolidated BoS Head Knight job

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagPaladin
  name: paladin's holotags
  description: With your rank comes great purpose, as you are expected not just to lead the chapter in combat from the frontline, but prevent it in the first place through diplomacy with untrustworthy outsiders.
  suffix: Paladin
  components:
  - type: PresetIdCard
    job: BoSPaladin  #Misfits Change /Tweak/: Updated to new consolidated BoS Paladin job

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagSeniorPaladin
  name: senior paladin's holotags
  description: These holotags are issued to those who have shown bravery in combat, diplomatic skill with outsiders, and loyalty towards their brothers and sisters. Guide the paladins and follow the Chain of Command.
  suffix: Senior Paladin
  components:
  - type: PresetIdCard
    job: BoSMidPaladin

- type: entity
  parent: N14IDBrotherhoodOfSteelHolotagBase
  id: N14IDBrotherhoodOfSteelHolotagHeadPaladin
  name: head paladin's holotags
  description: The safety of the chapter is in your hands, and all eyes are on you for a possible fumble of diplomacy or a failure to win the upcoming battles. Take care not to let down your brothers and sisters.
  suffix: Head Paladin
  components:
  - type: PresetIdCard
    job: BoSMidPaladinCommander

