- type: entity
  name: base flamer fuel
  description: A cannister of fuel used in weapons
  id: N14BaseFlamerFuel
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.015
  - type: Explosive
    #Misfits Change - use the structural-capable N14 explosion profile.
    explosionType: N14DefaultStructural
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: _Misfits/Objects/Weapons/Guns/Ammunition/Battery/Flame/flamerfuel.rsi
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Iron
          Quantity: 5
  - type: Appearance
  - type: PowerCellVisuals
  - type: Riggable

- type: entity
  name: flamer fuel cannister
  description: A cannister of fuel used in weapons
  id: N14FlamerFuel
  suffix: Full
  parent: N14BaseFlamerFuel
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Weapons/Guns/Ammunition/Battery/Flame/flamerfuel.rsi
    scale: 0.45, 0.45
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o3
        shader: unshaded
  - type: Tag
    tags:
      - N14FlamerFuel
      - N14AmmoCell
  - type: ProjectileBatteryAmmoProvider
    proto: BulletFlame
    fireCost: 10
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000

- type: entity
  name: enriched flamer fuel cannister
  description: A specialized cannister of fuel used in weapons
  id: N14EnrichedFlamerFuel
  suffix: Full
  parent: N14BaseFlamerFuel
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Weapons/Guns/Ammunition/Battery/Flame/enrichedflamerfuel.rsi
    scale: 0.45, 0.45
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o3
        shader: unshaded
  - type: Tag
    tags:
      - N14EnrichedFlamerFuel
      - N14AmmoCell
  - type: ProjectileBatteryAmmoProvider
    proto: BulletIncinerator
    fireCost: 50
  - type: Battery
    maxCharge: 2000
    startingCharge: 2000
