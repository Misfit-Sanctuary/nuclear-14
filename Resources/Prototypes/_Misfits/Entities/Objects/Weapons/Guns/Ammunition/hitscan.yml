# Misfits — Hitscan beam definitions for energy weapons.
# Each weapon specifies its own beam via GunDamageBonusComponent.hitscanProtoOverride.
# The cell just provides charge; the weapon controls beam color and base damage.
# AER damage: AER-9 (24) < AER-9 Auto (20) < AER-12 (26) < AER-14 (28) < AER-15 (30).

#MARK: Microfusion Cell Lasers — per-weapon beam assignment
# AER-9 -> Red 24
# AER-9 Auto -> Red 20
# AER-12 -> Orange 26
# AER-14 -> Blue 28
# AER-15 -> Violet 30
# Wattz 2K/3K -> Yellow (with GunDamageBonus on top)
# Violet -> reserved for future / highest-tier weapons

- type: hitscan
  id: N14MFLaserRed
  damage:
    types:
      Heat: 24
  muzzleFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: muzzle_laser
  travelFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: beam
  impactFlash:
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    state: impact_laser

