# Misfits 40mm variants inherit the existing launcher-compatible casing.

- type: entity
  id: Misfits40mmGrenadeHEDP
  parent: 40mmGrenadeFrag
  name: 40mm HEDP grenade
  description: A 40mm round combining a compact explosive blast with lethal fragmentation. Use from cover.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmHEDPProjectile
  - type: Sprite
    layers:
    - state: he
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: he

- type: entity
  id: Misfits40mmGrenadePulse
  parent: 40mmGrenadeFrag
  name: 40mm pulse grenade
  description: A 40mm round that releases an electromagnetic pulse and a blue energy burst. Effective against robots and powered armor.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmPulseProjectile
  - type: Sprite
    layers:
    - state: emp
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: emp

- type: entity
  id: Misfits40mmGrenadePlasma
  parent: 40mmGrenadeFrag
  name: 40mm plasma grenade
  description: A 40mm round that releases a compact burst of caustic green plasma.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmPlasmaProjectile

- type: entity
  id: Misfits40mmGrenadeBuckshot
  parent: 40mmGrenadeFrag
  name: 40mm buckshot round
  description: A 40mm shell containing twenty small buckshot pellets. Fires directly from the launcher without an explosion.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmBuckshotSpread
  - type: Sprite
    layers:
    - state: buckshot
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: buckshot

- type: entity
  id: Misfits40mmGrenadeSmoke
  parent: 40mmGrenadeFrag
  name: 40mm smoke round
  description: A 40mm round that releases screening smoke on impact.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmSmokeProjectile

- type: entity
  id: Misfits40mmGrenadeWhitePhosphorus
  parent: 40mmGrenadeFrag
  name: 40mm white phosphorus round
  description: A 40mm round that releases pale, caustic screening smoke without igniting its targets.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmWhitePhosphorusProjectile

- type: entity
  id: Misfits40mmGrenadeFlashbang
  parent: 40mmGrenadeFrag
  name: 40mm flashbang round
  description: A 40mm round that produces a blinding flash and loud bang on impact.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmFlashbangProjectile
  - type: Sprite
    layers:
    - state: flashbang
      map: ["enum.AmmoVisualLayers.Base"]
  - type: SpentAmmoVisuals
    state: flashbang

- type: entity
  id: Misfits40mmGrenadeTearGas
  parent: 40mmGrenadeFrag
  name: 40mm tear gas round
  description: A 40mm riot-control round that releases irritating tear gas on impact.
  components:
  - type: CartridgeAmmo
    proto: Misfits40mmTearGasProjectile
