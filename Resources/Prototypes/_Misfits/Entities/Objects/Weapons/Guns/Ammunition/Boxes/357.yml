# #Misfits Add - .357 Magnum ammunition box.
# No .357 box existed in the codebase. Detective Special / Cowboy Repeater / Lucky
# needed a box to make .357 craftable via ammo blueprints.
# TODO: dedicated 357.rsi sprite; reusing 44.rsi as a placeholder for now.

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBox357
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - N14CartridgePistol357
    proto: N14CartridgePistol357
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Boxes/357.rsi
    netsync: false
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FoldableAmmoBox

- type: entity
  parent: BaseMagazineBox357
  id: N14AmmoBox357
  name: ammunition box (.357 magnum)
  components:
  - type: BallisticAmmoProvider
    proto: N14CartridgePistol357
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
