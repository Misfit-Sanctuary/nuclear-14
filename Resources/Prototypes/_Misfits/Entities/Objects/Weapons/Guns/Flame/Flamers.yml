- type: entity
  id: N14Flamebase
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Large
  - type: AmmoCounter
  - type: Gun
    minAngle: 25
    maxAngle: 60
    angleIncrease: 4
    angleDecay: 16
    fireRate: 10
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Nuclear14/Weapons/Guns/Flames/flamer.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14FlamerFuel
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14FlamerFuel
  - type: Appearance
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: StaticPrice
    price: 100
