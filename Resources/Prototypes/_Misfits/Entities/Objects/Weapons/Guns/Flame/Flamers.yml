#MARK: New Weapons

- type: entity
  name: Flamer
  parent: N14Flamebase
  id: N14Flamer
  description: A weapon that shoots a mixture of fuel.
  components:
  - type: MultiHandedItem
  - type: Sprite
    sprite: _Misfits/Objects/Weapons/Guns/Flame/flamer.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-2
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Misfits/Objects/Weapons/Guns/Flame/flamer.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
  - type: Item
    size: Ginormous
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: N14FlamerFuel
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - N14FlamerFuel
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: Gun
    minAngle: 5
    maxAngle: 30
    angleIncrease: 1
    angleDecay: 3
    projectileSpeed: 10
    fireRate: 8
    soundGunshot:
      path: /Audio/_Nuclear14/Weapons/Guns/Flames/flamer.ogg
    selectedMode: FullAuto
    availableModes:
    - FullAuto
  - type: FollowDistance
    backStrength: 6
  - type: StaticPrice
    price: 400

