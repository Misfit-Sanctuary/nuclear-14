# Weapons restricted to Priesthood of Mars

# Blade of Mars; reskin of Shishkebab for Priesthood

- type: entity
  parent: N14WeaponKebab
  id: N14WeaponMarsblade
  name: Blade of Mars
  description: "An enhanced version of the shishkebab made and used by the Priesthood of Mars, said to be fueled by his own divine fire. In reality, it's gasoline."
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Weapons/Melee/marsblade.rsi
    layers:
    - state: icon
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleVisuals.Layer"]
  - type: Item
    sprite: _Misfits/Objects/Weapons/Melee/marsblade.rsi
    size: Huge
    # Misfits Fix - explicit inhand visuals so the weapon sprite shows correctly when held
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Clothing
    sprite: _Misfits/Objects/Weapons/Melee/marsblade.rsi
    quickEquip: false
    slots:
    - belt
    - Back
    - suitStorage

# Torch of Mars; larp item

- type: entity
  parent: BaseItem
  name: Flame of Mars
  description: A special torch carried by the Priesthood of Mars, ignited with an unnaturally red flame. When lit, it is said to allow his chosen to speak to him directly - though he may not respond...
  id: BibleMars
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Items/Flare/flare_on.ogg
    soundDeactivate:
      path: /Audio/Items/candle_blowing.ogg
  - type: Sprite
    sprite: Objects/Misc/torch.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: torch_unlit
    # #Misfits Fix: Use plain string key so ToggleableLightVisualsSystem (SpriteLayer is string?) can find this layer via LayerMapTryGet.
    # Previously used enum.ExpendableLightVisualLayers.Glow which caused a string/enum key mismatch, preventing the fire sprite from showing on the ground.
    - map: [ "torch_glow" ]
      state: lit_overlay
      color: "#df0f0f"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: torch_nocloth
  - type: UseDelay
    delay: 1.0
  - type: Prayable
    bibleUserOnly: true
  - type: Icon
    sprite: Objects/Misc/torch.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/torch.rsi
    heldPrefix: unlit
  - type: ToggleableLightVisuals
    spriteLayer: torch_glow
    inhandVisuals:
      left:
      - state: lit-inhand-left
        shader: unshaded
      right:
      - state: lit-inhand-right
        shader: unshaded
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#df0f0f"
    radius: 5.0
    energy: 7.0
    netsync: false
  - type: Clothing
    slots:
    - Belt
  - type: MeleeWeapon # Nyanotrasen - Bibles do Holy damage
    damage:
      types:
        Blunt: 5
        Heat: 5 # more in line with Misfits melee meta.
    heavyRateModifier: 1.25
    heavyDamageBaseModifier: 1
    heavyStaminaCost: 5
    maxTargets: 4
  - type: IgnitionSource
    temperature: 400
    ignited: false
  - type: ItemToggleHot
  - type: ItemTogglePointLight
  - type: Tag
    tags:
    - Torch
