#Lasagna: 1 Tato, 1 Dough Slice, 1 Irradiated Meat, 1 Cheese Wedge -> 15 sec
- type: entity
  parent: MisfitsFoodBase
  id: MisfitsFoodLasagna
  components:
  - type: Food
    eatMessage: food-desc-lasagna-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: lasagna
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 30
        - ReagentId: Protein
          Quantity: 10

