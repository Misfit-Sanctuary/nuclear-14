# Legion Warhound Rations
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatLegion
  name: Warhound Ration
  description: A dense, extremely chewy strip of meat wrapped in coarse tortilla dough. Made to withstand long marches, rough handling, and the teeth of an impatient war hound.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: meatJerky
  - type: Food
    eatMessage: misfits-dog-treat-legion-eat
    delay: 2.5
  - type: FlavorProfile
    flavors:
    - meaty
    - smokey
    - salty
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 4

