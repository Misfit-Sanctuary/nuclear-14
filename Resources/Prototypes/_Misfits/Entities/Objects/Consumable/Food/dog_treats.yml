
# #Misfits Add - Wasteland dog treats.

# Base
- type: entity
  parent: FoodBase
  id: MisfitsDogTreatBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Food
    transferAmount: null
    delay: 0.8
    forceFeedDelay: 1.5
  - type: Tag
    tags:
    - FoodSnack

# Cheesy Jerky Bites
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatCheesyJerky
  name: cheesy jerky bites
  description: Tender strips of dried meat wrapped around little pieces of cheese. A favorite among wasteland hounds, especially one particularly spoiled wolfdog.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: meatJerky
  - type: Food
    eatMessage: misfits-dog-treat-cheesy-jerky-eat
  - type: FlavorProfile
    flavors:
    - meaty
    - cheesy
    - savory
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 3
        - ReagentId: Protein
          Quantity: 2

# Wasteland Dog Biscuits
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatBiscuit
  name: wasteland dog biscuit
  description: A hard, crunchy biscuit made from flour and scraps of cooked meat. It has an almost suspiciously long shelf life.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/misc.rsi
    state: cookie-oatmeal
  - type: Food
    eatMessage: misfits-dog-treat-biscuit-eat
  - type: FlavorProfile
    flavors:
    - meaty
    - oats
    - savory
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 4
        - ReagentId: Protein
          Quantity: 1

# Radstag Chews
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatRadstagChew
  name: radstag chew
  description: A tough, dried strip of radstag meat. It takes some effort to chew, making it a particularly satisfying reward for larger dogs.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: dicedMeat
  - type: Food
    eatMessage: misfits-dog-treat-radstag-eat
  - type: FlavorProfile
    flavors:
    - meaty
    - smokey
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Protein
          Quantity: 4
        - ReagentId: Nutriment
          Quantity: 1

# Bacon Treat
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatBacon
  name: savory training bites
  description: Small pieces of cooked wasteland meat mixed with cheese. Their rich smell makes them an excellent reward for a dog that has actually listened to a command.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: sausageFried
  - type: Food
    eatMessage: misfits-dog-treat-bacon-eat
  - type: FlavorProfile
    flavors:
    - cheesy
    - meaty
    - savory
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 6
        reagents:
        - ReagentId: Nutriment
          Quantity: 2
        - ReagentId: Protein
          Quantity: 3

# NCR Double-Bear Biscuits
- type: entity
  parent: MisfitsDogTreatBase
  id: MisfitsDogTreatNCR
  name: Double-Bear Biscuit
  description: A sturdy cornmeal biscuit made for Republic service dogs. Supposedly stamped with the double-headed bear, although the imprint looks suspiciously like two blobs.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: shortCake
  - type: Food
    eatMessage: misfits-dog-treat-ncr-eat
  - type: FlavorProfile
    flavors:
    - meaty
