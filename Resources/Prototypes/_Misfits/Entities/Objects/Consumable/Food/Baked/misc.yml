- type: entity
  name: cookie
  parent: N14CookedFoodBakedBase
  id: N14CookedFoodBakedCookie # tmp, changing ID means replacing prototype in all map files!
  description: COOKIE!!!
  components:
    - type: Sprite
      state: COOKIE!!!
      
- type: entity
  name: chocolate chip pancake
  parent: N14CookedFoodBakedBase
  id: N14CookedFoodBakedPancakeCc # tmp, changing ID means replacing prototype in all map files!
  description: A fluffy and delicious chocolate chip pancake.
  components:
    - type: Stack
      stackType: Pancake
      count: 1
      composite: true
      layerStates:
        - pancakescc1
        - pancakescc2
        - pancakescc3
    - type: Sprite
      state: pancakescc1
      layers:
        - state: pancakescc1
          map: ["pancakescc1"]
          visible: false
        - state: pancakescc2
          map: ["pancakescc2"]
          visible: false
        - state: pancakescc3
          map: ["pancakescc3"]
          visible: false
    - type: Appearance
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 6
          reagents:
            - ReagentId: Nutriment
              Quantity: 5
            - ReagentId: Theobromine
              Quantity: 1
    - type: Tag
      tags:
        - Pancake
      
