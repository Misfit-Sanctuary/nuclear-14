# fixing and migrating chocolate recipes from _Nuclear14

- type: entity
  name: special brownies
  parent: N14CookedFoodBakedBase
  id: N14CookedFoodBakedCannabisBrownieBatch # tmp, changing ID means replacing prototype in all map files!
  description: A pan of special brownies that let you get cozily high. Hard to eat just one...
  components:
    - type: FlavorProfile
      flavors:
        - sweet
        - magical
        - chocolate
    - type: Sprite
      sprite: Objects/Consumable/Food/Baked/brownie.rsi
      state: brownie-batch
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 228
          reagents:
            - ReagentId: Nutriment
              Quantity: 30
            - ReagentId: Theobromine
              Quantity: 18
            - ReagentId: THC
              Quantity: 150
    - type: SliceableFood
      count: 6
      slice: N14CookedFoodBakedCannabisBrownie
      
- type: entity
  name: brownies
  parent: N14CookedFoodBakedBase
  id: N14CookedFoodBakedBrownieBatch # tmp, changing ID means replacing prototype in all map files!
  description: A pan of brownies.
