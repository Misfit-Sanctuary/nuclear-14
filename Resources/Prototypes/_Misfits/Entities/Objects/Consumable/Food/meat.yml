    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: redFishCutlet
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: N14UncookedAnimalProteinsRad
          Quantity: 2
        - ReagentId: Vitamin
