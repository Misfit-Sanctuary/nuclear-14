- type: entity
  name: stick of cannabis butter
  parent: N14FoodBakingBase
  id: N14FoodCannabisButter # tmp, changing ID means replacing prototype in all map files!
  description: Add this to your favorite baked goods for an irie time.
  components:
    - type: Sprite
      state: butter
      color: "#82C36E"
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 100
          reagents:
            - ReagentId: Butter
              Quantity: 10
            - ReagentId: THC
              Quantity: 82
    - type: Extractable
      grindableSolutionName: food

# diced Meat
- type: entity
  parent: MisfitsFoodBase
  id: MisfitsFoodDicedMeat
  components:
  - type: Food
    eatMessage: food-desc-dicedMeat-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: dicedMeat
  - type: SolutionSpiker
    sourceSolution: food
    ignoreEmpty: true
  - type: ScoopableSolution
    solution: food
  - type: Extractable
    grindableSolutionName: food
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: DicedMeat
          Quantity: 10

