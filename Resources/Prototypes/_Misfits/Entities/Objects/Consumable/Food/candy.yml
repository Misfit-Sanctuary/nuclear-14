#- Toffee -> 1 Pinion nut, 15u sugar -> 15 sec
- type: entity
  parent: MisfitsFoodBase
  id: MisfitsFoodToffee
  components:
  - type: Food
    eatMessage: food-desc-toffeeBar-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: toffeeChunk
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Sugar
          Quantity: 10

#Toffee Sheet: 2 pinion nut, 40u sugar -> 30 sec
- type: entity
  parent: MisfitsFoodBase
  id: MisfitsFoodToffeeSheet
  components:
  - type: Food
    eatMessage: food-desc-toffee-eat
  - type: Sprite
    sprite: _Misfits/Objects/Consumable/Food/FoodStuffs.rsi
    state: toffeeSheet
  - type: SolutionContainerManager
    solutions:
      food:
        reagents:
        - ReagentId: Nutriment
          Quantity: 30
        - ReagentId: Sugar
          Quantity: 60
  - type: SliceableFood
    slice: MisfitsFoodToffee
    count: 6

