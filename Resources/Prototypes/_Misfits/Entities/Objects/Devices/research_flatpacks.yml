- type: entity
  parent: ResearchAndDevelopmentServer
  id: MisfitsResearchServerField
  name: field R&D server
  description: A pre-war research server.
  components:
  - type: ResearchServer
    serverName: FIELD RDSERVER

- type: entity
  parent: BaseFlatpack
  id: MisfitsResearchServerFlatpack
  name: field R&D server flatpack
  description: Unpacks into a field R&D server where its placed. Needs a multitool to unpack.
  components:
  - type: Flatpack
    entity: MisfitsResearchServerField
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#D381C9"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: StaticPrice
    price: 1500

