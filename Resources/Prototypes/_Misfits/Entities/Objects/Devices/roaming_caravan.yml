# The travelling caravan's wagon: the town machine's shell with its own stock list.
# Prices are deliberately above town rates; edit freely.

- type: entity
  parent: TrademachineWaster
  id: MisfitsTrademachineCaravan
  name: wandering caravan wagon
  description: A wagon that has been out in the wastes too long, carrying things the town does not stock.
  suffix: vendor, caravan
  categories: [ HideSpawnMenu ]
  components:
  - type: NcStore
    buyPresets:
    - MisfitsCaravan_Buy
    sellPresets:
    - MisfitsCaravan_Sell
  # Shopkeeper access only, same as the town caravan.
  - type: AccessReader
    access:
    - [ "WasterTrader" ]
  # #Misfits Add - nailed to the spot until the trader's key is in this slot, then free to be hauled.
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          tags:
          - CaravanWagonKey
  - type: Pullable
  - type: CaravanWagonKey

# #Misfits Add - the caravan's key: the trader's kit carries it, and the wagon rolls once it is in the slot.
- type: entity
  parent: BaseKey
  id: MisfitsCaravanKey
  name: caravan key
  description: A heavy brass key on a leather loop. Turned in the wagon's lock, it frees the wagon to be hauled.
  components:
  - type: Sprite
    sprite: Objects/Vehicles/motorbike.rsi
    state: keys
  - type: Tag
    tags:
    - CaravanWagonKey

