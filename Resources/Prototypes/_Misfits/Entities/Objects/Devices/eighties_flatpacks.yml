- type: entity
  parent: BaseFlatpack
  id: MisfitsEightiesGreenMotorbikeFlatpack
  name: harley motorbike flatpack
  description: This flatpack has a Harley Motorbike inside, ready to be unpacked.
  components:
  - type: Flatpack
    entity: N14VehicleBikeGreen
    extraEntities:
    - TrainingManualEightiesRider
    - VehicleKeyMotorbike
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#8a5a2b"
      map: ["enum.FlatpackVisualLayers.Overlay"]
    - state: icon-default
  - type: StaticPrice
    price: 1500

