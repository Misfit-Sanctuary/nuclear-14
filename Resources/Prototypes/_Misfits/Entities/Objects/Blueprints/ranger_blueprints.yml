# #Misfits Add - Ranger field kit blueprint collection. Three items covering the
# arms, ammunition and armor a Ranger needs to kit out. Placed in a workbench the
# recipes become available there; remove the blueprint and they hide again.
# Recipes live in Recipes/Lathes/blueprint_recipes_ranger.yml.

- type: entity
  parent: N14BlueprintBase
  id: N14BlueprintRangerWeapons
  name: Ranger Field Kit - Arms Plans
  description: Hand-annotated Ranger armory schematics covering a selection of weapons.
  components:
  - type: Blueprint
    recipes:
    - N14BPRangerWeaponM7Spear
    - N14BPRangerWeaponRifle762Marksman
    - N14BPRangerWeaponMarksmanChinese
    - N14BPRangerWeaponRifle556Scout
    - N14BPRangerWeaponBrushGun
    - N14BPRangerWeaponSequoia
    - N14BPRangerWeapon308Sniper
    - N14BPRangerWeaponLMG556
    - N14BPRangerWeaponCombatShotgun
    - N14BPRangerWeapon308LeverRifle
    - N14BPRangerWeaponAssaultCarbine
    - N14BPRangerWeapon44LeverRifle
    - N14BPRangerWeaponSMG9mm
    - N14BPRangerWeaponSMG10mm
    - N14BPRangerWeaponSMG12mm
    - N14BPRangerWeaponSMG12mmAdvanced
    - N14BPRangerWeaponPPSh41

