    sprite: Corvax/Objects/Misc/kits.rsi
    state: base
  - type: Item
    size: Huge
  - type: SpawnItemsOnUse
    items:
      - id: N14ripper
      - id: N14TribalBigClubDecorated
      - id: N14WeaponSMG12mm
      - id: N14MagazineSMG12mm
