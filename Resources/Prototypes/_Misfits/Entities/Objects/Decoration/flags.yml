- type: entity
  parent: N14DecorationFlagFlammable
  id: MisfitsDecorationFlagTribe
  name: Banner of the Willowers Tribe
  description: The banner of the Willowers Tribe, a local settlement who worship the 'tree of life' illustrated on this flag. When the bombs first dropped, Wendover split into three survivor communities, the Locusts, Vultures and Willowers. The Willowers harvests and hunts were responsible for keeping all three fed in the first few years.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/tribal_banner.rsi
    state: banner1
  - type: Construction
    graph: MisfitsFlagTribe
    node: FlagTribe

- type: entity
  parent: N14DecorationFlagFlammable
  id: MisfitsDecorationFlagTribeSkull
  name: Flag of the Willowers Tribe
  description: The banner of the Willowers Tribe, a local settlement who worship the 'tree of life' illustrated on this flag. When the bombs first dropped, Wendover split into three survivor communities, the Locusts, Vultures and Willowers. The Willowers harvests and hunts were responsible for keeping all three fed in the first few years. This one is decorated with a skull trophy.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/tribal_banner.rsi
    state: banner2
  # TODO: add construction graph when I make skulls a crafting material

- type: entity
  parent: BaseRock
  id: MisfitsDecorationStoneTribe
  name: Willowers painting
  description: A stone painted with the tree of life.
  suffix: Mapping
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/tribal_banner.rsi
    state: stone1
    drawdepth: Overdoors
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-1.1,0.4,0"
        density: 1000
        layer:
          - WallLayer

# #Misfits Add - 509th Brotherhood of Steel standing flag (sprite by enchantedcrocolisk)
- type: entity
  parent: N14DecorationFlagFlammable
  id: MisfitsDecorationFlagBoSBonneville509
  name: Flag of the 509th Brotherhood of Steel
  description: The banner of the 509th Brotherhood of Steel, an offshoot of the Mojave Chapter that survived Operation Sunburst and spent a decade as ghosts of the salt flats. Now risen as an active vanguard, they secure the region's lost technology before the Enclave or the ignorant can seize it.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/bos509thflag.rsi
    state: bos509thflag
  - type: Construction
    graph: MisfitsFlagBOS509
    node: FlagBOS509

# #Misfits Add - 509th Brotherhood of Steel flagpole item (sprite by enchantedcrocolisk)
- type: entity
  parent: N14DecorationFlagpoleMBOS
  id: MisfitsDecorationFlagpoleBoSBonneville509
  name: 509th Brotherhood of Steel Flagpole
  description: The banner of the 509th Brotherhood of Steel, descendants of the United States military who now attempt to confiscate and safeguard dangerous technology to prevent another apocalypse. The flag stands proud and tall, a challenge to those around it.
  components:
  - type: Sprite
    sprite: _Misfits/Objects/Decoration/Flags/bos509th_flagpole.rsi
    state: icon
    noRot: true

