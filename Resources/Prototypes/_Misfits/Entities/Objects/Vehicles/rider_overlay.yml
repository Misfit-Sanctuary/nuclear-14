- type: entity
  id: MisfitsMountRiderOverlay
  name: rider overlay
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    drawdepth: OverMobs
  - type: MountRiderOverlay
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  id: BaseSaddleOverlay
  abstract: true
#  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OverlayMaps.Equippable:
        enum.OverlayLayer.Primary:
          True: { visible: true }
          False: { visible: false }
  - type: Sprite
    noRot: true
    drawdepth: OverMobs
    layers:
    - map: ["enum.OverlayLayer.Primary"]
      state: base-overlay
      sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi



- type: entity
  parent: BaseSaddleOverlay
  id: WhiteSaddleOverlay
  name: white saddle overlay
  components:
  - type: Sprite
    drawdepth: OverMobs
    sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi
    layers:
    - state: base-overlay
      sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi

- type: entity
  parent: BaseSaddleOverlay
  id: RedSaddleOverlay
  name: red saddle overlay
  components:
  - type: Sprite
    drawdepth: OverMobs
    layers:
    - state: base-overlay
      map: ["enum.OverlayLayer.Primary"]
      visible: false
      sprite: _Misfits/Clothing/Animal/Brahdo/Armor/saddle.rsi
      color: "#601014"
