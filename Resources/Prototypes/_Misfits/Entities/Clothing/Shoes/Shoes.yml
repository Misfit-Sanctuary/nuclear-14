- type: entity
  parent: ClothingShoesBase
  id: MisfitsShackledBoots
  name: Chained boots
  description: Boots with chains on them to slow down prisoners.
  components:
  - type: Sprite
    sprite: _Nuclear14/Clothing/Shoes/FalloutShoes/blackshoes.rsi
  - type: Clothing
    sprite: _Nuclear14/Clothing/Shoes/FalloutShoes/blackshoes.rsi
    unequipDelay: 60
  - type: ClothingSpeedModifier
    walkModifier: 0.4
    sprintModifier: 0.4

- type: entity
  parent: ClothingShoesMilitaryBase
  id: MisfitsMilitaryCowboyBoots
  name: military cowboy boots
  description: A pair of cowhide boots with spurs, traced over with tan paint. They have a Cuban heel, rounded to pointed toe, high shaft, and, traditionally, no lacing.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/militarycowboyboots.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/militarycowboyboots.rsi
  - type: NoSlip
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepSpurs

- type: entity
  parent: ClothingShoesMilitaryBase
  id: MisfitsMilitarySteelTippedBoots
  name: steel-tipped boots
  description: A pair of leather boots reinforced with metal toe caps.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/steeltippedboots.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/steeltippedboots.rsi
  - type: NoSlip

- type: entity
  parent: ClothingShoesMilitaryBase
  id: MisfitsMilitaryPeltBoots
  name: tall pelt boots
  description: A pair of soft pelt boots with fur lining.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/peltboots.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Shoes/FalloutBoots/peltboots.rsi
  - type: NoSlip
