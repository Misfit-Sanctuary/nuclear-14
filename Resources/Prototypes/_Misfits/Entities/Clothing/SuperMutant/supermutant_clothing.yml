# #Misfits Change - Super Mutant species-specific clothing items.
# Tagged with SuperMutantWearable to match supermutant inventory template whitelist.
# Only Super Mutants can equip these items in body-worn slots.

# --- Jumpsuit ---
- type: entity
  parent: UnsensoredClothingUniformBase
  id: ClothingSuperMutantJumpsuit
  name: Oversized Rags
  description: They fear what they don't understand, they'll hurt you to keep you from hurting them. Hit them first, don't let them get back up.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/jumpsuit.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/jumpsuit.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Outer Clothing ---
- type: entity
  parent: ClothingOuterBase
  id: ClothingSuperMutantOuterClothing
  name: Large Makeshift Armored Coat
  description: A leather coat that has been reinforced by an old fridge door as a breastplate. A crude solution to the problem of life as a mutant, but better than being refined and dead.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/outerclothing.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/outerclothing.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Gloves ---
- type: entity
  parent: ClothingHandsBase
  id: ClothingSuperMutantGloves
  name: Large Leather Wraps
  description: Meant to keep you safe, so you can keep others safe. Wrap your hands tight, and wrap your hands around the throats of those who threaten your family even tighter yet.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/gloves.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/gloves.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Shoes ---
- type: entity
  parent: ClothingShoesBase
  id: ClothingSuperMutantShoes
  name: Large Rawhide Boots
  description: Made from thick hide long ago, these are hand-me-downs from a mutant who likely met an unfortunate end. Will they outlive you as well?
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/shoes.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/shoes.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Head ---
- type: entity
  parent: ClothingHeadBase
  id: ClothingSuperMutantHead
  name: Large Makeshift Sandogasa
  description: Woven from bamboo, layed in animal hide, and reinforced with scrap metal, it is a tribute to a land far away. Looking at it stirs up memories, of a time that was less cruel.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/head.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/head.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Mask ---
- type: entity
  parent: ClothingMaskBase
  id: ClothingSuperMutantMask
  name: Large Leather Mask
  description: Meant to hide your identity and intimidate non-mutants, it sadly doesn't help keep you very anonymous when there are so few super mutants around.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/mask.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/mask.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Neck ---
- type: entity
  parent: ClothingNeckBase
  id: ClothingSuperMutantNeck
  name: Large Makeshift Gorget
  description: Not the most elegant of solutions, but it will keep you alive a few seconds more when you're on the ground, perhaps long enough to get dragged to safety rather than beheaded mid-fight.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/neck.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/neck.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# #Misfits Add - Gladiator set for the playable Supermutant Gladiator variant.
# Uses dedicated supermutant-fitted directional sheets so the outfit renders cleanly on species layers.

# --- Gladiator Loincloth ---
- type: entity
  parent: UnsensoredClothingUniformBase
  id: ClothingSuperMutantGladiatorLoincloth
  name: Samnis Loincloth
  description: They fear you, they hate you, they will never see you as an equal. Shed the blood of their enemies and keep your right to live another day.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/gladiator_loincloth.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/gladiator_loincloth.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Gladiator Armor ---
- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothing] # #Misfits Add - AllowSuitStorageClothing enables the back holster (suitstorage) slot
  id: ClothingSuperMutantGladiatorArmor
  name: Samnis Arm Guard
  description: You are valuable to your master and the arena crowd, and so you have been gifted properly forged armor instead of rusted metal scraps. It protects your sword-arm, but leaves enough exposed to keep the gamblers interested.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/gladiator_armor.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/gladiator_armor.rsi
  - type: Tag
    tags:
    - SuperMutantWearable
  - type: Armor # #Misfits Add - 15% physical damage resistance baseline
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70

# --- Gladiator Boots ---
- type: entity
  parent: ClothingShoesBase
  id: ClothingSuperMutantGladiatorBoots
  name: Samnis Boots
  description: Arena boots made to outlast you, make them outlast your opponent first.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/gladiator_boots.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/gladiator_boots.rsi
  - type: Tag
    tags:
    - SuperMutantWearable

# --- Gladiator Helmet ---
- type: entity
  parent: ClothingHeadBase
  id: ClothingSuperMutantGladiatorHelmet
  name: Samnis Helmet
  description: A brutal steel helm forged for the star of the arena, meant to take direct hits to the head and keep the fight from ending too fast. Give the people a good show, in both the fight pit and the battlefield.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/SuperMutant/gladiator_helmet.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/SuperMutant/gladiator_helmet.rsi
  - type: Tag
    tags:
    - SuperMutantWearable
  - type: Armor # #Misfits Add Glads are better at melee
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80

