# #Misfits Add - Tribal APA helmet: APA MK I helmet reskin with Ug-Qualtoth art.
# Inherits all APA MK I helmet behaviours: HUD, EyeProtection, Armor, ToggleableLight, equip sounds.
# Only the Sprite path is overridden; the RSI provides all required state names.

- type: entity
  parent: ClothingHeadHardsuitWithLightBase
  id: N14ClothingHeadHelmetPowerArmorTribalAPA
  name: Tribal Salvaged APA Helmet
  description: A salvaged suit of APA mk1 Fit for a Tribal Chief, Removed plating makes it more maneuverable as a result it's advanced systems where removed.
  components:
  - type: Sprite
    netsync: false
    sprite: _Misfits/Clothing/Head/PowerArmorHelmets/tribal_apa_helmet.rsi
    layers:
    - state: icon
    - state: icon-unshaded
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableLightVisuals
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
      right:
      - state: on-inhand-right
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    enabled: false
    radius: 6
    energy: 1
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    netsync: false
  - type: Clothing
    equipSound: # Corvax-Change
      path: /Audio/_Nuclear14/Effects/PowerArmor/PowerArmor_Equip_Helmet_01.ogg
      params:
        volume: -12
    unequipSound: # Corvax-Change
      path: /Audio/_Nuclear14/Effects/PowerArmor/PowerArmor_Equip_Helmet_01.ogg
      params:
        volume: -12
    quickEquip: true
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
      - state: equipped-HELMET-unshaded
  - type: EyeProtection
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.8
        Radiation: 0.70
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: BreathMask # Misfits Change
  - type: GasFilterMask # Misfits Change
  - type: IngestionBlocker # Misfits Change
  - type: Tag
    tags:
    - HidesHair
    - HidesBeard
- type: entity
  parent: N14ClothingHeadHatBaseHelmetMetal
  id: N14ClothingHeadHelmetPowerArmorTribalAPA
  name: Tribal Salvaged APA Helmet
  description: A salvaged suit of APA mk1 Fit for a Tribal Chief, Removed plating makes it more maneuverable as a result it's advanced systems where removed.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Head/PowerArmorHelmets/tribal_apa_helmet.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Head/PowerArmorHelmets/tribal_apa_helmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.75
        Heat: 0.8
    priceMultiplier: 0.5  

