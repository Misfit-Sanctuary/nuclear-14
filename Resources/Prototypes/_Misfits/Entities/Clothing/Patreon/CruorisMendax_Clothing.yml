# PR'd on 11/7/2026


# Hood

- type: entity
  parent: ClothingHeadBase
  id: MisfitsCruorisMandexHood
  name: Cruor Crown & Comedy Mask
  description: A mask featuring a smile akin to a comedy mask, theres bloodstains that drip from the top from a spiked crown which digs into the wearers skin.
  components:
  - type: Sprite
    scale: .25,.25
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorishood.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorishood.rsi
    slots: [HEAD]

# Jumpsuit

- type: entity
  parent: ClothingUniformBase
  id: MisfitsCruorisMandexCloth
  name: Cruor Robes
  description: A bright red set of torn clothes, they look like theyve been repurposed from a robe.
  components:
  - type: Sprite
    scale: .35,.35
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisinner.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisinner.rsi
    slots: [innerclothing]

# Braces

- type: entity
  parent: ClothingHandsBase
  id: MisfitsCruorisMandexGloves
  name: Cruor Braces
  description: Tight iron bloodstained and rusted spiked braces which constantly cut into the wearers wrists.
  components:
  - type: Sprite
    scale: .5,.5
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisbraces.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisbraces.rsi
    slots: [gloves]
  - type: PuddleSpawner
    reagentToSpawn: BaruBlood
    amount: 5
    seconds: .5
    maxAmount: 30

# Outerwear

- type: entity
  parent: N14ClothingLegionReconArmor
  id: MisfitsCruorisMandexOuter
  name: Cruor Armor
  description: Similar to a legionaries armor, just rusted with blood and bearing two pauldrons ripped off a power armor set and stained with blood.
  components:
  - type: Sprite
    scale: .4,.4
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisouter.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisouter.rsi
    slots: [outerClothing]

# Mask

- type: entity
  parent: ClothingMaskBase
  id: MisfitsCruorisMandexMask
  name: Cruor Crown & Tragedy Mask
  description: A mask featuring a frown akin to a tragedy mask, theres bloodstains that drip from the top from a spiked crown that digs into the wearers skin.
  components:
  - type: Sprite
    scale: .25,.25
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorismask.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorismask.rsi
    slots: [mask]

# boots

- type: entity
  parent: ClothingShoesBase
  id: MisfitsCruorisMandexBoots
  name: Cruor Boots
  description: A set of rusted and bloodstained power armor legs, non functional, but adorned as a trophy.
  components:
  - type: Sprite
    scale: .35,.35
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisboots.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/CaesarLegion/CruorisMandex/cruorisboots.rsi
    slots: [FEET]
    renderLayer: innerShoes
  - type: FootstepModifier
    footstepSoundCollection:
      collection: N14FootstepPowerArmor
