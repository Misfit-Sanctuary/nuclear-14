# #Misfits Add - Tribal APA: APA MK I power armor reskin for the Ug-Qualtoth tribal faction.
# Inherits ALL APA MK I mechanics: Armor, ExplosionResistance, Reflect, PowerArmorIntegrity, ToggleableClothing.
# Only Sprite/Clothing paths and the toggled head prototype are overridden.

# --- Tribal APA Suit ---
- type: entity
  parent: N14ClothingOuterPowerArmorAdvanced1
  id: N14ClothingOuterPowerArmorTribalAPA
  name: Tribal Salvaged APA
  description: A salvaged suit of APA mk1 Fit for a Tribal Chief, Removed plating makes it more maneuverable as a result it's advanced systems where removed.
  components:
  - type: N14PowerArmor
    requiresProficiency: false 
  - type: Damageable
  - type: PowerArmorIntegrity
    maxIntegrity: 300        
    brokenBleedthroughRatio: 1.0  
    disableServosLock: true       
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 10 
    qualityNeeded: Welding
  
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/tribal_apa.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/tribal_apa.rsi 
    equipDelay: 3 
    unequipDelay: 6
  - type: ClothingSpeedModifier
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: UserInterface
    interfaces:
      enum.ToggleClothingUiKey.Key:
        type: ToggleableClothingBoundUserInterface
  - type: ToggleableClothing
    requiredSlot: outerClothing
    blockUnequipWhenAttached: true
    replaceCurrentClothing: false
    clothingPrototypes:
      head: N14ClothingHeadHelmetPowerArmorTribalAPA
      gloves: N14ClothingPAGauntletsDark
      shoes: N14ClothingPABootsDark
  - type: Armor 
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70
        Heat: 0.75
        Radiation: 0.60
  - type: TemperatureProtection
    coefficient: 0.25
  - type: FireProtection
    reduction: 0.9
  - type: HeldSpeedModifier
    mirrorClothingModifier: false
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: MultiHandedItem
  - type: Reflect 
    reflects:
      - SmallCaliber
      - MediumCaliber
    reflectProb: 0.35
    reflectProbByType:
      MediumCaliber: 0.10 
    innate: true
    spread: 90
  - type: EmitsSoundOnMove 
    soundCollection:
      collection: N14FootstepPowerArmor
      params:
        volume: -6
    requiresWorn: true
    distanceWalking: 3
    distanceSprinting: 4     
  - type: PowerArmorBrace
    requiredSlot: BELT
