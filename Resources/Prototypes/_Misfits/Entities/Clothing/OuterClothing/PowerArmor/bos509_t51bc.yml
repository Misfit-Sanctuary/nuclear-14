# #Misfits Add - 509th Bonneville BoS T-51bc power armor variants (sprites by enchantedcrocolisk).
# Reskins of the T-51bc Paladin Commander suit; inherit ALL T-51bc mechanics
# (Armor, ExplosionResistance, Reflect, PowerArmorIntegrity, WastelandMap HUD,
# ToggleableClothing with the T-51bc helmet/gauntlets/boots). Only Sprite/Clothing
# paths are overridden. These are NOT round-start spawn gear — delivered via
# role-gated loadout picks (see loadouts_bos.yml).

# --- 509th BoS Elder T-51bc ---
- type: entity
  parent: N14ClothingOuterPowerArmorT51BC
  id: MisfitsClothingOuterPowerArmorBoS509Elder
  name: 509th BoS Elder T-51bc Power Armor
  description: The personal T-51bc of the 509th Brotherhood of Steel Elder. Painted in the chapter's Bonneville colors, its servos hum with the authority of a decade of salt-flat command.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/bos509_elder_t51bc.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/PowerArmor/bos509_elder_t51bc.rsi

