  id: MisfitsClothingOuterBrotherhoodMagnifier
  name: Brotherhood magnifier chestplate # Goofy magnifying glass armor for science scribes.
  description: A somewhat clunky magnifying harness worn by more science-minded scribes of the 509th Chapter. Thankfully, it's bulky enough to catch some incoming fire... But it won't protect you from being called a dork.
