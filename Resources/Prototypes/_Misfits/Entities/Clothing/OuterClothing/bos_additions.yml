# Additional BoS outerclothing/armor that's not stored in the standard rank_armor.yml

# Coats & Jackets

- type: entity
  parent: N14FalloutArmorBase
  id: MisfitsClothingOuterBrotherhoodLancer
  name: Brotherhood lancer harness # Starting armor for Lancers. Nothing special, just a coat with middling defensive values
  description: A sturdy pilot's harness issued to Lancers in service with the 509th Chapter of the Brotherhood of Steel. Offers moderate protection, with plenty of spare pouches for bits of gear.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_coat_lancer.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_coat_lancer.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
    priceMultiplier: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.85
  - type: Storage
    grid:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: MisfitsClothingOuterBrotherhoodLancer
  id: MisfitsClothingOuterBrotherhoodBomberJacket
  name: Brotherhood bomber jacket # Largely a drip item; minimal defensive stats.
  description: A thick bomber jacket produced by the Brotherhood to keep it's members warm on cold nights.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_coat_bomber.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_coat_bomber.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
    priceMultiplier: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.85

- type: entity
  parent: MisfitsClothingOuterBrotherhoodLancer
  id: MisfitsClothingOuterBrotherhoodFieldCoat
  name: Brotherhood field coat # Field coat is armor for the field scribe kit; decent defensive stats, sub-combat armor.
  description: A kevlar-lined coat favored by field scribes with the 509th. Keeps all your vital organs safe, and makes you look cool while doing it.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_field_coat.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/Armor/bos_field_coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.75
        Heat: 0.75
    priceMultiplier: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.85

