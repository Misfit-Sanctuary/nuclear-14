### Cloth Armor

## Types
# Riot +5% Melee -5% Range
# Combat -5% Melee +5% Range
# Ballistic +10% Pierce -10% Everything
# Energy +10% Heat -10% Everything
## Modifier
# Advance +5% Everything, Mk2s
# Elite +10% Everything, Cent Armor and Vet Armors
# Fast +5% Speed Probably wont be used

- type: entity
  parent: N14FalloutArmorBase
  id: MisfitClothArmor
  components:
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.85
