# #Misfits Add - Hospitaller Order gear set: habit, heavy armor, great helm and shemagh.
# Sprites live under _Misfits/Clothing/{Uniforms,OuterClothing,Head,Neck}/Hospitaller.

# Uniform
- type: entity
  parent: N14ClothingUniformBase
  id: MisfitsClothingUniformHospitaller
  name: Hospitaller habit
  description: A simple set of red slacks and a cotton button up shirt with the red cross of the church of Saint John stitched to the sleeves. Favored by church volunteers and some Hospitaller knights.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Uniforms/Hospitaller/hospitaller_uniform.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Uniforms/Hospitaller/hospitaller_uniform.rsi

# Heavy armor
- type: entity
  parent: N14ClothingOuterCombatArmorMK2
  id: MisfitsClothingOuterArmorHospitallerHeavy
  name: Hospitaller heavy armor
  description: A suit of scavenged national guard kevlar and body armor repurposed by the knights of Saint John, urban grey with a scarlet cross upon the back and features various storage pouches for supplies. Heavy, but durable.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/Hospitaller/hospitaller_heavy.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/Hospitaller/hospitaller_heavy.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.70
        Slash: 0.70
        Piercing: 0.70
        Heat: 0.70
    priceMultiplier: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.70

# Great helm
- type: entity
  parent: N14ClothingHeadHatCombatHelmet
  id: MisfitsClothingHeadHelmetHospitaller
  name: Hospitaller great helm
  description: A pre-war combat helmet painted in the urban grey and scarlet favored by the knights of Saint John, this one has seen some reinforcement and the attachment of a riot visor for additional protection.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Head/Hospitaller/hospitaller_helmet.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Head/Hospitaller/hospitaller_helmet.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.90
        Slash: 0.90
        Piercing: 0.90
        Heat: 0.90
    priceMultiplier: 0.6
  - type: ExplosionResistance
    damageCoefficient: 0.90

# Shemagh
- type: entity
  parent: ClothingNeckBase
  id: MisfitsClothingNeckHospitallerShemagh
  name: Hospitaller shemagh
  description: A simple neck scarf like covering that protects the mouth, neck, and nose from both the sun and sand. This one seem's to be dyed a deep scarlet.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/Neck/hospitaller_shemagh.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/Neck/hospitaller_shemagh.rsi
