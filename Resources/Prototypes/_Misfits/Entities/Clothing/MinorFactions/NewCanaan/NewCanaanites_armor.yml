# alter
- type: entity
  parent: AltarBase
  id: MisfitsAltarNewCanaan
  name: New Canaanite altar
  description: An altar of New Canaan. Its candles kept burning by the faithful.
  components:
  - type: Icon
    sprite: _Misfits/Structures/Decoration/Furniture/newcanaanaltar.rsi
    state: newcanaanaltar
  - type: Sprite
    sprite: _Misfits/Structures/Decoration/Furniture/newcanaanaltar.rsi
    layers:
    - state: newcanaanaltar
    - state: lightning
      shader: unshaded

- type: construction
  name: New Canaanite altar
  id: MisfitsConstructAltar
  graph: MisfitsGraphAltar
  startNode: start
  targetNode: newcanaan
  category: construction-category-furniture
  description: An altar of New Canaan. Its candles kept burning by the faithful.
  icon:
    sprite: _Misfits/Structures/Decoration/Furniture/newcanaanaltar.rsi
    state: newcanaanaltar
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: MisfitsGraphAltar
  start: start
  graph:
  - node: start
    edges:
    - to: newcanaan
      completed:
      - !type:SnapToGrid
      steps:
      - material: Plasteel
        amount: 10
      - material: Bluespace
        amount: 3
      - material: Gold
        amount: 4
        doAfter: 5
  - node: newcanaan
    entity: MisfitsAltarNewCanaan
