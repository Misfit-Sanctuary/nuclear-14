# leather vest | outer
- type: entity
  parent: N14ClothingOuterBosScribe
  id: MisfitsClothingOuterNewCanaanLeatherVest
  name: New Canaanite leather vest
  description: A light leather vest with thin metal plates strapped over the chest, favoured by New Canaanite scouts who need to move quickly.
  components:
  - type: Sprite
    sprite: _Misfits/Clothing/OuterClothing/Armor/newcanaanleathervest.rsi
  - type: Clothing
    sprite: _Misfits/Clothing/OuterClothing/Armor/newcanaanleathervest.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.8
  - type: ClothingSpeedModifier
    walkModifier: 1.05
    sprintModifier: 1.05

# police vest | outer
