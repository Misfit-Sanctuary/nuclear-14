# NCR weapon catalog. Weapon ammunition is deliberately absent: it remains blueprint-crafted.
# Example per-item balance override:
# blueprintEntryOverrides:
#   N14ExampleWeapon:
#     tier: 2
#     amount: 4
#     maxAmount: 4
#     replenishmentCost: 3

- type: entity
  parent: N14BaseRmcWeaponVendor
  id: N14NCRWeaponVendor
  name: NCR weapon requisitions vendor
  suffix: NCR
  components:
  - type: CMAutomatedVendor
    departmentName: NCR
    # Authorization is job-based below. Do not require a physical card tag as well:
    # Heavy Trooper and Heavy Trooper Lead are authorized vendor roles even when their
    # rank dogtag does not expose the generic NCR access tag.
    # NCR Army baseline. Rangers and NCR civilian roles use separate provisioning paths.
    jobs:
    - NCRCadet
    - NCRSoldier
    - NCRPrivateFirstClass
    - NCRMedic
    - NCREngineer
    - NCRWS
    - NCRHeavyTrooper
    - NCRHeavyTrooperLead
    - NCRNCO
    - NCRStaffSergeant
    - NCRFirstSergeant
    - NCRVertibirdPilot
    - NCRMPinvestigator
    - NCRProvost
    - NCRMilitaryPoliceRecruit
    - NCRMilitaryPoliceSergeant
    - NCRMilitaryPoliceCaptain
    - NCRExecutiveOfficer
    - NCRPlatoonLeader
    - NCRRO
    - NCRCommander
    - NCRMajor
    - NCRLTCol
    # Role authority is vendor-local: it does not grant corresponding physical door access.
    fullAllocationJobs: [ NCRRO, NCRCommander ]
    replenishmentJobs: [ NCRRO ]
    authorityJobTiers:
      NCRCadet: 1
      NCRSoldier: 1
      NCRPrivateFirstClass: 1
      NCRMedic: 1
      NCREngineer: 1
      NCRWS: 1
      NCRHeavyTrooper: 2
      NCRNCO: 3
      NCRVertibirdPilot: 3
      NCRHeavyTrooperLead: 3
      NCRStaffSergeant: 3
      NCRFirstSergeant: 3
      NCRMPinvestigator: 3
      NCRProvost: 3
      NCRMilitaryPoliceRecruit: 1
      NCRMilitaryPoliceSergeant: 3
      NCRMilitaryPoliceCaptain: 4
      NCRExecutiveOfficer: 4
      NCRPlatoonLeader: 4
      NCRRO: 5
      NCRCommander: 5
      NCRMajor: 5
      NCRLTCol: 5
    allocationCategories: [ Ballistic, Laser, Plasma, Energy, Melee, Explosives, Ammo, Magazines, Other weapons ]
    sharedEquipmentCategories: [ Ballistic, Laser, Plasma, Energy, Melee, Explosives, Other weapons ]
    defaultAllocationCategory: Other weapons
    defaultSharedEquipmentCategory: Other weapons
    # Direct, mix-and-match replacements for the old NCR undecided loadout kits.
    # Basic ballistic ammunition and weapon magazines are open stock for every
    # NCR role authorized to use this vendor; they are not rank allocations.
    sections:
    - name: Ammunition
      entries:
      - { id: N14AmmoBox22lr, category: Ammo, tier: 1 }
      - { id: N14AmmoBox9mm, category: Ammo, tier: 1 }
      - { id: N14AmmoBox10mm, category: Ammo, tier: 1 }
      - { id: N14AmmoBox45, category: Ammo, tier: 1 }
      - { id: N14AmmoBox44Magnum, category: Ammo, tier: 1 }
      - { id: N14AmmoBox12gauge, category: Ammo, tier: 1 }
      - { id: MagazineBox20gauge, category: Ammo, tier: 1 }
      - { id: N14AmmoBox556, category: Ammo, tier: 1 }
      - { id: N14AmmoBox762, category: Ammo, tier: 1 }
      - { id: N14AmmoBox308, category: Ammo, tier: 1 }
    - name: Magazines
      entries:
      - { id: N14MagazinePistol44, category: Magazines, tier: 1 }
      - { id: N14MagazineSMG9mm, category: Magazines, tier: 1 }
      - { id: Magazine45SubMachineGun, category: Magazines, tier: 1 }
      - { id: Magazine556Rifle, category: Magazines, tier: 1 }
      - { id: LongMagazine556Rifle, category: Magazines, tier: 1 }
      - { id: Magazine762Rifle, category: Magazines, tier: 1 }
      - { id: Magazine762AmmoShort, category: Magazines, tier: 1 }
      - { id: Magazine762AmmoBelt, category: Magazines, tier: 1 }
      - { id: Magazine308Rifle, category: Magazines, tier: 1 }
      - { id: Magazine308RifleLong, category: Magazines, tier: 1 }
      - { id: ClipMagazine308Rifle, category: Magazines, tier: 1 }
      - { id: Magazine308RifleSniper, category: Magazines, tier: 1 }
      - { id: MagazineOver308RifleSniper, category: Magazines, tier: 1 }
      - { id: Magazine308M60Box, category: Magazines, tier: 1 }
      - { id: SpeedLoader9, category: Magazines, tier: 1 }
      - { id: SpeedLoader10, category: Magazines, tier: 1 }
      - { id: SpeedLoader44, category: Magazines, tier: 1 }
      - { id: SpeedLoader308Tube, category: Magazines, tier: 1 }
      - { id: SpeedLoader45-70, category: Magazines, tier: 1 }
      - { id: SpeedLoader45-70Tube, category: Magazines, tier: 1 }
    - name: Tier 1 - Trooper / Specialist allocation
      entries:
      - { id: N14WeaponSniper44LeverCarbine, category: Ballistic, tier: 1 }
      - { id: N14WeaponRifle556Butchered, category: Ballistic, tier: 1 }
      - { id: N14WeaponShotgunShort, category: Ballistic, tier: 1 }
      - { id: N14TrenchClub, category: Melee, tier: 1 }
      - { id: N14WastelandFlagSpear, category: Melee, tier: 1 }
      - { id: N14Hatchet, category: Melee, tier: 1 }
      - { id: SmokeGrenade, category: Explosives, tier: 1 }
      - { id: N14ripper, category: Melee, tier: 1 }
      - { id: C4, category: Explosives, tier: 1 }
      - { id: N14Dynamite, category: Explosives, tier: 1 }
      - { id: N14WeaponRifleGrenade, category: Explosives, tier: 1 }
      - { id: N14WeaponRifle308SniperRifle, category: Ballistic, tier: 1 }
      - { id: N14WeaponRifleM7SpearScope, category: Ballistic, tier: 1 }
      - { id: N14WeaponSMG9mminfiltrator, category: Ballistic, tier: 1 }
      - { id: N14WeaponShotgunBlowback, category: Ballistic, tier: 1 }
      - { id: N14WeaponRevolverWebley, category: Ballistic, tier: 1 }
      - { id: N14WeaponRifleOperative, category: Ballistic, tier: 1 }
      - { id: N14PoliceBaton, category: Melee, tier: 1 }
      - { id: N14TinNade, category: Explosives, tier: 1 }
    - name: Tier 2 - Heavy Trooper allocation
      entries:
      - { id: SmokeGrenade, category: Explosives, tier: 2 }
      - { id: N14Dynamite, category: Explosives, tier: 2 }
      - { id: MisfitsGrenadeImpact, category: Explosives, tier: 2 }
      - { id: MisfitsHawkinsDevice, category: Explosives, tier: 2 }
    # #Misfits Add - faction council grenade allowances. Choices are tracked per
    # character, while the individual entries continue to use shared armory stock.
    - name: Tier 1 - Utility grenade allocation
      choices: { MisfitsNCRGrenadeTier1: 7 }
      entries:
      - { id: GrenadeFlashBang, category: Explosives, tier: 1 }
      - { id: MisfitsGrenadeWhitePhosphorus, category: Explosives, tier: 1 }
      - { id: SmokeGrenade, category: Explosives, tier: 1 }
    - name: Tier 2 - Conventional grenade allocation
      choices: { MisfitsNCRGrenadeTier2: 5 }
      entries:
      - { id: GrenadeIncendiary, category: Explosives, tier: 2 }
      - { id: GrenadeShrapnel, category: Explosives, tier: 2 }
      - { id: MisfitsGrenadeFragDefensive, category: Explosives, tier: 2 }
    - name: Tier 3 - Military Police allocation
      entries:
      - { id: MisfitsNCRMPShockBaton, category: Melee, tier: 3 }
    - name: Tier 4 - Executive Officer / Platoon Leader allocation
      entries:
      # A laser sight does not make this .44 Magnum pistol an energy weapon.
      - { id: N14WeaponLaserdotDesertEagle44, category: Ballistic, tier: 4 }
      - { id: NCRCommissarSabre, category: Melee, tier: 4 }
    - name: Tier 5 - Commander / Requisition Officer allocation
      entries:
      - { id: N14WeaponRifleM1GarandRepublicsPride, category: Ballistic, tier: 5 }

    replenishment:
    - currency: Bottlecaps
    - currency: NCRDollars
    replenishmentPrompt: caps or NCR dollars
    replenishmentInterval: 30m
    replenishmentCosts:
      1: 1
      2: 2
      3: 5
      4: 10
      5: 20
    blueprintCategories: [ N14BlueprintNCRWeaponsT1, N14BlueprintNCRWeaponsT2, N14BlueprintNCRWeaponsT3, N14BlueprintNCRWeaponsT4 ]
    # Keep every blueprint result in a player-facing weapon family; balance fields can be added per entry here.
    blueprintEntryOverrides:
      N14WeaponPistol10mm: { category: Ballistic }
      N14WeaponPistol22lr: { category: Ballistic }
      N14WeaponPistol9mm: { category: Ballistic }
