- type: entity
  parent: N14BrotherhoodTacticalmap
  id: MisfitsEnclaveTacticalMap
  name: Enclave TacMap
  description: A secured Enclave tactical map used to coordinate base operations.
  suffix: Enclave, Mapping
  components:
  - type: WastelandMap
    mapConfigId: Wendover
    mapTitle: Enclave TacMap
    tacticalFeed: Enclave
    # #Misfits Add - show the surface bunker hatches; click one for a camera view and lock toggle.
    showBunkerHatches: true
    communicationsJobs:
    - EnclaveCommander
    - EnclaveSeniorOfficer
    - EnclaveJuniorOfficer
    - EnclaveHeadScientist
  # #Misfits Fix - Override the BOS OverwatchConsole inherited from N14BrotherhoodTacticalmap
  # so this map's Overwatch tab only tracks Enclave members (IdCardEnclave), not Brotherhood.
  # The child component replaces the parent's trackedTags.
  - type: OverwatchConsole
    monitorTitle: overwatch-monitor-title-enclave
    trackedTags:
    - IdCardEnclave
  - type: AccessReader
    access: [["Enclave"]]
  - type: ActivatableUIRequiresAccess
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          MisfitsEnclaveTacticalMapBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: N14BrotherhoodTacticalmapBroken
  id: MisfitsEnclaveTacticalMapBroken
  name: Enclave TacMap
  description: A broken Enclave tactical map.
  suffix: Enclave, Broken
  components:
  - type: WastelandMap
    mapConfigId: Wendover
    mapTitle: Enclave TacMap
    tacticalFeed: Enclave
    communicationsJobs:
    - EnclaveCommander
    - EnclaveSeniorOfficer
    - EnclaveJuniorOfficer
    - EnclaveHeadScientist
  # #Misfits Fix - Override the BOS OverwatchConsole inherited from N14BrotherhoodTacticalmap
  # so this map's Overwatch tab only tracks Enclave members (IdCardEnclave), not Brotherhood.
  # The child component replaces the parent's trackedTags.
  - type: OverwatchConsole
    monitorTitle: overwatch-monitor-title-enclave
    trackedTags:
    - IdCardEnclave
  - type: AccessReader
    access: [["Enclave"]]
  - type: ActivatableUIRequiresAccess
