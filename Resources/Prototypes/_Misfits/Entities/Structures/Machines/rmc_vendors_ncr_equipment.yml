      - { id: ClothingBeltNCRShotgunner, category: Belt, tier: 1 }
      - { id: ClothingBeltNCRHarness, category: Belt, tier: 1 }
      - { id: N14ClothingUniformNCRRecon, category: Uniform, tier: 1 }
