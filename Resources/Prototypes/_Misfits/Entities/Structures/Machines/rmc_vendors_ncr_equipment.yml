    - currency: NCRDollars
    replenishmentPrompt: caps or NCR dollars
    replenishmentInterval: 30m
    replenishmentCosts:
      1: 1
      2: 2
      3: 5
      4: 10
      5: 20
    # Curated from NCR role kits; crafting blueprint tiers are not job authority tiers.
    populateFromBlueprints: false
    authorityTierNames:
      1: Tier 1 - Trooper / Specialist allocation
      2: Tier 2 - Heavy Trooper allocation
      3: Tier 3 - Squad Leader / Medical Officer allocation
      4: Tier 4 - Executive Officer / Platoon Leader allocation
      5: Tier 5 - Commander / Requisition Officer allocation
    authorityTierAccess:
