      choices: { NCRBeltAllocation: 1 }
      entries:
      - { id: ClothingBeltNCRBandolier, category: Belt, tier: 1 }
      - { id: ClothingBeltMilitary, category: Belt, tier: 1 }
      - { id: ClothingBeltNCRPouches, category: Belt, tier: 1 }
      - { id: ClothingBeltRevolver, category: Belt, tier: 1 }
