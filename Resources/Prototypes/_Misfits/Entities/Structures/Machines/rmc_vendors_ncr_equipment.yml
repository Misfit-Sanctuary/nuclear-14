# NCR equipment catalog. Army and Military Police equipment is rank/job gated here.

- type: entity
  parent: N14BaseRmcEquipmentVendor
  id: N14NCREquipmentVendor
  name: NCR equipment requisitions vendor
  suffix: NCR
  components:
  - type: CMAutomatedVendor
    # Every NCR equipment vendor instance draws from this shared faction armory pool.
    sharedPool: NCREquipment
    departmentName: NCR
    # Authorization is job-based below. Do not require a physical card tag as well:
    # Heavy Trooper and Heavy Trooper Lead are authorized vendor roles even when their
    # rank dogtag does not expose the generic NCR access tag.
    jobs:
    - NCRCadet
    - NCRSoldier
    - NCRPrivateFirstClass
    - NCRMedic
    - NCRDoctor
    - NCREngineer
    - NCRWS
    - NCRHeavyTrooper
    - NCRHeavyTrooperLead
    - NCRNCO
    - NCRStaffSergeant
    - NCRFirstSergeant
    - NCRVertibirdPilot
    - NCRMPinvestigator
    - NCRProvost
    - NCRMilitaryPoliceRecruit
    - NCRMilitaryPoliceSergeant
    - NCRMilitaryPoliceCaptain
    - NCRExecutiveOfficer
    - NCRPlatoonLeader
    - NCRRO
    - NCRCommander
    - NCRMajor
    - NCRLTCol
    # Role authority is vendor-local: it does not grant corresponding physical door access.
    fullAllocationJobs: [ NCRRO, NCRCommander ]
    replenishmentJobs: [ NCRRO ]
    authorityJobTiers:
      NCRCadet: 1
      NCRSoldier: 1
      NCRPrivateFirstClass: 1
      NCRMedic: 1
      NCREngineer: 1
      NCRWS: 1
      NCRHeavyTrooper: 2
      NCRNCO: 3
      NCRDoctor: 3
      NCRVertibirdPilot: 3
      NCRHeavyTrooperLead: 3
      NCRStaffSergeant: 3
      NCRFirstSergeant: 3
      NCRMPinvestigator: 3
      NCRProvost: 3
      NCRMilitaryPoliceRecruit: 1
      NCRMilitaryPoliceSergeant: 3
      NCRMilitaryPoliceCaptain: 4
      NCRExecutiveOfficer: 4
      NCRPlatoonLeader: 4
      NCRRO: 5
      NCRCommander: 5
      NCRMajor: 5
      NCRLTCol: 5
    allocationCategories: [ Helmet, Armor, Uniform, Mask, Gloves, Belt, Boots, Backpack, Neck, Eyes, Radio, Medical, Utility, Other equipment ]
    sharedEquipmentCategories: [ Helmet, Armor, Uniform, Mask, Gloves, Belt, Boots, Backpack, Neck, Eyes, Radio, Medical, Utility, Other equipment ]
    defaultAllocationCategory: Other equipment
    defaultSharedEquipmentCategory: Other equipment
    # Direct, mix-and-match replacements for the wearable/usable part of the former NCR loadout kits.
    # The old random military box is decomposed into its medical/flare contents here; its NCR-dollar roll is
    # intentionally not vendable, otherwise the vendor could create the currency used to fund its own resupply.
