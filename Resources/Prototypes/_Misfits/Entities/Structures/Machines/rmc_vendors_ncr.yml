# NCR catalog. Weapon ammunition is deliberately absent: it remains blueprint-crafted.
# Example per-item balance override:
# blueprintEntryOverrides:
#   N14ExampleWeapon:
#     tier: 2
#     amount: 4
#     maxAmount: 4
#     replenishmentCost: 3

- type: entity
  parent: N14BaseRmcWeaponVendor
  id: N14NCRWeaponVendor
  name: NCR weapon requisitions vendor
  suffix: NCR
  components:
  - type: AccessReader
    access: [[ "NCR" ]]
  - type: CMAutomatedVendor
    departmentName: NCR
    # Role authority is vendor-local: it does not grant corresponding physical door access.
    fullAllocationJobs: [ NCRRO, NCRCommander ]
    authorityJobTiers:
      NCRCadet: 1
      NCRSoldier: 1
      NCRPrivateFirstClass: 1
      NCRMedic: 1
      NCREngineer: 1
      NCRWS: 1
      NCRHeavyTrooper: 2
      NCRNCO: 3
      NCRDoctor: 3
      NCRVertibirdPilot: 3
      NCRHeavyTrooperLead: 3
      NCRStaffSergeant: 3
      NCRFirstSergeant: 3
      NCRMPinvestigator: 3
      NCRProvost: 3
      NCRExecutiveOfficer: 4
      NCRPlatoonLeader: 4
      NCRRO: 5
      NCRCommander: 5
      NCRMajor: 5
    allocationCategories: [ Ballistic, Laser, Plasma, Energy, Melee, Explosives, Other weapons ]
    sharedEquipmentCategories: [ Ballistic, Laser, Plasma, Energy, Melee, Explosives, Other weapons ]
    defaultAllocationCategory: Other weapons
    defaultSharedEquipmentCategory: Other weapons
    # Direct, mix-and-match replacements for the old NCR undecided loadout kits.
    # Magazines/ammunition are intentionally omitted; those remain crafted supplies.
    sections:
    - name: Tier 1 - Trooper / Specialist allocation
      entries:
      - { id: N14WeaponSniper44LeverCarbine, category: Ballistic, tier: 1 }
      - { id: N14WeaponRifle556Butchered, category: Ballistic, tier: 1 }
      - { id: N14WeaponShotgunShort, category: Ballistic, tier: 1 }
      - { id: N14TrenchClub, category: Melee, tier: 1 }
      - { id: N14WastelandFlagSpear, category: Melee, tier: 1 }
      - { id: N14Hatchet, category: Melee, tier: 1 }
      - { id: SmokeGrenade, category: Explosives, tier: 1 }
      - { id: N14ripper, category: Melee, tier: 1 }
      - { id: C4, category: Explosives, tier: 1 }
      - { id: N14Dynamite, category: Explosives, tier: 1 }
      - { id: N14WeaponRifleGrenade, category: Explosives, tier: 1 }
      - { id: N14WeaponRifle308SniperRifle, category: Ballistic, tier: 1 }
      - { id: N14WeaponSMG9mminfiltrator, category: Ballistic, tier: 1 }
    - name: Tier 2 - Heavy Trooper allocation
      entries:
      - { id: SmokeGrenade, category: Explosives, tier: 2 }
      - { id: N14Dynamite, category: Explosives, tier: 2 }
      - { id: MisfitsGrenadeImpact, category: Explosives, tier: 2 }
      - { id: MisfitsHawkinsDevice, category: Explosives, tier: 2 }
    # #Misfits Add - faction council grenade allowances. Choices are tracked per
    # character, while the individual entries continue to use shared armory stock.
    - name: Tier 1 - Utility grenade allocation
      choices: { MisfitsNCRGrenadeTier1: 7 }
      entries:
      - { id: GrenadeFlashBang, category: Explosives, tier: 1 }
      - { id: MisfitsGrenadeWhitePhosphorus, category: Explosives, tier: 1 }
      - { id: SmokeGrenade, category: Explosives, tier: 1 }
    - name: Tier 2 - Conventional grenade allocation
      choices: { MisfitsNCRGrenadeTier2: 5 }
      entries:
      - { id: GrenadeIncendiary, category: Explosives, tier: 2 }
      - { id: GrenadeShrapnel, category: Explosives, tier: 2 }
      - { id: MisfitsGrenadeFragDefensive, category: Explosives, tier: 2 }
    - name: Tier 3 - Advanced grenade allocation
      choices: { MisfitsNCRGrenadeTier3: 5 }
      entries:
      - { id: MisfitsGrenadePlasma, category: Explosives, tier: 3 }
      - { id: EmpGrenade, category: Explosives, tier: 3 }
    - name: Tier 4 - Executive Officer / Platoon Leader allocation
      entries:
      # A laser sight does not make this .44 Magnum pistol an energy weapon.
      - { id: N14WeaponLaserdotDesertEagle44, category: Ballistic, tier: 4 }
      - { id: NCRCommissarSabre, category: Melee, tier: 4 }
    - name: Tier 5 - Commander / Requisition Officer allocation
      entries:
      - { id: N14WeaponRifleM1GarandRepublicsPride, category: Ballistic, tier: 5 }
    replenishment:
    - currency: Bottlecaps
    replenishmentCosts:
      1: 1
      2: 2
      3: 5
      4: 10
      5: 20
    blueprintCategories: [ N14BlueprintNCRWeaponsT1, N14BlueprintNCRWeaponsT2, N14BlueprintNCRWeaponsT3, N14BlueprintNCRWeaponsT4 ]
    # Keep every blueprint result in a player-facing weapon family; balance fields can be added per entry here.
    blueprintEntryOverrides:
      N14WeaponPistol10mm: { category: Ballistic }
      N14WeaponPistol22lr: { category: Ballistic }
      N14WeaponPistol9mm: { category: Ballistic }
      N14WeaponPistol9mmChinese: { category: Ballistic }
      N14WeaponRevolver10mm: { category: Ballistic }
      N14WeaponRevolver9mm: { category: Ballistic }
      N14WeaponShotgun: { category: Ballistic }
      N14WeaponShotgunLever: { category: Ballistic }
      N14WeaponShotgunSawedOff: { category: Ballistic }
      N14WeaponSniper556VarmintRifle: { category: Ballistic }
      N14WeaponSniperEnfield: { category: Ballistic }
      N14WeaponSniperHunting: { category: Ballistic }
      N14WeaponPistol45Colt: { category: Ballistic, tier: 1 }
      N14WeaponPistolM1911: { category: Ballistic }
      N14WeaponRevolver44Magnum: { category: Ballistic }
      N14WeaponRifle10mmM1Carbine: { category: Ballistic }
      N14WeaponRifle556R91: { category: Ballistic }
      N14WeaponRifle556Service: { category: Ballistic, tier: 1 }
      N14WeaponRifle556ServiceScoped: { category: Ballistic }
      N14WeaponRifle762M14: { category: Ballistic }
      N14WeaponRifle762Rangemaster: { category: Ballistic }
      N14WeaponShotgunAuto: { category: Ballistic, tier: 1 }
      N14WeaponShotgunRiot: { category: Ballistic }
      N14WeaponShotgunTrench: { category: Ballistic }
      N14WeaponSMG10mm: { category: Ballistic }
      N14WeaponSMG10mmChinese: { category: Ballistic }
      N14WeaponSMG12mm: { category: Ballistic, tier: 1 }
      N14WeaponSMG45: { category: Ballistic }
      N14WeaponSMG9mm: { category: Ballistic, tier: 1 }
      N14WeaponSMGPPSh41: { category: Ballistic }
      N14WeaponSniper45-70BrushGun: { category: Ballistic }
      N14WeaponDesertEagle44: { category: Ballistic }
      N14WeaponRevolver45-70Hunter: { category: Ballistic }
      N14WeaponRevolver45-70RangerSequoia: { enabled: false }
      N14WeaponRifle308Battle: { category: Ballistic }
      N14WeaponRifle556Carbine: { category: Ballistic, tier: 2 }
      N14WeaponRifle556Scout: { category: Ballistic }
      N14WeaponRifle762Fal: { category: Ballistic }
      N14WeaponRifle762Marksman: { category: Ballistic }
      N14WeaponRifleM1Garand: { category: Ballistic }
      N14WeaponShotgunChinese: { category: Ballistic }
      N14WeaponSMG12mmAdvanced: { category: Ballistic }
      N14WeaponLMG: { category: Ballistic, tier: 2 }
      N14WeaponLMGAutoRifle: { category: Ballistic, tier: 2 }
      N14WeaponMinigun: { category: Ballistic }
      N14WeaponSniper50NCRRifle: { category: Ballistic, tier: 1 }
    authorityTierNames:
      1: Tier 1 - Trooper / Specialist allocation
      2: Tier 2 - Heavy Trooper allocation
      3: Tier 3 - Squad Leader / Medical Officer allocation
      4: Tier 4 - Executive Officer / Platoon Leader allocation
      5: Tier 5 - Commander / Requisition Officer allocation
    authorityTierAccess:
      1: [ NCR ]
      2: [ NCRSGT ]
      3: [ NCRLT ]
      4: [ NCRCaptain ]
      5: [ NCRCaptain ]

