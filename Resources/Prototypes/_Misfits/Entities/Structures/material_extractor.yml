- type: entity
  parent: N14MachineWaterTreatmentBroken
  id: N14SeismicMaterialExtractor
  name: seismic material extractor
  description: A battered pre-war drill that hammers the ground for usable raw materials. Its racket draws unwanted attention and consumes high amount of fuel because of its size.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Machines/seismic_extractor.rsi
    layers:
    - state: seismic_extractor
  - type: PointLight
    enabled: false
    color: "#ff2020"
    radius: 3
    energy: 2
  - type: MaterialExtractorLandmark
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          N14SeismicMaterialExtractorBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  # Balance: all economic and encounter tuning is kept here.
  - type: MaterialExtractor
    operatorRadius: 4
    pulseIntervalSeconds: 2
    firstWaveMinSeconds: 15
    firstWaveMaxSeconds: 15
    waveMinSeconds: 20
    waveMaxSeconds: 20
    waveWarningSeconds: 0
    waveMinMobCount: 1
    waveMaxMobCount: 3
    waveSpawnMinDistance: 8
    waveSpawnMaxDistance: 14
    waveSpawnAttempts: 40
    waveSpawnPvsBuffer: 3
    bossWaveChance: 0.12
    bossWaveMinNumber: 4
    encounterPlayerRadius: 20
    # One theme is selected for the whole rotation. Nightkin are removed from
    # the eligible pool outside the map's actual night window.
    waveThemes:
    - name: wasteland wildlife
      weight: 55
      minCount: 3
      maxCount: 6
      family: Wildlife
      mobs:
        N14MobMolerat: 28
        N14MobGecko: 15
        N14MobMirelurk: 10
        #N14MobRadhog: 0 was 10, #Not hostile, can be kept as a pet
        N14MobPigrat: 10
        N14MobRadroach: 10
        N14MobGeckoFire: 10
        N14MobDogFeral: 8
        N14MobBloatfly: 8
        N14MobNightstalkerCub: 7
        N14MobGiantAnt: 6
        N14MobNightstalker: 5
        N14MobRadMirelurk: 4
        N14MobGiantFireAnt: 4
        N14MobRadscorpion: 4
        N14MobRadscorpionBark: 3
        N14MobGeckoGolden: 3
        N14MobCazador: 3
      bosses:
        N14MobYaoguai: 45
        N14MobDeathclaw: 35
        N14MobRadscorpion: 20
    - name: deathclaw pack
      weight: 10
      minCount: 1
      maxCount: 2
      family: Deathclaw
      mobs:
        N14MobDeathclaw: 70
        N14MobRadLurker: 30
      bosses:
        N14MobDeathclawAlbino: 60
        N14MobDeathclawMetal: 40
    - name: raider gun crew
      weight: 30
      minCount: 2
      maxCount: 4
      family: Raider
      mobs:
        N14MobRaiderPsychoRanged: 30
        N14MobRaiderPsychoRanged9mm: 15
        N14MobRaiderSkrimisher: 25
        N14MobRaiderSkrimisherautoshotgun: 10
        N14MobRaiderHunter: 15
        N14MobRaiderHunterEnfield: 5
        N14MobRaiderPsycho: 15
      bosses:
        N14MobRaiderBoss: 45
        N14MobRaiderBossRifle: 25
        N14MobRaiderHunter: 30
    - name: cult of liberty
      weight: 15
      minCount: 2
      maxCount: 4
      family: Raider
      mobs:
        N14MobFernMercRecruit: 35
        N14MobFernMercPrivate: 30
        N14MobRaiderFernMelee: 25
        M14MobFernMercPrivateAutoRifle: 10
      bosses:
        N14MobFernMercSergeant: 60
        N14MobFernMercLieutenant: 40
    - name: warden patrol
      weight: 15
      minCount: 2
      maxCount: 4
      family: Raider
      mobs:
        N14MobEnforcerTrooper: 30
        N14MobEnforcerTrooperSten: 15
        N14MobEnforcerTrooper45SMG: 15
        N14MobRaiderEnforcerMelee: 20
        N14MobRaiderEnforcerShield: 20
      bosses:
        N14MobEnforcerWarden: 40
        N14MobEnforcerChief: 30
        M14MobEnforcerChief357: 15
        M14MobEnforcerChiefCowboyRepeater: 15
    - name: super mutant warband
      weight: 20
      minCount: 2
      maxCount: 4
      family: SuperMutant
      mobs:
        N14MobSuperMutantNPC: 25
        N14MobSuperMutantMelee: 40
        N14MobSuperMutantRanged: 25
        N14MobSuperMutantSuicider: 10
      bosses:
        N14MobSuperMutantNCO: 55
        N14MobSuperMutantArmored: 35
        N14MobBehemoth: 10
    - name: nightkin hunting party
      weight: 20
      minCount: 1
      maxCount: 3
      nightOnly: true
      family: SuperMutant
      mobs:
        N14MobNightkin: 65
        N14MobNightkinVeteran: 35
      bosses:
        N14MobNightkinElite: 100
    - name: feral ghoul horde
      weight: 20
      minCount: 3
      maxCount: 6
      family: Ghoul
      mobs:
        N14MobGhoulFeral: 60
        N14MobGhoulFeralRotter: 25
        N14MobGhoulFeralReaver: 15
      bosses:
        N14MobGhoulFeralReaver: 100
    - name: rogue robots
      weight: 10
      minCount: 1
      maxCount: 3
      family: Robot
      mobs:
        N14MobRobotProtectronHostile: 35
        N14MobRobotEyebot: 25
        N14MobRobotProtectronPoliceHostile: 20
        N14MobRobotMrHandyGun: 10
        N14MobRobotMrHandyGutsy: 10
      bosses:
        N14MobRobotAssaultronHostile: 40
        N14MobRobotSentryBot: 30
        N14MobRobotRobobrain: 30
    poorDepositChance: 0.25
    richDepositChance: 0.15
    poorYieldMultiplier: 0.7
    richYieldMultiplier: 1.4
    lowFuelWarningFraction: 0.25
    fuelSolution: tank
    fuelReagent: WeldingFuel
    outputWeights:
      N14IronOre1: 18
      N14CopperOre1: 16
      N14LeadOre1: 14
      SulfurOre1: 12
      N14Sand1: 10
      Salt1: 5
      N14ZincOre1: 5
      N14BauxiteOre1: 5
      FertilizerOre1: 5
      N14GoldOre1: 5
      N14SilverOre1: 5
  - type: FuelGenerator
    on: false
    targetPower: 1000
    minTargetPower: 1000
    optimalPower: 1000
    maxTargetPower: 1000
    # A full 250u tank lasts 2 hours while the extractor runs.
    optimalBurnRate: 0.03333333
    fuelEfficiencyConstant: 0.3
  - type: PowerSupplier
    supplyRate: 1000
    supplyRampRate: 1000
    supplyRampTolerance: 1000
    enabled: false
  - type: ChemicalFuelGeneratorAdapter
    solution: tank
    reagents:
      WeldingFuel: 1
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 250
        # It spawns ready to operate once; subsequent operation needs refueling.
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 250
  - type: RefillableSolution
    solution: tank
  - type: Storage
    grid:
    - 0,0,10,7
    maxItemSize: Normal
    clickInsert: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.MaterialExtractorUiKey.Key:
        type: MaterialExtractorBoundUserInterface
  - type: ActivatableUI
    key: enum.StorageUiKey.Key
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Tag
    tags:
    - Structure

- type: entity
  parent: N14MachineWaterTreatmentBroken
  id: N14SeismicMaterialExtractorBroken
  name: destroyed seismic material extractor
  description: The drill is silent. Its ruined hopper is full of twisted machinery.
  components:
  - type: Sprite
    sprite: _Misfits/Structures/Machines/seismic_extractor.rsi
    layers:
    - state: seismic_extractor_broken
  - type: MaterialExtractorLandmark
