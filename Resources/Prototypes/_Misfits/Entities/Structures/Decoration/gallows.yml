- type: entity
  id: MisfitsGallows
  parent: BaseStructure
  name: gallows
  description: A wooden gallows with a hanging noose. Whoever is strapped in can be sent to meet their maker.
  components:
  - type: Sprite
    noRot: true
    sprite: _Misfits/Structures/Decoration/gallows.rsi
    offset: "0.0,0.5"
    state: gallows
    drawdepth: OverMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.45,0,-0.15"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Strap
    position: Stand
    buckleOffset: "0.2,0.5"
    unbuckleDoafterTime: 3
    buckleSound:
      path: /Audio/_Misfits/Effects/noosed.ogg
    unbuckleSound:
      path: /Audio/Effects/silence.ogg
  - type: NoSelfUnbuckle
  - type: Gallows
