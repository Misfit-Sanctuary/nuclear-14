# #Misfits Add - Bunker tunnel teleporter: surface hatches that lead down to the Enclave base (or,
# for outsiders, into the mines), and a sealed vault door down there that brings the Enclave back up.
# Press E on either, like a ladder. Hatches are spawned at round start on N14BunkerHatchSpawnPoint
# markers; see bunker_hatch_spawn.yml.
#
# Neither of these parents BaseLadder or N14Airlock on purpose:
#   - BaseLadder carries a Warper component, and YAML cannot remove an inherited component. An
#     entity with both Warper and BunkerTeleporter would fire two systems on a single keypress.
#   - N14Airlock is what makes a door open, close and crush people, which is exactly what the
#     tunnel door must not do.

- type: entity
  id: N14BaseBunkerTeleporter
  parent: BaseStructure
  abstract: true
  components:
  - type: InteractionOutline

- type: entity
  parent: N14BaseBunkerTeleporter
  id: N14BunkerHatchTunnel
  name: bunker hatch
  description: This hatch leads to a maze of tunnels.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Misc/laddersms13.rsi
    drawdepth: FloorObjects
    noRot: true
    offset: 0, 0.25
    layers:
    - state: enclave
      map: [ "base" ]
  # Walk-over, same as every other ladder top.
  - type: Physics
    canCollide: false
  - type: BunkerTeleporter
    isSurface: true
  # Starts every round locked. Locked keeps outsiders out (unless they pry it for 85 s); Enclave
  # members still pass and it locks behind them. NCOs lock/unlock it here or from the tac map.
  - type: BunkerHatchLock
  - type: AccessReader
    access: [["EnclaveNCO"]]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BunkerHatchVisuals.Locked:
        base:
          True: { state: enclave }
          False: { state: enclave_open }
  # Lets the tac map and the tunnel door menu show a camera view of the ground around the hatch.
  - type: Eye

- type: entity
  parent: N14BaseBunkerTeleporter
  id: N14BunkerTunnelDoor
  name: bunker tunnel door
  description: Leads to the maze of tunnels.
  components:
  - type: Sprite
    sprite: _Nuclear14/Structures/Doors/FalloutDoors/vaultdoor.rsi
    state: closed
    drawdepth: Walls
    noRot: true
  - type: Icon
    sprite: _Nuclear14/Structures/Doors/FalloutDoors/vaultdoor.rsi
    state: closed
  # Sealed shut: blocks movement, sight and air like a wall. You go through it by using it, not by
  # opening it. Same fixture/occluder/airtight recipe as BaseWall.
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 1000
  - type: Occluder
  - type: Airtight
  - type: BunkerTeleporter
    isSurface: false
  # The menu Enclave members get: pick a hatch, look through it, go.
  - type: UserInterface
    interfaces:
      enum.BunkerTunnelDoorUiKey.Key:
        type: BunkerTunnelDoorBoundUserInterface
