# Misfits - medicine chemistry bottles
#
# Chemistry bottles are 30u stock containers for medics and chemists.
# They are NOT a recommendation to administer the full 30u at once.
#
# Topical-only medicines use their stackable topical entities instead.
# Glowing Blood Pack remains a transfusion bag.
# Poisons are deliberately not included in this medical stock file.
#
# ANTIBIOTICS
- type: entity
  id: MisfitsAntibioticsChemistryBottle
  name: antibiotics bottle
  description: A broad-spectrum antimicrobial treatment intended for serious or uncertain infections.
  parent: BaseChemistryBottleFilled
  components:
  - type: Label
    currentLabel: antibiotics 30u
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: MisfitsAntibiotics
          Quantity: 30

