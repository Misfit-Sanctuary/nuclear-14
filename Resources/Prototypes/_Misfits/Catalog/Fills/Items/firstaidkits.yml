# Misfits - filled first aid kits
#
# DESIGN:
# Stimpaks are emergency broad stabilizers.
# The specialist kits therefore stock the medicine for the actual damage type.
#
# BRUTE:
#   Piercing -> Blood Shield
#   Slash    -> Healing Salve
#   Blunt    -> Herbal Anodyne
#
# BURN:
#   Heat     -> Datura Hide
#   Cold     -> Rushing Water
#   Shock    -> Clearwake
#   Caustic  -> Herbal Antimicrobial
#
# Existing upstream IDs are referenced unchanged. All new prototype IDs use
# the Misfits prefix.
# ============================================================================
# GENERAL FIRST AID
# Basic wounds, burns, pain, and routine infection coverage.
# ============================================================================

- type: entity
  id: MisfitsMedkitGeneralFilled
  name: general first aid kit
  suffix: Filled, Misfits
  parent: Medkit
  components:
  - type: StorageFill
    contents:
    - id: N14CleanGauze10
    - id: N14Ointment10
    - id: N14Stimpak
      amount: 2
    - id: MisfitsPillCanisterAntibiotics
    - id: MisfitsPillCanisterAnodyne

# ============================================================================
# TRAUMA
# Heavy bleeding, blunt/ballistic trauma, blood loss, and battlefield pain.
# ============================================================================

- type: entity
  id: MisfitsMedkitTraumaFilled
  name: trauma treatment kit
  suffix: Filled, Misfits
  parent: MedkitBrute
