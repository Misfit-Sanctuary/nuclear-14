# Dog-compatible supply pouches.
- type: entity
  parent: N14ClothingBeltLeatherPouches
  id: MisfitsClothingBackDogPouches
  name: canine supply pouches
  description: A small set of leather pouches fitted to a dog's back. Useful for carrying medicine, treats, and other supplies.
  components:
  - type: Clothing
    sprite: _Misfits/Clothing/Belt/leatherpouches.rsi
    slots:
    - Back
    clothingVisuals:
      back-dog: []
  - type: Tag
    tags:
    - DogPouch

# Shared Treat Pouch Base
- type: entity
  parent: MisfitsClothingBackDogPouches
  id: MisfitsClothingBackFactionTreatPouchBase
  abstract: true
  name: treat pouch
  description: A small leather pouch filled with an assortment of treats for a four-legged companion.
  components:
  - type: Item
    size: Normal
  - type: Storage
    grid:
    - 0,0,7,1
    maxItemSize: Normal
    whitelist:
      tags:
      - FoodSnack

# Assorted Treat Pouch
- type: entity
  parent: MisfitsClothingBackFactionTreatPouchBase
  id: MisfitsClothingBackDogTreatPouch
  suffix: Filled, Assorted
  components:
  - type: StorageFill
    contents:
    - id: MisfitsDogTreatCheesyJerky
      amount: 2
    - id: MisfitsDogTreatBiscuit
      amount: 2
    - id: MisfitsDogTreatRadstagChew
      amount: 2
    - id: MisfitsDogTreatBacon
      amount: 2

