- type: entity
  name: legion encryption key box
  parent: BoxCardboard
  id: BoxEncryptionKeyLegion
  description: A box pre-war encryption keys from park ranger headsets, liberated from the Grand Canyon.
  components:
  - type: StorageFill
    contents:
    - id: EncryptionKeyLegion
      amount: 6
  - type: Sprite
    layers:
    - state: box
    - state: encryptokey
  - type: Storage
    whitelist:
      components:
      - EncryptionKey

