- type: entity
  name: legion headset box
  parent: BoxCardboard
  id: BoxHeadsetLegion
  description: A box of ancient headsets scavenged from the Grand Canyon, repurposed for use by Caesar's Legion.
  components:
  - type: StorageFill
    contents:
    - id: N14ClothingHeadsetLegion
      amount: 6
  - type: Sprite
    layers:
    - state: box
    - state: headset

