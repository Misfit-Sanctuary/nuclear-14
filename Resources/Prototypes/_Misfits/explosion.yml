#Misfits Change - N14 explosions need structural damage so blasts can break walls, fences, and windows.

- type: explosion
  id: N14DefaultStructural
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Piercing: 5
      Structural: 60
  tileBreakChance: [0]
  tileBreakIntensity: [0]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3

# #Misfits Add - Dynamite produces a broad pressure wave without the piercing
# damage associated with purpose-built fragmentation casings.
- type: explosion
  id: MisfitsDynamite
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 10
      Structural: 60
  tileBreakChance: [0]
  tileBreakIntensity: [0]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3

# Misfits Add - 40mm HE trades limb-severing piercing damage for a predictable
# 100-damage epicenter and crowd-control knockdown on the surrounding tiles.
- type: explosion
  id: Misfits40mmHE
  damagePerIntensity:
    types:
      Heat: 6.25
      Blunt: 6.25
      Structural: 60
  tileBreakChance: [0]
  tileBreakIntensity: [0]
  tileBreakRerollReduction: 20
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3

# Misfits Add - Incendiary 40mm relies on ignition rather than blast damage.
# Its intensity is kept below the explosion system's knockdown threshold.
- type: explosion
  id: Misfits40mmIncendiary
  damagePerIntensity:
    types:
      Heat: 0
  fireStacks: 4
  tileBreakChance: [0]
  tileBreakIntensity: [0]
  lightColor: Orange
  texturePath: /Textures/Effects/fire.rsi
  fireStates: 3

# Misfits Add - Missiles retain a lethal 220-damage epicenter while their
# broader intensity curve supplies knockdown through roughly three tiles.
- type: explosion
  id: MisfitsMissile
  damagePerIntensity:
    types:
      Heat: 5
      Blunt: 5
      Structural: 60
  tileBreakChance: [0]
  tileBreakIntensity: [0]
  tileBreakRerollReduction: 20
