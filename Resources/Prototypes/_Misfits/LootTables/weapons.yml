
# Generic world-weapon marker. Use the tier markers below when a map area needs
# a guaranteed power band; this marker is for ordinary, unthemed exploration loot.
- type: entity
  name: Weapon Loot Spawner
  suffix: Tiered
  id: N14WeaponLootSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: N14WeaponLootAllTiers
      prob: 0.75
    # Keep the MarkerBase after its one map-init roll so mappers can reveal and
    # delete it with Show Spawns, like the existing N14 map spawners.
    deleteSpawnerAfterSpawn: false

# The broad world distribution deliberately falls off hard at higher tiers.
# Add map markers rather than fixed guns to keep a location's exact loot unknown.
# Every concrete N14 and Misfits weapon is represented in a tier. Only abstract base
# prototypes and stock SS14 weapons are excluded from these world-loot tables.
- type: entityTable
  id: N14WeaponLootAllTiers
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: N14WeaponLootTier1
      weight: 60
    - !type:NestedSelector
      tableId: N14WeaponLootTier2
      weight: 25
    - !type:NestedSelector
      tableId: N14WeaponLootTier3
      weight: 10
    - !type:NestedSelector
      tableId: N14WeaponLootTier4
      weight: 4
    - !type:NestedSelector
      tableId: N14WeaponLootTier5
      weight: 1
