# Tier 5: end-game heavy weapons. These never occur in ordinary tiered loot
# except through the one-percent Tier 5 roll in N14WeaponLootSpawner.
- type: entity
  name: Weapon Loot Spawner
  suffix: Tier 5
  id: N14WeaponLootTier5Spawner
  parent: MarkerBase
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: N14WeaponLootTier5
      prob: 0.35
    deleteSpawnerAfterSpawn: false

- type: entityTable
  id: N14WeaponLootTier5
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: N14WeaponSniper50AntiMateriel
      weight: 3
    - !type:EntSelector
      id: N14WeaponSniper50NCRRifle
      weight: 2
    - !type:EntSelector
      id: N14WeaponSniper308TribalUpgraded
      weight: 2
    - !type:EntSelector
      id: N14WeaponRevolver45-70HandcannonUpgraded
      weight: 1
    - !type:EntSelector
      id: N14WeaponLMGchinese
      weight: 3
    - !type:EntSelector
      id: N14WeaponHMGcanadian
      weight: 2
    - !type:EntSelector
      id: N14WeaponM60GPMG
      weight: 2
    - !type:EntSelector
      id: N14WeaponMinigun
      weight: 3
    - !type:EntSelector
      id: N14WeaponMinigunAvenger
      weight: 1
    - !type:EntSelector
      id: N14WeaponLauncherMissile
      weight: 2
    - !type:EntSelector
      id: N14WeaponLaserRiflePrototypeAER14
      weight: 2
    - !type:EntSelector
      id: N14WeaponPulseRifle
      weight: 2
    - !type:EntSelector
      id: N14WeaponPlasmaCaster
      weight: 2
    - !type:EntSelector
      id: N14WeaponLaserGatling
      weight: 2
    - !type:EntSelector
      id: N14WeaponTeslaCannon
      weight: 1
    # Mounted weapons and call-in devices are catalogued for map migration.
    # They remain Tier 5 so normal world spawners only reach them via the 1% roll.
    - !type:EntSelector
