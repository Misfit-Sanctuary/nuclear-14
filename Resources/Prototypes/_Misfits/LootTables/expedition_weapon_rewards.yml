# Expedition-only reward markers.  Ambient N14 weapon markers intentionally
# retain their probability gates; these markers are used only for encounters
# the expedition generator has already classified as guaranteed rewards.
- type: entity
  name: Expedition Weapon Loot Spawner
  suffix: Guaranteed Tier 1
  id: N14ExpeditionWeaponLootTier1Guaranteed
  parent: MarkerBase
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: N14WeaponLootTier1
      prob: 1.0
    deleteSpawnerAfterSpawn: false

