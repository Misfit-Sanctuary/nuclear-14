# #Misfits Add - Enclave Vertibird Pilot. Commissioned aviator track (2LT -> 1LT -> Captain).
# Rank pins are spawned by NCRRankPinSpawnSystem, see _Misfits/Enclave/enclave_rank_pin_progressions.yml.

- type: job
  id: EnclaveVertibirdPilot
  setPreference: true
  hideWithoutJobWhitelist: true
  jobWhitelistBypassesRoleTimers: true
  weight: 112
  displayWeight: 127
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-enclave-vertibird-pilot
  description: job-description-enclave-vertibird-pilot
  playTimeTracker: EnclaveVertibirdPilot
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # T5 faction timelock (16h Enclave)
      department: Enclave
      min: 57600 # 16 hours
  startingGear: EnclaveVertibirdPilotGear
  icon: "JobIconEnclaveJuniorOfficer"
  supervisors: job-supervisors-enclave-vertibird-pilot
  alwaysUseSpawner: true
  accessGroups:
  - EnclaveJuniorOfficer
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Enclave
      - type: ReplacementAccent
        accent: n14Enclave
      - type: PowerArmorProficiency
      - type: VertibirdPilotPerk # #Misfits Add - pilot perk granted free with the role
      - type: VertibirdCrew # #Misfits Add - trained crew repair the airframe faster

- type: startingGear
  id: EnclaveVertibirdPilotGear
  equipment:
    head: N14ClothingHeadHatEnclaveZuluCombatHelmet
    mask: N14ClothingMaskBreather
    back: N14ClothingBackpackMilitary
    jumpsuit: N14ClothingUniformJumpsuitEnclave
    outerClothing: N14ClothingOuterEnclaveZuluAdvancedCombatArmor
    shoes: N14ClothingBootsCombatFilled
    gloves: N14ClothingHandsGlovesCombat
    eyes: N14ClothingEyesGlassesPilot
    belt: ClothingBeltMilitary
    ears: N14ClothingHeadsetEnclave
    pocket1: EnclaveOfficerloadoutkits
    pocket2: RadioHandheld
    id: N14EnclaveOfficerPipboy
  satchel: N14ClothingBackpackSatchelMilitaryFilled
  duffelbag: N14ClothingBackpackDuffelMilitaryFilled
  storage:
    back:
    - N14BoxPlasticFilledMilitary

- type: playTimeTracker
  id: EnclaveVertibirdPilot
