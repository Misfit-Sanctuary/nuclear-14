# #Misfits Add - EnclaveRecruit: hidden job assigned by per-round recruitment.
# Accepted players receive this literal job, so its normal playtime tracker
# counts toward Enclave department time requirements.

- type: job
  id: EnclaveRecruit
  setPreference: false
  hideWithoutJobWhitelist: false
  canBeAntag: false
  name: job-name-enclave-recruit
  description: job-description-enclave-recruit
  playTimeTracker: EnclaveRecruit
  supervisors: job-supervisors-none
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Enclave
      - type: ReplacementAccent
        accent: n14Enclave

- type: playTimeTracker
  id: EnclaveRecruit
