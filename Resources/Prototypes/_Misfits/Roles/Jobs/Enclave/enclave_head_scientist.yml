# #Misfits Add - Enclave Head Scientist role (senior science leadership).

- type: job
  id: EnclaveHeadScientist
  setPreference: true
  jobWhitelistBypassesRoleTimers: true # #Misfits Change
  weight: 112
  displayWeight: 126
  showBorder: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-enclave-head-scientist
  description: job-description-enclave-head-scientist
  playTimeTracker: EnclaveHeadScientist
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # #Misfits Tweak - leadership faction timelock
      department: Enclave
      min: 144000 # 40 hours
    - !type:CharacterPlaytimeRequirement
      tracker: EnclaveScientist
      min: 28800 # 8 hours
  startingGear: EnclaveHeadScientistGear
  icon: "JobIconEnclaveHeadScientist"
  supervisors: job-supervisors-enclave-head-scientist
  requireAdminNotify: true
  alwaysUseSpawner: true
  accessGroups:
  - EnclaveHeadScientist
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Enclave
          - Wastelander
      - type: ReplacementAccent
        accent: n14Enclave
      - type: CPRTraining
  - !type:AddTraitSpecial # #Misfits Add - Enclave scientists are issued an Enclave Eyebot companion
    traits: [ MisfitsPetEyebotEnclave ]

- type: startingGear
  id: EnclaveHeadScientistGear
  equipment:
    wallet: N14Wallet
    head: N14ClothingHeadHatEnclaveScientist
    back: N14ClothingBackpackSatchelMilitary
    jumpsuit: N14ClothingUniformJumpsuitEnclave
    outerClothing: N14ClothingOuterRadSuitEnclave
    shoes: N14ClothingBootsLeatherFilled
    neck: ClothingNeckPinEnclaveHeadScientist
    belt: ClothingBeltMilitary
    ears: N14ClothingHeadsetEnclave
    pocket2: EnclaveScientistloadoutkits
    id: N14EnclaveNoncombatPipboy
  satchel: N14ClothingBackpackSatchelMilitaryFilled
  storage:
    back:
    - N14BoxPlasticFilledMilitary

- type: playTimeTracker
  id: EnclaveHeadScientist
