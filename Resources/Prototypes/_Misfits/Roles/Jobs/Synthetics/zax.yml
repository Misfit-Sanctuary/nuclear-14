# Dedicated Z.A.X whitelist jobs. All map slots begin closed; player-chassis
# recipes in the Z.A.X Foundry open only their matching late-join role.

- type: job
  id: ZaxCore
  weight: 300
  name: job-name-zax-core
  description: job-description-zax-core
  playTimeTracker: ZaxCore
  icon: JobIconStationAi
  supervisors: job-supervisors-synthetic
  jobEntity: StationAiBrain
  canBeAntag: false
  setPreference: true
  overrideConsoleVisibility: true
  whitelisted: true
  hideWithoutWhitelist: true
  jobWhitelistBypassesRoleTimers: true
  spawnLoadout: false
  applyTraits: false
  requirements:
  - !type:CharacterSpeciesRequirement
    species:
    - ZaxCore

