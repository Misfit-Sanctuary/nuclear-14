- type: job
  id: NCREngineer
  setPreference: true
  hideIfPlaytimeRequirementsNotMet: false
  jobWhitelistBypassesRoleTimers: true
  overrideConsoleVisibility: false
  canBeAntag: false
  weight: 40
  showBorder: false
  name: job-name-ncr-engineer
  overwatchCategory: OverwatchNcrEnlisted
  description: job-description-ncr-engineer
  playTimeTracker: NCREngineer
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # T4 faction timelock (12h NCR)
      department: NCR
      min: 43200 # 12 hours
    - !type:CharacterPlaytimeRequirement
      tracker: NCRTrooper
      min: 14400 # 4 hours as NCR Trooper
  startingGear: NCREngineerGear
  icon: "JobIconWarden"
  supervisors: job-supervisors-ncr-nco
  alwaysUseSpawner: true
  access:
  - NCR
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCREngineerGear
  equipment:
    wallet: N14Wallet
    head: N14ClothingHeadHatNCRHelmetNoCover # Corvax-Change
    ears: N14ClothingHeadsetNCR # #Misfits Add - NCR radio earpiece
    back: N14ClothingBackpackNCR # Corvax-Change
    jumpsuit: N14ClothingUniformNCRDesert # Corvax-Change
    shoes: N14ClothingBootsLeatherFilled
    hands: N14ClothingHandsGlovesCombat
    id: N14IDNCRDogtagEngineer
  innerClothingSkirt: N14ClothingUniformNCRDesert # Corvax-Change

- type: playTimeTracker
  id: NCREngineer
