# #Misfits Change /Hide/: NCRFirstSergeant replaced by NCRNCO role system.
# Job kept defined for compatibility; prototype references remain valid.
- type: job
  id: NCRFirstSergeant
  setPreference: false # Hidden — role superseded by NCRNCO system with SFC pin progression
  hideWithoutJobWhitelist: false
  hideIfPlaytimeRequirementsNotMet: false
  jobWhitelistBypassesRoleTimers: true
  weight: 70
  showBorder: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-ncr-first-sergeant
  overwatchCategory: OverwatchNcrNcos
  description: job-description-ncr-first-sergeant
  playTimeTracker: NCRFirstSergeant
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # #Misfits Tweak - T6 faction timelock (20h NCR)
      department: NCR
      min: 36000 # 10 hours
    # TEMP REMOVED - !type:CharacterDepartmentTimeRequirement
    #   department: NCR
    #   min: 126000 # 35 hours
  startingGear: NCRFirstSergeantGear
  icon: "JobIconNcrSerg"
  supervisors: job-supervisors-ncr-lt
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRSGT
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

- type: startingGear
  id: NCRFirstSergeantGear
  equipment:
    back: N14ClothingBackpackNCR # Corvax-Change
    hands: N14ClothingHandsGlovesCombat
    jumpsuit: N14ClothingOfficerUniformNCRDesert # Corvax-Change
    shoes: N14ClothingBootsCombatFilled
    ears: N14ClothingHeadsetNCR # #Misfits Add - NCR radio earpiece
    neck: ClothingNeckPinNCRSergeant1st # #Misfits Change - sergeant first class pin for SFC rank
    belt: ClothingBeltNCR
    outerClothing: MisfitsNCRCommandArmor # #Misfits Tweak: T7 armor (0.60/0.55) — First Sergeant tier, top enlisted
    pocket1: NCRfirstsergeantloadoutkits
    pocket2: RadioHandheld
    id: N14IDNCRDogtagFirstSergeant
  innerClothingSkirt: N14ClothingOfficerUniformNCRDesert # Corvax-Change
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage: # Corvax-Change
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: NCRFirstSergeant
