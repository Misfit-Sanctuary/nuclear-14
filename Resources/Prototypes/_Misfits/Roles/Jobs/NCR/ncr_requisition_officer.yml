- type: job
  id: NCRRO
  setPreference: true
  hideWithoutJobWhitelist: false
  hideIfPlaytimeRequirementsNotMet: false
  jobWhitelistBypassesRoleTimers: true
  overrideConsoleVisibility: false
  canBeAntag: true
  name: job-name-ncr-requisition-officer
  overwatchCategory: OverwatchNcrOfficers
  description: job-description-ncr-requisition-officer
  playTimeTracker: NCRRO
  requirements:
