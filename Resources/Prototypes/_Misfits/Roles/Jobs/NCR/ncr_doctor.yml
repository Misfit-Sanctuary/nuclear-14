- type: job
  id: NCRDoctor
  setPreference: true
  hideIfPlaytimeRequirementsNotMet: false # #Misfits Tweak - all jobs visible in selection
  jobWhitelistBypassesRoleTimers: true # #Misfits Change
  weight: 49 # #Misfits Tweak - Medical Officer follows Squad Leader
  showBorder: true
  overrideConsoleVisibility: true
  canBeAntag: false
  name: job-name-ncr-doctor
  overwatchCategory: OverwatchNcrOfficers
  description: job-description-ncr-doctor
  playTimeTracker: NCRMedicalDoctor
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # #Misfits Tweak - T5 faction timelock (16h NCR)
      department: NCR
      min: 57600 # 16 hours
    - !type:CharacterPlaytimeRequirement
      tracker: NCRMedic
      min: 28800 # 8 hours as Medic
  startingGear: NCRDoctorGear
  icon: "JobIconNcrMedic"
  supervisors: job-supervisors-ncr-commander
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRMedic
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR
      - type: CPRTraining
  # #Cythisiax Added - rank pins this job works up through, by hours played
  rank:
    pins:
    - { pin: ClothingNeckPinNCRSecondLieutenant }
    - { pin: ClothingNeckPinNCRFirstLieutenant, hours: 30 }
    - { pin: ClothingNeckPinNCRCaptain, hours: 60 }
    - { pin: ClothingNeckPinNCRMajor, hours: 100 }

- type: startingGear
  id: NCRDoctorGear
  equipment:
    wallet: N14Wallet
    ears: N14ClothingHeadsetNCR # #Misfits Add - NCR radio earpiece
    back: N14ClothingBackpackNCR # Corvax-Change
    jumpsuit: N14ClothingUniformNCRDesert # Corvax-Change
    outerClothing: N14ClothingOuterCoatFollowersArmored
    shoes: N14ClothingBootsLeatherFilled
    belt: ClothingBeltNCR
    id: N14IDNCRDogtagDoctorSenior
    # #Cythisiax Removed - Main NCR job slots now obtain selectable equipment from the requisitions vendors.
  innerClothingSkirt: N14ClothingUniformNCRDesert # Corvax-Change
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage: # Corvax-Change
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: NCRMedicalDoctor
