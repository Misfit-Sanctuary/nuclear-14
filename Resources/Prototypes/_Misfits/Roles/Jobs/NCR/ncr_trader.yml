- type: job
  id: NCRTrader
  setPreference: true
  hideIfPlaytimeRequirementsNotMet: false # #Misfits Tweak - all jobs visible in selection
  jobWhitelistBypassesRoleTimers: true # #Misfits Change
  weight: 1 # Keep Trader above Prisoner in the civilian tier
  showBorder: false
  overrideConsoleVisibility: true
  canBeAntag: false
  name: job-name-ncr-trader
  overwatchCategory: OverwatchNcrCivilian
  description: job-description-ncr-trader
  playTimeTracker: NCRTrader
  requirements: # TEMP REMOVED - all requirements removed
   # - !type:MinPlayersRequirement
   #   min: 55
    - !type:CharacterDepartmentTimeRequirement
      department: NCR
      min: 28800 # 8 hours
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
      - GhoulGlowing
   # - !type:CharacterOverallTimeRequirement
   #   min: 3600
  startingGear: NCRTraderGear
  icon: "JobIconNcrCadet"
  supervisors: job-supervisors-ncr-prisoners
  accessGroups:
  - NCRTrader
  alwaysUseSpawner: true
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR

