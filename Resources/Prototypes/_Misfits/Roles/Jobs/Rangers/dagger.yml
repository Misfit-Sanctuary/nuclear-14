# #Misfits Add - DAGGER: whitelist-only Ranger liaison assigned between the Rangers and NCR High Command.

- type: job
  id: NCRDagger
  setPreference: true
  whitelisted: true
  hideWithoutJobWhitelist: true
  jobWhitelistBypassesRoleTimers: true
  alwaysUseSpawner: true
  weight: 16
  showBorder: true
  canBeAntag: false
  name: job-name-ncr-dagger
  overwatchCategory: OverwatchNcrRangers
  description: job-description-ncr-dagger
  playTimeTracker: NCRDagger
  startingGear: NCRDaggerGear
  icon: "JobIconHeadOfSecurity"
  supervisors: job-supervisors-ncr-dagger
  requireAdminNotify: true
  hideIfPlaytimeRequirementsNotMet: false
  accessGroups:
  - NCRRanger
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Rangers
      # #Misfits Add - command voice: bigger chat text
      - type: SpeechFontOverride
        fontSizeBonus: 4
      - type: FactionRoster # #Cythisiax Added - DAGGER replaces Chief Ranger: roster GUI to recruit, promote and demote Rangers
        roster: Rangers

# #Cythisiax Edited - DAGGER kit: DAGGER-exclusive worn gear (old elite ranger helmet and armor,
# modified ranger gas mask, ghillie cloak), a Sequoia sidearm and a choice of long rifle kit.
- type: startingGear
  id: NCRDaggerGear
  equipment:
    wallet: N14Wallet
    head: N14ClothingHeadHatRangerHelmetEliteOld
    mask: ClothingMaskGasRangerModif
    outerClothing: N14ClothingOuterRangerEliteOld
    neck: N14ClothingNeckCloakGhillie
    jumpsuit: ClothingUniformJumpsuitFlannelKhakis
    shoes: N14ClothingBootsCombatMK2
    back: N14ClothingBackpackRadioNCR
    gloves: N14ClothingHandsGlovesCombat
    ears: MisfitsClothingHeadsetNCRRanger
    pocket1: N14WeaponRevolver45-70RangerSequoia
    pocket2: NCRdaggerloadoutkits
    id: MisfitsIDBadgeNCRDagger
  innerClothingSkirt: ClothingUniformJumpsuitFlannelKhakis
  storage:
    back:
    - N14BoxPlasticFilledMilitaryNCR
    - MagazineBox45-70
    - FlashlightSeclite
    - N14Binoculars

- type: playTimeTracker
  id: NCRDagger
