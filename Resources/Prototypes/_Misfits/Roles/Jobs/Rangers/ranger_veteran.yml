- type: job
  id: NCRVeteranRanger
  setPreference: true
  whitelisted: true # #Misfits Add - user requested: Rangers are whitelist-only
  alwaysUseSpawner: true
  jobWhitelistBypassesRoleTimers: true
  name: job-name-ranger-veteran-n14
  overwatchCategory: OverwatchNcrRangers
  description: job-description-ranger-veteran-n14
  playTimeTracker: NCRVeteranRanger
  weight: 10
  showBorder: true
  startingGear: NCRVeteranRangerGear
  icon: "JobIconHeadOfSecurity"
  supervisors: job-supervisors-ranger-veteran
  requireAdminNotify: true
  canBeAntag: false
  # #Misfits Change - was "accessGroups: NCRRanger", whose group tags also include the
  # base NCR tag. Spelled out instead so Rangers keep their specialist tags only.
  access:
  - NCRSGT
  - NCRMedic
  - NCRRanger
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Rangers
      - type: GrantRangerCombat # #Misfits Change - re-enabled: Ranger Lead starts with the Ranger Combat Technique
      - type: FactionRoster # #Cythisiax Added - roster GUI: recruit, promote and demote Rangers via job whitelists
        roster: Rangers
  - !type:AddTraitSpecial # #Misfits Add - Rangers spawn with the riding perk
    traits: [ N14RidingPerk ]
  requirements:
    - !type:CharacterDepartmentTimeRequirement # #Misfits Tweak - T7 faction timelock (40h Rangers)
      department: Rangers
      min: 144000 # 40 hours
    - !type:CharacterSpeciesRequirement # #Misfits Change - robots, super mutants, and glowing ghouls cannot be Rangers
      species:
      - Human
      - Ghoul
    - !type:CharacterAgeRequirement
      min: 36
      max: 350

- type: startingGear
  id: NCRVeteranRangerGear
  equipment:
    wallet: N14Wallet
    head: N14ClothingHeadHatRangerHelmetDesert
    back: N14ClothingBackpackMilitary # Corvax-Change
    jumpsuit: N14ClothingUniformRangerVeteran
    ears: MisfitsClothingHeadsetNCRRangerCommand
    shoes: N14ClothingBootsCombatFilled
    gloves: N14ClothingHandsGlovesCombat
    belt: ClothingBeltRevolvervetfilled
    mask: ClothingMaskGasRiot
    pocket1: MagazineBox45-70
    pocket2: NCRveteranrangerloadoutkits
    eyes: ClothingEyesGlassesSunglasses
    outerClothing: N14ClothingOuterVetRangerRiotArmor
    id: N14NCRVeteranRangerPipboy
    neck: N14ClothingNeckRangerDuster
  innerClothingSkirt: N14ClothingUniformRangerV3 #placeholder
  satchel: N14ClothingBackpackSatchelMilitaryFilled
  duffelbag: N14ClothingBackpackDuffelMilitaryFilled
  storage: # Corvax-Change
    back:
    - N14BoxPlasticFilledMilitary
    - FlashlightSeclite
    - N14Binoculars # #Misfits Add - Veteran Rangers spawn with binoculars for scouting

- type: playTimeTracker
  id: NCRVeteranRanger
