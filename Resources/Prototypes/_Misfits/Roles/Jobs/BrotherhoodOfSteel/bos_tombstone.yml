# #Cythisiax Added - "TOMBSTONE" personal-whitelist BoS role.
# Single-player whitelist posting (ckey: NekoMarbles): a Brotherhood of Steel power-armor
# specialist of the 509th, sealed within the "living coffin" TOMBSTONE suit. Still part of the BoS.

- type: job
  id: BoSTombstone
  setPreference: true
  whitelisted: true # #Cythisiax Added - requires an explicit job whitelist entry (jobwhitelistadd NekoMarbles BoSTombstone)
  hideWithoutJobWhitelist: true # #Cythisiax Added - hidden from the job picker unless whitelisted for this job
  jobWhitelistBypassesRoleTimers: true
  weight: 111
  showBorder: true
  canBeAntag: false
  name: job-name-bos-tombstone
  overwatchCategory: OverwatchBosPaladin
  description: job-description-bos-tombstone
  playTimeTracker: BoSTombstone
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
  startingGear: BoSTombstoneGear
  alwaysUseSpawner: true
  requireAdminNotify: true
  icon: "JobIconBosMCommander"
  supervisors: job-supervisors-bos-tombstone
  accessGroups:
  - BOSHeadPaladin
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - BrotherhoodOfSteel
      - type: PowerArmorProficiency
      - type: LanguageKnowledge
        speaks:
        - English
        understands:
        - English
        - N14BrotherBeep

# #Cythisiax Added - TOMBSTONE kit: the living-coffin power armor set + standard BoS gear.
- type: startingGear
  id: BoSTombstoneGear
  equipment:
    jumpsuit: N14ClothingUniformBosRecon
    back: N14ClothingBackpackMilitary
    shoes: N14ClothingBootsLeatherFilled
    head: N14ClothingHeadHelmetPowerArmorTombstone
    outerClothing: N14ClothingOuterPowerArmorTombstone
    hands: N14ClothingHandsGlovesCombat
    pocket1: BoSBrotherhoodHeadPaladinKits
    id: N14IDBrotherhoodOfSteelHolotagTombstone
    ears: N14ClothingHeadsetBrotherhoodOfSteel
    belt: MisfitsClothingBeltPaladinWebbing
  storage:
    back:
    - N14BoxPlasticFilledMilitary

- type: playTimeTracker
  id: BoSTombstone
