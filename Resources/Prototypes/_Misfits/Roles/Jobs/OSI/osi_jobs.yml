# #Misfits Add - NCR Office of Science and Industry (OSI) role ladder.
# OSI is the Republic's civilian science branch. Four billets, each able to pick
# one of three branch loadout kits (Mechanical / Medical / Field) on spawn.
# The OSI Agent is whitelist-only (hidden from the job picker without an admin whitelist).

# OSI Chief Scientist — head of the detachment's science program.
- type: job
  id: OSIChiefScientist
  setPreference: true
  hideIfPlaytimeRequirementsNotMet: false # #Misfits Tweak - all jobs visible in selection
  jobWhitelistBypassesRoleTimers: true # #Misfits Change
  weight: 106
  showBorder: true
  overrideConsoleVisibility: false
  canBeAntag: false
  name: job-name-osi-chief-scientist
  overwatchCategory: OverwatchNcrOfficers
  description: job-description-osi-chief-scientist
  playTimeTracker: OSIChiefScientist
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
      - Human
      - Ghoul
    - !type:CharacterDepartmentTimeRequirement # #Misfits Tweak - T6 faction timelock (20h NCR)
      department: NCR
      min: 72000 # 20 hours
    - !type:CharacterPlaytimeRequirement
      tracker: OSIScientist
      min: 28800 # 8 hours as OSI Scientist
  startingGear: OSIChiefScientistGear
  icon: "JobIconScientist"
  supervisors: job-supervisors-osi-chief-scientist
  requireAdminNotify: true
  alwaysUseSpawner: true
  access:
  - NCR
  - NCRMedic
  - NCRLT
  - OSI
  special:
  - !type:AddComponentSpecial
    components:
      - type: NpcFactionMember
        factions:
          - Wastelander
          - NCR
      - type: CPRTraining
  - !type:AddTraitSpecial
    traits: [ TraitSwiftLearner, TraitScrounger, TraitEducated, MisfitsPetEyebotOSI ]

- type: startingGear
  id: OSIChiefScientistGear
  equipment:
    wallet: N14Wallet
    head: N14ClothingHeadHatNCRBeretMedic
    jumpsuit: N14ClothingUniformJumpsuitRDFormal
    outerClothing: N14ClothingOuterCoatFollowersArmored
    back: N14ClothingBackpackNCR
    shoes: N14ClothingShoesBlack
    eyes: N14ClothingEyesGlassesWelding
    belt: ClothingBeltUtility
    ears: MisfitsClothingHeadsetOSI
    mask: ClothingMaskSterile
    gloves: N14ClothingHandsGlovesNitrile
    pocket1: RadioHandheld
    pocket2: OSIloadoutkits
    id: N14IDNCRDogtagOSIChiefScientist
  innerClothingSkirt: N14ClothingUniformJumpskirtRDFormal
  satchel: N14ClothingBackpackSatchelNCRFilled
  storage:
    back:
    - N14BoxPlasticFilledMilitaryNCR

- type: playTimeTracker
  id: OSIChiefScientist

