# #Misfits Add - Wastelander Exclusive wearable items for the loadout pool.
# These items provide some armor and protection value for wastelanders and some items are allowed in factions but uniquely towards those factions and wastelanders.
# At this moment this file is sorted by. Helmets, Armors/Outerwear and then Uniforms. When added another catagories please add it to this. Easier to sort.

# Hats / Helmets

- type: loadout
  id: MisfitsLoadoutHeadHeadMarlowHat
  category: Head
