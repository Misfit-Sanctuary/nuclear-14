# the 509th BoS Head Paladin suit to the Head Paladin.
# These are NOT round-join spawn gear — players must spend loadout points to receive them in-game.
# Pattern mirrors LoadoutLegionPrincipes.

# === Elder: 509th BoS Elder T-51bc ===
- type: loadout
  id: LoadoutBoS509ElderT51BC
  category: Roles
  cost: 16
  exclusive: true
  requirements:
    - !type:CharacterJobRequirement
      jobs:
        - BoSWestElderCommander
  items:
    - MisfitsClothingOuterPowerArmorBoS509Elder

# === Head Paladin: 509th BoS Head Paladin T-51bc ===
