# Misfits - Psychiatric / psychic-treatment and pain-management reagent branches

# ============================================================================
# PSYCHIATRIC / HALLUCINATION TREATMENT
# ============================================================================

- type: reagent
  id: MisfitsClearhead
  name: reagent-name-misfits-clearhead
  group: Medicine
  desc: reagent-desc-misfits-clearhead
  physicalDesc: reagent-physical-desc-clear
  flavor: medicine
  color: "#dbe8e8"
  plantMetabolism:
    - !type:PlantAdjustMutationMod
      amount: -0.2
    - !type:PlantAdjustToxins
      amount: -1
  metabolisms:
    Medicine:
      metabolismRate: 0.2
      effects:
      - !type:AmbientDrugFlavorText
        cooldownId: MisfitsClearheadAmbient
        cooldown: 65
        messageKeys:
        - misfits-psychic-pain-clearhead-1
        - misfits-psychic-pain-clearhead-2
        - misfits-psychic-pain-clearhead-3
        - misfits-psychic-pain-clearhead-4
        - misfits-psychic-pain-clearhead-5
        - misfits-psychic-pain-clearhead-6
        - misfits-psychic-pain-clearhead-7
      - !type:SpecialStatBoostEffect
        perceptionBoost: 1
        intelligenceBoost: 1
        statusLifetime: 6.5
      # Entry-level psychiatric stabilizer.
      - !type:GenericStatusEffect
        key: SeeingRainbows
        time: 6
        type: Remove
      # TODO C#: SuppressHallucinationsReagent
      # suppression: 0.20
      # duration: 8
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 25
        - !type:MobStateCondition
        damage:
          types:
            Poison: 0.25
      - !type:GenericStatusEffect
        conditions:
        - !type:ReagentThreshold
          min: 25
        key: Drowsiness
        component: Drowsiness
        time: 2
        type: Add
        refresh: false

