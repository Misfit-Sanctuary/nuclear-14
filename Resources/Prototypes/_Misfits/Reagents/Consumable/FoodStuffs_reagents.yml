#Tato Soup: 1/1/1/1/1 mix of water, diced meat, tato, garlic and onion, must be heated.
# Tato soup
- type: reagent
  id: TatoSoup
  name: reagent-name-tatoSoup
  group: Foods
  desc: food-desc-tatoSoup
  physicalDesc: reagent-physical-desc-robust
  flavor: tatoSoup
  color: "#755e13"
  recognizable: true
  boilingPoint: 100.0
  meltingPoint: 0.0
  plantMetabolism:
  - !type:PlantAdjustWater
    amount: 2
  - !type:PlantAdjustToxins
    amount: -1
  - !type:PlantAdjustHealth
    amount: 2
  metabolisms:
    Food:
      effects:
      - !type:AdjustReagent
        reagent: Nutriment
        amount: 3.5
      - !type:AdjustReagent
        reagent: Water
        amount: 2
      - !type:AdjustReagent
        reagent: Protein
        amount: 2.5

