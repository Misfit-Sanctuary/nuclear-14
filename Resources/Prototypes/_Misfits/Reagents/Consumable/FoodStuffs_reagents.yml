
# diced meat
- type: reagent
  id: DicedMeat
  name: reagent-name-dicedMeat
  parent: BaseJuice
  desc: reagent-desc-food-dicedMeat
  physicalDesc: reagent-physical-desc-dicedMeat
  group: Foods
  flavor: bitter
  color: "#fc6e5b"
  metabolisms:
    Drink:
      effects:
      - !type:AdjustReagent
        reagent: N14UncookedAnimalProteinsRad
        amount: 1

#Diced Tato: Obtained via Cutting a Tato. Can be added to a container as a chem as 10u of it.
- type: reagent
  id: DicedTato
  name: reagent-name-dicedTato
  parent: BaseJuice
  desc: reagent-desc-food-dicedTato
  physicalDesc: reagent-physical-desc-starchy
  group: Foods
  flavor: potatoes
  color: "#302000"
  metabolisms:
    Drink:
      effects:
      - !type:AdjustReagent
        reagent: ExtractTato
        amount: 1
