- type: reagent
  id: MisfitsLazarusCompound
  name: reagent-name-lazarus-compound
  group: Medicine
  desc: reagent-desc-lazarus-compound
  physicalDesc: reagent-physical-desc-volatile
  flavor: medicine
  color: "#ece3bd"
  metabolisms:
    Medicine:
      metabolismRate: 0.5
      effects:
      # Extremely potent only in critical condition.
      - !type:HealthChange
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
        damage:
          groups:
            Brute: -1.5
            Burn: -1.5
            Airloss: -6
          types:
            Poison: -1
      - !type:ModifyBleedAmount
        amount: -1
        conditions:
        - !type:MobStateCondition
          mobstate: Critical
      # The price of forcing the body back from the edge.
      - !type:HealthChange
        damage:
          types:
            Cellular: 0.5
            Poison: 0.25
      - !type:Jitter
      - !type:HealthChange
