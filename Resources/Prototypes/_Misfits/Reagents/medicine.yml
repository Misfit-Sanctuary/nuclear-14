        cooldownId: MisfitsRushingWaterMisfitsAmbient
        cooldown: 55
        messageKeys:
        - misfits-chem-rushing-water-1
        - misfits-chem-rushing-water-2
        - misfits-chem-rushing-water-3
        - misfits-chem-rushing-water-4
        - misfits-chem-rushing-water-5
        - misfits-chem-rushing-water-6
        - misfits-chem-rushing-water-7
