# Misfits - proposed Fallout medicine / chem reagents
# ============================================================================
# MEDICINE / SURVIVAL
# ============================================================================

- type: reagent
  id: MisfitsAntibiotics
  name: reagent-name-antibiotics
  group: Medicine
  desc: reagent-desc-antibiotics
  physicalDesc: reagent-physical-desc-soothing
  flavor: medicine
  color: "#e8f0dc"
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      # Diseases are not in yet, but we larp.
      - !type:ChemVomit
        probability: 0.01

- type: reagent
  id: MisfitsRadShield
  name: reagent-name-radshield
  group: Medicine
  desc: reagent-desc-radshield
  physicalDesc: reagent-physical-desc-oily
  flavor: medicine
  color: "#4ba356"
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      # Existing RadiationProtection uses PotassiumIodide: Radiation coefficient 0.1.
      # This means 90% incoming radiation damage reduction while active.
      - !type:GenericStatusEffect
        key: RadiationProtection
        component: RadiationProtection
        type: Add
        time: 12
        refresh: true
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 25
        damage:
          types:
            Poison: 0.4

- type: reagent
  id: MisfitsX111Compound
  name: reagent-name-x111-compound
  group: Medicine
  desc: reagent-desc-x111-compound
