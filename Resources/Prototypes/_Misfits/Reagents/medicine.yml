- type: reagent
  id: MisfitsAntibiotics
  name: reagent-name-antibiotics
  group: Medicine
  desc: reagent-desc-antibiotics
  physicalDesc: reagent-physical-desc-soothing
  flavor: medicine
  color: "#e8f0dc"
  plantMetabolism:
  - !type:PlantAdjustPests
    amount: -3
  - !type:PlantAdjustHealth
    amount: 0.25
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      # Diseases are not in yet, but we larp.
      - !type:AmbientDrugFlavorText
        cooldownId: MisfitsAntibioticsMisfitsAmbient
        cooldown: 55
        messageKeys:
        - misfits-chem-antibiotics-1
        - misfits-chem-antibiotics-2
        - misfits-chem-antibiotics-3
        - misfits-chem-antibiotics-4
        - misfits-chem-antibiotics-5
        - misfits-chem-antibiotics-6
        - misfits-chem-antibiotics-7
      - !type:ChemVomit
        probability: 0.01

- type: reagent
  id: MisfitsRadShield
  name: reagent-name-radshield
  group: Medicine
  desc: reagent-desc-radshield
  physicalDesc: reagent-physical-desc-oily
  flavor: medicine
  color: "#4ba356"
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: -2
  - !type:PlantAdjustHealth
    amount: 0.25
  - !type:PlantAdjustMutationMod
    probability: 0.2
    amount: -0.15
  metabolisms:
    Medicine:
      metabolismRate: 0.1
      effects:
      # Existing RadiationProtection uses PotassiumIodide: Radiation coefficient 0.1.
      # This means 90% incoming radiation damage reduction while active.
      - !type:AmbientDrugFlavorText
        cooldownId: MisfitsRadShieldMisfitsAmbient
        cooldown: 55
        messageKeys:
        - misfits-chem-rad-shield-1
        - misfits-chem-rad-shield-2
        - misfits-chem-rad-shield-3
        - misfits-chem-rad-shield-4
        - misfits-chem-rad-shield-5
        - misfits-chem-rad-shield-6
        - misfits-chem-rad-shield-7
      - !type:GenericStatusEffect
        key: RadiationProtection
        component: RadiationProtection
        type: Add
        time: 12
        refresh: true
      - !type:HealthChange
        conditions:
        - !type:ReagentThreshold
          min: 25
        damage:
          types:
            Poison: 0.4

