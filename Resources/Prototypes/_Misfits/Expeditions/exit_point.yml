# Expedition return ladder. It is bound by the server to the exact surface
# entrance that launched this generated map. Interaction uses the normal warp
# helper, so pulled people and crates travel with the user.

- type: entity
  id: N14ExpeditionExitPoint
  name: n14-expedition-exit-name
  description: n14-expedition-exit-desc
  placement:
    mode: SnapgridCenter
  components:
  - type: N14ExpeditionExit
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    netsync: false
    layers:
    - sprite: _Nuclear14/Structures/Misc/ladder.rsi
      state: b_rope
    - sprite: Markers/cross.rsi
      state: green
      color: "#52FF39"
      scale: 0.6, 0.6
  - type: PointLight
    radius: 3
    energy: 4
    color: "#52FF39"
    castShadows: false
  - type: InteractionOutline
  - type: Clickable
  - type: Physics
    bodyType: Static
    canCollide: false

# Concrete, invisible target used only for the instant that WarperSystem moves
# a participant (and any pulled entities/followers) to an arbitrary expedition
# coordinate. MarkerBase itself is abstract and must never be spawned directly.
- type: entity
  parent: MarkerBase
  id: N14ExpeditionWarpMarker
  name: expedition transit target
  categories: [ HideSpawnMenu ]

