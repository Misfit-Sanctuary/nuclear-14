# Misfits Add - SuperMutant metabolizer type for FEV-mutated super mutant organs.
# Super mutant organs metabolize substances differently from humans due to FEV exposure.
# Reagents that target [SuperMutant] will only affect super mutants; those targeting
# only [Human] will have no effect on their organs.

- type: metabolizerType
  id: SuperMutant
  name: metabolizer-type-supermutant

# #Misfits Add - Nightkin metabolizer type. Nightkin organs carry BOTH SuperMutant and
# Nightkin, so every existing SuperMutant reagent exemption (raw meat, brains, oxygen)
# keeps firing while Nightkin-only effects can be gated on this type alone.
- type: metabolizerType
  id: Nightkin
  name: metabolizer-type-nightkin
