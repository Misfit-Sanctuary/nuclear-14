# #Misfits Add - Universal dog inventory template.
- type: inventoryTemplate
  id: misfits_dog
  slots:
  # Mask
  - name: mask
    slotTexture: mask
    slotFlags: MASK
    uiWindowPos: 1,0
    strippingWindowPos: 1,1
    displayName: Mask

  # Neck / collar
  - name: neck
    slotTexture: neck
    slotFlags: NECK
    uiWindowPos: 0,0
    strippingWindowPos: 0,1
    displayName: Neck


# Back slot - pouches and air tanks only
  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 2,0
    strippingWindowPos: 2,1
    displayName: Back
    whitelist:
      tags:
      - DogPouch
      components:
      - GasTank
    blacklist:
      components:
      - Jetpack

  # ID card
  - name: id
    slotTexture: id
    fullTextureName: template_small
    slotFlags: IDCARD
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 2,1
    strippingWindowPos: 2,4
    displayName: ID
