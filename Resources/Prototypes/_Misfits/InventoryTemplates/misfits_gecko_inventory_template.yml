# #Misfits Add - inventory for the sentient fire geckos: two pockets, a belt, a back and a head slot.
# There is no jumpsuit slot, so the pockets do not depend on one. The head slot is a real clothing slot,
# so a hat worn there renders on the gecko like it does on a person.
- type: inventoryTemplate
  id: misfitsGecko
  slots:
  - name: pocket1
    slotTexture: pocket
    fullTextureName: template_small
    slotFlags: POCKET
    slotGroup: MainHotbar
    stripTime: 3
    uiWindowPos: 0,3
    strippingWindowPos: 0,4
    displayName: Pocket 1
  - name: pocket2
    slotTexture: pocket
    fullTextureName: template_small
    slotFlags: POCKET
    slotGroup: MainHotbar
    stripTime: 3
    uiWindowPos: 2,3
    strippingWindowPos: 1,4
    displayName: Pocket 2
  - name: belt
    slotTexture: belt
    fullTextureName: template_small
    slotFlags: BELT
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,1
    strippingWindowPos: 1,5
    displayName: Belt
  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,0
    strippingWindowPos: 0,5
    displayName: Back
  - name: head
    slotTexture: head
    slotFlags: HEAD
    stripTime: 3
    uiWindowPos: 1,3
    strippingWindowPos: 1,0
    displayName: Head
