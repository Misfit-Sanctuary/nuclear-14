# Tier 1: improvised and civilian weapons. These should make a character armed,
# not decisively equipped.
# wdym not "decisively equipped"?????? TODO: ask
- type: entity
  name: Weapon Loot Spawner
  suffix: Tier 1
  id: M14Loot_Weapon_RNGRange2_Tier1
  parent: N14BaseLoot
  components:
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    offset: 0
    table: !type:GroupSelector
    rolls: !type:IntegerRangeNumberRNGSelector
      min: 1
      max: 3
      children:
        - !type:NestedSelector
          tableId: M14WeaponLootTier1

- type: entity
  name: Weapon Loot Spawner
  suffix: Tier 1
  id: M14Loot_Weapon_RNGRange0To2_Tier1
  parent: N14BaseLoot
  components:
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    offset: 0
    table: !type:GroupSelector
    rolls: !type:IntegerRangeNumberRNGSelector
      min: -1
      max: 3
      children:
        - !type:NestedSelector
          tableId: M14WeaponLootTier1

- type: entity
  name: Weapon Loot Spawner
  suffix: Tier 1
  id: M14Loot_Weapon_Single_Tier1Plus #+
  parent: MarkerBase
  components:
  - type: EntityTableSpawner
    deleteSpawnerAfterSpawn: false
    offset: 0
    table: !type:GroupSelector
      children:
        - !type:NestedSelector
          tableId: M14WeaponLootTier1
          weight: 80
        - !type:NestedSelector
          tableId: N14WeaponLootTier2
