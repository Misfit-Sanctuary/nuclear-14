#Tier N: Just a reference of every weapon. So basically template to copy paste any individual section or entire Tier
# if a new tier is added
- type: entityTable
  id: M14WeaponLootTierN
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
          tableId: M14WeaponLootTierN_GunsAll
      - !type:NestedSelector
          tableId: M14WeaponMeleeLootTierN_MeleeAll
      - !type:NestedSelector
          tableId: M14WeaponMeleeLootTierN_ThrowablesAll

- type: entityTable
  id: M14WeaponLootTierN_GunsAll
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
          tableId: M14WeaponLootTierN_GunsBulletAll
      - !type:NestedSelector
          tableId: M14WeaponLootTierN_GunsEnergyAll
      - !type:NestedSelector
          tableId: M14WeaponLootTierN_GunsExplosiveAll

# unused
- type: entityTable
  id: M14WeaponLootTierN_CallIn
  table: !type:GroupSelector
    - !type:EntSelector
      id: N14ArtilleryFlare
    - !type:EntSelector
      id: N14AttackPlaneFlare

#unused
