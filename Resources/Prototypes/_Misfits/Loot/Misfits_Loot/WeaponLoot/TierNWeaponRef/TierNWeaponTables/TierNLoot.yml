  id: M14TurretTableTierN_Any_Unused
  table: !type:GroupSelector
    children:
    - !type:EntSelector
      id: N14WeaponTurretBroken
    - !type:EntSelector
      id: N14WeaponTurretBrotherhoodMidwest
