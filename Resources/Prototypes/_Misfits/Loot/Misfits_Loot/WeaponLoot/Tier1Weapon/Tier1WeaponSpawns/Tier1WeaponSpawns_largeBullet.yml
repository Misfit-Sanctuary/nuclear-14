# SHOTGUN SPRITE/COLOR REF
- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: M14Tier1Spawner_RefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: lightGray
    - sprite: _Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!
- type: entity
  name: Tier1 Shotgun Spawner
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Single_GunsBulletShotgun
  parent: M14Tier1Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier1_GunsBulletShotgun

- type: entity
  name: Tier1 Shotgun Spawner 0-3
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Mult0_3_GunsBulletShotgun
  parent: M14Tier1Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier1_GunsBulletShotgun

- type: entity
  name: Tier1 Shotgun Spawner 1-2
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Mult1_2_GunsBulletShotgun
