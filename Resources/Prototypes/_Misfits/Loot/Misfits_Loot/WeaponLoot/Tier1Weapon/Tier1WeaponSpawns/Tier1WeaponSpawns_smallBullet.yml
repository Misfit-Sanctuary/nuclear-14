# PISTOL SPRITE/COLOR REF
- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: M14Tier1Spawner_RefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: lightGray
    - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!
- type: entity
  name: Tier1 Pistol Spawner
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Single_GunsBulletPistol
  parent: M14Tier1Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier1_GunsBulletPistol

- type: entity
  name: Tier1 Pistol Spawner 0-3
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Mult0_3_GunsBulletPistol
  parent: M14Tier1Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier1_GunsBulletPistol

- type: entity
  name: Tier1 Pistol Spawner 1-2
  suffix: Tier1
