# MELEE SPRITE/COLOR REF
- type: entity
  name: Tier1 Weapon Spawner
  abstract: true
  suffix: Tier1
  id: M14Tier1Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: lightGray
    - sprite: _Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!
- type: entity
  name: Tier1 Melee All Spawner
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Single_MeleeAll
  parent: M14Tier1Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier1_MeleeAll

- type: entity
  name: Tier1 Melee All Spawner 0-3
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Mult0_3_MeleeAll
  parent: M14Tier1Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier1_MeleeAll

- type: entity
  name: Tier1 Melee All Spawner 1-2
  suffix: Tier1
  id: M14Tier1WeaponSpawner_Mult1_2_MeleeAll
  parent: M14Tier1Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 1
          max: 2
        tableId: M14WeaponLootTier1_MeleeAll


