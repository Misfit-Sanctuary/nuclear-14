# parent to get color for this tier
- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: M14Tier4Spawner_Ref
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: Effects/crayondecals.rsi
      state: questionmark
      scale: 1.2, 1.2

# Every weapon on this tiers table(melee,guns, energy ect...)

- type: entity
  name: Tier4 Weapon Spawner
  suffix: Tier4
  id: M14Tier4WeaponSpawner_Single_All
  parent: M14Tier4Spawner_Ref
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false

      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier4

