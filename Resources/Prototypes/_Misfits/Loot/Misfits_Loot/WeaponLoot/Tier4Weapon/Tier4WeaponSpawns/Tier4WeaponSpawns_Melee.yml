# MELEE SPRITE/COLOR REF
- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: M14Tier4Spawner_RefMeleeAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: _Nuclear14/Objects/Weapons/Melee/baseball_bat.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/fireaxe.rsi
      state: icon

# MELEE WEAPONS!!!!!!
- type: entity
  name: Tier4 Melee All Spawner
  suffix: Tier4
  id: M14Tier4WeaponSpawner_Single_MeleeAll
  parent: M14Tier4Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier4_MeleeAll

- type: entity
  name: Tier4 Melee All Spawner 0-3
  suffix: Tier4
  id: M14Tier4WeaponSpawner_Mult0_3_MeleeAll
  parent: M14Tier4Spawner_RefMeleeAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier4_MeleeAll

- type: entity
  name: Tier4 Melee All Spawner 1-2
  suffix: Tier4
  id: M14Tier4WeaponSpawner_Mult1_2_MeleeAll
