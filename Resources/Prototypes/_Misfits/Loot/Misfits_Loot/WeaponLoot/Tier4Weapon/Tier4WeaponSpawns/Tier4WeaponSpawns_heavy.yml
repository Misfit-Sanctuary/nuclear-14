
# HEAVY BALLISTIC SPRITE/COLOR REF
- type: entity
  name: Tier4 Weapon Spawner
  abstract: true
  suffix: Tier4
  id: M14Tier4Spawner_RefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#ff7b00'
    - sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

