# THROWABLES SPRITE/COLOR REF
- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: M14Tier3Spawner_RefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: _Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!
- type: entity
  name: Tier3 Throwables All
  suffix: Tier3
