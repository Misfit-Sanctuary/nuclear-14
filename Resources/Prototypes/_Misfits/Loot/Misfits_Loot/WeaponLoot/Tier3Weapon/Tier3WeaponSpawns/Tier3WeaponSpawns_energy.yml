# ENERGY WEAPONS SPRITE/COLOR REF
- type: entity
  name: Tier3 Weapon Spawner
  abstract: true
  suffix: Tier3
  id: M14Tier3Spawner_RefGunsEnergyAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#00b3ff'
    - sprite: _Nuclear14/Objects/Weapons/Guns/Battery/recharger_pistol.rsi
      state: icon
      scale: .8, .8
      offset: 0, 0.1
    - sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/gatlinglaser.rsi
      scale: .7, .7
      state: icon
      offset: 0, 0
    - sprite: _Nuclear14/Objects/Weapons/Guns/Battery/plasma_autorifle_icon.rsi
      scale: .7, .7
      state: icon
      offset: 0, -0.2

# ENERGY WEAPONS!!!!!!
- type: entity
  name: Tier3 Gun Energy Spawner
  suffix: Tier3
  id: M14Tier3WeaponSpawner_Single_GunsEnergyAll
  parent: M14Tier3Spawner_RefGunsEnergyAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
