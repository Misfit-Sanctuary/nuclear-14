# SHOTGUN SPRITE/COLOR REF
- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: M14Tier2Spawner_RefShotgun
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: limeGreen
    - sprite: _Nuclear14/Objects/Weapons/Guns/Shotguns/double_shotgun.rsi
      state: icon

# SHOTGUN BALLISTICS!!!!!
- type: entity
  name: Tier2 Shotgun Spawner
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Single_GunsBulletShotgun
  parent: M14Tier2Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier2_GunsBulletShotgun

- type: entity
  name: Tier2 Shotgun Spawner 0-3
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Mult0_3_GunsBulletShotgun
  parent: M14Tier2Spawner_RefShotgun
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier2_GunsBulletShotgun

- type: entity
  name: Tier2 Shotgun Spawner 1-2
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Mult1_2_GunsBulletShotgun
