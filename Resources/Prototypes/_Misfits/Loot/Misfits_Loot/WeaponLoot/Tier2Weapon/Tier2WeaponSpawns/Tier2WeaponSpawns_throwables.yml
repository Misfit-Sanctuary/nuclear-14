# THROWABLES SPRITE/COLOR REF
- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: M14Tier2Spawner_RefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: limeGreen
    - sprite: _Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!
- type: entity
  name: Tier2 Throwables All Spawner
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Single_ThrowablesAll
  parent: M14Tier2Spawner_RefThrowablesAll
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
