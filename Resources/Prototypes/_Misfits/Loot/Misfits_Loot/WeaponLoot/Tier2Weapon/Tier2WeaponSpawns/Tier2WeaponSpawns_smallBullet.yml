# PISTOL SPRITE/COLOR REF
- type: entity
  name: Tier2 Weapon Spawner
  abstract: true
  suffix: Tier2
  id: M14Tier2Spawner_RefPistol
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: limeGreen
    - sprite: _Nuclear14/Objects/Weapons/Guns/Pistols/9mm.rsi
      state: icon

# PISTOL BALLISTICS!!!!!!!!
- type: entity
  name: Tier2 Pistol Spawner
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Single_GunsBulletPistol
  parent: M14Tier2Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:ConstantNumberSelector
          value: 1
        tableId: M14WeaponLootTier2_GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 0-3
  suffix: Tier2
  id: M14Tier2WeaponSpawner_Mult0_3_GunsBulletPistol
  parent: M14Tier2Spawner_RefPistol
  components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:NestedSelector
        rolls: !type:IntegerRangeNumberRNGSelector
          min: 0
          max: 3
        tableId: M14WeaponLootTier2_GunsBulletPistol

- type: entity
  name: Tier2 Pistol Spawner 1-2
