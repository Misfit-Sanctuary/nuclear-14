# THROWABLES SPRITE/COLOR REF
- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: M14Tier5Spawner_RefThrowablesAll
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#fce700'
    - sprite: _Nuclear14/Objects/Weapons/Grenades/Dynamite.rsi
      state: icon
    - sprite: Objects/Weapons/Melee/throwing_knife.rsi
      state: icon

# THROWABLES!!!!!!!!!!
- type: entity
  name: Tier5 Throwables All
  suffix: Tier5
  id: M14Tier5WeaponSpawner_Single_ThrowablesAll
  parent: M14Tier5Spawner_RefThrowablesAll
