
# HEAVY BALLISTIC SPRITE/COLOR REF
- type: entity
  name: Tier5 Weapon Spawner
  abstract: true
  suffix: Tier5
  id: M14Tier5Spawner_RefBulletHeavy
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - state: mono
      color: '#fce700'
    - sprite: _Nuclear14/Objects/Weapons/Guns/Heavy/minigun.rsi
      state: icon

# HEAVY BALLISTIC GUNS!!!!!
- type: entity
  name: Tier5 Heavy Spawner
  suffix: Tier5
  id: M14Tier5WeaponSpawner_Single_GunsBulletHeavy
  parent: M14Tier5Spawner_RefBulletHeavy
  components:
