# Centaur — FEV-warped creature, SUPERMUTANT ONLY (FEVMutants department), costs 8 pet points (Large, max 1)
# Placeholder — full implementation pending dedicated pet centaur prototype
# #Misfits Fix - gate by SPECIES (SuperMutant/Nightkin) instead of the FEVMutants department.
# The department-based CharacterDepartmentRequirement resolved zero roles (reporters saw the
# centaur locked even on supermutant characters — "none of the roles are considered part of it"),
# so a supermutant could never take the pet. Species is the same authoritative check the supermutant
# job prototypes use, and it does not depend on department/job-priority lookup.
- type: trait
  id: N14PetCentaur
  category: PetsLarge # #Cythisiax Edited - pet size subcategory for the separate Pets points system
  points: -8
  requirements:
    - !type:CharacterSpeciesRequirement
      species:
        - SuperMutant
        - Nightkin
  functions:
    - !type:TraitSpawnEntity
      prototypes:
        - MisfitsPetSpawnerCentaur

