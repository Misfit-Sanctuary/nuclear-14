# #Cythisiax Added - Faction MOTD: each factionMotd is one faction whose leadership can post a
# message of the day with /factionmotd. Members see it when they spawn in and can reopen it
# with /factionmotd.
#
#   departments   - every job in these departments is a member
#   jobs          - extra member jobs outside those departments
#   excludedJobs  - jobs in those departments that are NOT members (prisoners, slaves)
#   leadership    - player-facing leadership jobs that may write the MOTD (always members)
#
# Jobs no factionMotd claims (Wastelanders, FEV Mutants, Great Khans, robots, C-27 Units...)
# are not in a faction and get no MOTD. A faction-aligned variant (e.g. SuperMutantNCRTrooper,
# C27NCR) is a member because its faction's department or job list includes it.

- type: factionMotd
  id: NCR
  name: faction-motd-name-ncr
  color: "#FFCC33"
  departments:
  - NCR
  - MilitaryPolice
  - OSI
  jobs:
  - C27NCR
  excludedJobs:
  - NCRPrisoner
  leadership:
  - NCRMajor
  - NCRLTCol
  - NCRCommander
  - NCRExecutiveOfficer
  - NCRPlatoonLeader
  - NCRFirstSergeant
  - NCRProvost
  - NCRMilitaryPoliceCaptain
  - OSIChiefScientist

