# Ported from AU-14/ColonialMarinesUniverse (AGPL-3.0).
# RMC14/CMU-only components (skills, laser designator, area rules, camera shell,
# z-level carving) were stripped; see Content.Shared/_RMC14/Mortar.

- type: entity
  parent: BaseItem
  id: RMCMortarKit
  name: M402 mortar portable kit
  description: A manual, crew-operated mortar system intended to rain down 80mm goodness on anything it's aimed at. Needs to be set down first.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar/classic.rsi
    layers:
    - map: [ "mortar" ]
      state: mortar_m402_carry
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      mortar:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20
        layer:
        - Impassable
        mask:
        - Impassable
        hard: false
  - type: CollisionWake
    enabled: false
  - type: Anchorable
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - Back
  - type: Mortar
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: UserInterface
    interfaces:
      enum.MortarUiKey.Key:
        type: MortarBui
  - type: ActivatableUI
    key: enum.MortarUiKey.Key
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MortarVisualLayers.State:
        mortar:
          Item: { state: mortar_m402_carry }
          Deployed: { state: mortar_m402 }

- type: entity
  abstract: true
  parent: BaseItem
  id: RMCMortarShellBase
  name: 80mm mortar shell
  description: An unlabeled 80mm mortar shell, probably a casing.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_cas
  - type: Item
    size: Huge
  - type: MortarShell

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellHE
  name: M889 HE mortar shell
  description: An 80mm mortar shell loaded with an high explosive charge.
  components:
  - type: Item
    heldPrefix: he
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_he
  - type: Explosive
    explosionType: RMCMortar
    maxIntensity: 30.1
    intensitySlope: 2
    totalIntensity: 1000
    canCreateVacuum: false

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellIncendiary
  name: 80mm incendiary mortar shell
  description: An 80mm mortar shell loaded with a napalm charge. Perfect for long-range area denial.
  components:
  - type: Item
    heldPrefix: inc
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_inc
  # No Explosive payload: the shell deals no blast damage, it only starts fires.
  - type: MortarShell
    fireTilePrototype: MisfitsTileFireNapalm
    fireRange: 5

- type: entity
  parent: CrateBaseSecure
  id: RMCMortarCrate
  name: mortar crate
  description: A crate containing a mortar, ammunition and the tools to set it up.
  components:
  - type: StorageFill
    contents:
    - id: RMCMortarKit
    - id: RMCMortarShellHE
      amount: 8
    - id: Wrench
