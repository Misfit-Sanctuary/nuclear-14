# Ported from AU-14/ColonialMarinesUniverse (AGPL-3.0).
# RMC14/CMU-only components (skills, laser designator, area rules, camera shell,
# z-level carving) were stripped; see Content.Shared/_RMC14/Mortar.

- type: entity
  parent: BaseItem
  id: RMCMortarKit
  name: M29 80mm mortar kit
  description: A pre-war crew-served mortar, still in its crate. Someone has to carry it, and someone has to dig it in before it will fire.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar/classic.rsi
    layers:
    - map: [ "mortar" ]
      state: mortar_m402_carry
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      mortar:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 20
        layer:
        - Impassable
        mask:
        - Impassable
        hard: false
  - type: CollisionWake
    enabled: false
  - type: Anchorable
  - type: Item
    size: Huge
  - type: Clothing
    quickEquip: false
    slots:
    - Back
  - type: Mortar
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: UserInterface
    interfaces:
      enum.MortarUiKey.Key:
        type: MortarBui
  - type: ActivatableUI
    key: enum.MortarUiKey.Key
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.MortarVisualLayers.State:
        mortar:
          Item: { state: mortar_m402_carry }
          Deployed: { state: mortar_m402 }

- type: entity
  abstract: true
  parent: BaseItem
  id: RMCMortarShellBase
  name: 80mm mortar shell
  description: An unmarked 80mm mortar shell. Whatever it was loaded with, the label is long gone.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_cas
  - type: Item
    size: Huge
  - type: MortarShell

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellHE
  name: M889 80mm high-explosive mortar shell
  description: Pre-war Army surplus, still wrapped in its grease paper. Ruins infantry, cover and real estate in equal measure.
  components:
  - type: Item
    heldPrefix: he
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_he
  - type: Explosive
    explosionType: RMCMortar
    maxIntensity: 30.1
    intensitySlope: 2
    totalIntensity: 550
    canCreateVacuum: false

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellIncendiary
  name: M884 80mm incendiary mortar shell
  description: Filled with napalm that has been sitting in a warehouse since the bombs fell. Burns the ground itself, so nobody gets to use it after you.
  components:
  - type: Item
    heldPrefix: inc
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_inc
  # No Explosive payload: the shell deals no blast damage, it only starts fires.
  - type: MortarShell
    fireTilePrototype: MisfitsTileFireNapalm
    fireRange: 5

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellFrag
  name: M780 80mm fragmentation mortar shell
  description: A pre-war anti-personnel round with the casing scored into shrapnel. Empties a street and leaves the buildings standing.
  components:
  - type: Item
    heldPrefix: frag
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_frag
  - type: Explosive
    explosionType: RMCMortarFrag
    maxIntensity: 38
    intensitySlope: 1.7
    totalIntensity: 700
    canCreateVacuum: false

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellHEAT
  name: M792 80mm shaped-charge mortar shell
  description: A shaped charge packed into a mortar casing. Cracks bunkers, armour and barricades, and the bang itself is barely wider than the tube.
  components:
  - type: Item
    heldPrefix: heat
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_heat
  - type: Explosive
    explosionType: RMCMortarHEAT
    maxIntensity: 9
    intensitySlope: 3
    totalIntensity: 260
    canCreateVacuum: false

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellSmoke
  name: M722 80mm smoke mortar shell
  description: No charge worth mentioning, just smoke compound and a bursting cap. The way across open ground without becoming a casualty statistic.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_smk
  - type: MortarShell
    smoke:
      duration: 45
      spread: 35

- type: entity
  parent: RMCMortarShellBase
  id: RMCMortarShellIllumination
  name: M768 80mm illumination mortar shell
  description: Drops a burning parachute flare over the target. Turns a night attack into a shooting gallery for whoever brought the mortar.
  components:
  - type: Item
    heldPrefix: flr
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/mortar.rsi
    state: mortar_ammo_flr
  - type: MortarShell
    impactSpawn: RMCMortarIlluminationFlare

# Dropped by the illumination shell and lit by the landing code. Anchored, static and non-colliding on purpose:
# it is a light source hanging over the field, not a flare anyone can pick up and walk off with.
- type: entity
  id: RMCMortarIlluminationFlare
  name: M768 illumination flare
  description: Pre-war magnesium, and it still burns after two hundred years in a crate. Really bright, and completely unreachable.
  suffix: Mortar
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
      - map: [ enum.ExpendableLightVisualLayers.Base ]
        state: flare_base
      - map: [ enum.ExpendableLightVisualLayers.Glow ]
        state: flare_burn
        color: "#FFFFFF"
        visible: false
        shader: unshaded
      - map: [ enum.ExpendableLightVisualLayers.Overlay ]
        state: flare_unlit
        color: "#FF2020"
  - type: Appearance
  - type: ExpendableLight
    glowDuration: 150
    fadeOutDuration: 30
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
  # LightBehaviour is client side, so these values are what actually open the light up on screen:
  # a hand flare tops out at radius 10, this reaches 15 a few seconds after it lands.
  - type: LightBehaviour
    behaviours:
      - !type:FadeBehaviour
        id: turn_on
        maxDuration: 10.0
        startValue: 4.0
        endValue: 15.0
      - !type:FadeBehaviour
        id: fade_out
        maxDuration: 30.0
        startValue: 15.0
        endValue: 3.0
  - type: PointLight
    enabled: false
    color: "#FFEFC8"
    radius: 4
    energy: 10
    netsync: false
  # No TimedDespawn here on purpose: the mortar landing code sets one from this light's own
  # glowDuration + fadeOutDuration, so the flare can never outlive its burn or be spawned without one.

- type: entity
  parent: CrateBaseSecure
  id: RMCMortarCrate
  name: M29 mortar crate
  description: A faded yellow munitions crate, stencilled with a lot number nobody can read. One mortar, a mixed load of 80mm shells, and the tools to set it up.
  components:
  - type: StorageFill
    contents:
    - id: RMCMortarKit
    - id: RMCMortarShellHE
      amount: 4
    - id: RMCMortarShellIncendiary
      amount: 2
    - id: RMCMortarShellFrag
      amount: 2
    - id: RMCMortarShellHEAT
    - id: RMCMortarShellSmoke
      amount: 2
    - id: RMCMortarShellIllumination
    - id: Wrench
