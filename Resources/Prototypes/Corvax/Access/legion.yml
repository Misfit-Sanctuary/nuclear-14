# #Misfits Fix: Legion access hierarchy rebuilt.
# Previously EVERY group (including Slave) carried the base CaesarLegion tag AND inherited
# CaesarLegionSlave, so the base tag matched every Legion ID and rank doors were meaningless.
# Now: Slaves carry ONLY CaesarLegionSlave; CaesarLegion/CaesarLegionRecruit is the non-slave
# base; each rank adds its own tag and never inherits CaesarLegionSlave.
