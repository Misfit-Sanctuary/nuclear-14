# Flag

- type: entity
  parent: N14DecorationFlagFlammable
  id: N14DecorationFlagWesterBoS
  name: Flag of the Brotherhood of Steel
  description: The banner of the Brotherhood of Steel, descendents of the United States military who now attempt to confiscate and safeguard dangerous technology to prevent another apocalypse.
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/flag1.rsi
    state: zbos

- type: entity
  parent: N14DecorationFlagpoleNCR
  id: N14DecorationFlagpoleWesternBOS
  name: Brotherhood of Steel Flagpole
  description: The banner of the Brotherhood of Steel, descendents of the United States military who now attempt to confiscate and safeguard dangerous technology to prevent another apocalypse. The flag stands proud and tall, a challenge to those around it.
  components:
  - type: Sprite
    sprite: Corvax/Structures/Decoration/flag2.rsi
    state: zbosflagshtock
    noRot: true

- type: entity
  parent: N14DecorationFlagpoleNCR
  id: N14DecorationFlagpoleUSA
  name: Small U.S. Army Flag
  description: The banner of the U.S. Army, the descendents of America's elite who claim to be the true inheritors of the United States federal government. This one is a flag meant to be used as a desk paperweight.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    state: flagpole_usa
    noRot: true

- type: entity
  parent: N14DecorationFlagpoleNCR
  id: N14DecorationFlagpoleNCR2
  name: Small New California Republic Flag
  description: The banner of the New California Republic, a nation that despite enemies within and without, has done its best to provide comfort and equality to its citizens. This one is a flag meant to be used as a desk paperweight.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    state: flagpole_ncr
    noRot: true

- type: entity
  parent: N14DecorationFlagpoleNCR
  id: N14DecorationFlagpoleLegion
  name: Small Caesar's Legion Flag
  description: The banner of Caesar's Legion, a slave army under the mighty warlord Caesar, whose monumental ego and sharp wit have seen the lawless east fall in line under his iron boot. This one is a flag meant to be used as a desk paperweight.
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Misc/clutter.rsi
    state: flagpole_legion
    noRot: true

