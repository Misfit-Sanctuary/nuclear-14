- type: entity
  parent: N14BaseShield
  id: N14LegionnaireShield
  name: legionnaire heater shield #Misfits Change /Fix/: corrected visible name
  description: He had seen worse battles.
  components:
    - type: StaticPrice
      price: 500 # nice trophy
    - type: SpearBlock # #Misfits Change Add: Legionnaire heater shield deflects thrown polearms.
    - type: Sprite
      sprite: Corvax/Objects/Weapons/Melee/romanshield.rsi
      state: icon
    - type: Item
      sprite: Corvax/Objects/Weapons/Melee/romanshield.rsi
      heldPrefix: null
    - type: Clothing
      sprite: Corvax/Objects/Weapons/Melee/romanshield.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: ClothingSpeedModifier
      walkModifier: 0.90
      sprintModifier: 0.90
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.6
          Slash: 0.7
          Piercing: 0.7
          Heat: 1.5 # burnnnn wood
      activeBlockModifier:
        coefficients:
          Blunt: 0.4
          Slash: 0.5
          Piercing: 0.6
          Heat: 1.5 # burnnnn wood
        flatReductions:
          Blunt: 5
          Slash: 5
          Piercing: 5
          Heat: 0
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 390
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
        - trigger:
            !type:DamageTrigger
            damage: 350
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                N14LegionnaireShield:
                  min: 1
                  max: 1

- type: entity
  parent: BaseShield
  id: N14LegionnaireBuckler
  name: legionnaire buckler #Misfits Change /Fix/: corrected visible name
  description: Lightweight legionary shield.
  components:
    - type: StaticPrice
      price: 400 # sorta nice trophy
    - type: Construction
      graph: N14LegionnaireBuckler #Misfits Change /Add/: make shield player-craftable
      node: start
    - type: Sprite
      sprite: Corvax/Objects/Weapons/Melee/romanbuckler.rsi
      state: icon
    - type: Item
      sprite: Corvax/Objects/Weapons/Melee/romanbuckler.rsi
      heldPrefix: null
    - type: Clothing
      sprite: Corvax/Objects/Weapons/Melee/romanbuckler.rsi
      quickEquip: false
      slots:
      - Back
      - suitStorage
    - type: Blocking
      passiveBlockModifier:
        coefficients:
          Blunt: 0.8
          Slash: 0.8
          Piercing: 0.8
          Heat: 1.5 # burnnnn wood
      activeBlockModifier:
        coefficients:
          Blunt: 0.7
          Slash: 0.7
          Piercing: 0.7
          Heat: 1.5 # burnnnn wood
        flatReductions:
          Blunt: 1
          Slash: 1
          Piercing: 1
    - type: ClothingSpeedModifier
      walkModifier: 1
      sprintModifier: 1
    - type: HeldSpeedModifier
      mirrorClothingModifier: true
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 190
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: WoodDestroy
        - trigger:
            !type:DamageTrigger
            damage: 150 #Weaker shield
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:SpawnEntitiesBehavior
              spawn:
                N14LegionnaireBuckler:
                  min: 1
                  max: 1
