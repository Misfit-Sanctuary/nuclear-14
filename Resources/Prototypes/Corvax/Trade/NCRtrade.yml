# EXCHANGE RATES FOR REFERENCE
#GOLD BAR = 25 CAPS, 1.6 GOLD BARS = 1 AUREUS, 40 CAPS
#SILVER BAR = 20 CAPS = 5 DENARIUS
#1 DENARIUS = 4 CAPS
#1 AUREUS = 40 CAPS
#1 CAP = 2 NCR
#IF I CATCH YOU CHANGING ONE VALUE WITHOUT ADJUSTING THE OTHERS, I WILL CROSS YOU - LEGATE TYTOS
#'buy2' refers to what the PLAYER buys, 'sell2' refers to what the PLAYER sells.

#NCR trade Caravan - ncr prices should be twice cap prices as their fiat is inflated and not trusted

- type: entity
  id: TrademachineNCR
  parent: Trademachine
  abstract: true
  name: NCR Caravan Wagon
  description: A caravan operated by NCR traders, offering goods from the west.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/caravanwagon.rsi
    layers:
    - state: caravanwagon
  - type: PointLight
    enabled: false

- type: entity
  id: TrademachineNCRCity
  parent: TrademachineNCR
  name: NCR Caravan Wagon
  description: A caravan operated by NCR traders, offering goods from the west.
  suffix: vendor, normal
  components:
  - type: NcStore
    contractTierProfile: NCR
    buyPresets:
    - NCR_buy2
    sellPresets:
    - NCR_sell2
    contractPresets:
    - PresetNCR
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "NCRTrader" ]
  - type: NcContractRoster

