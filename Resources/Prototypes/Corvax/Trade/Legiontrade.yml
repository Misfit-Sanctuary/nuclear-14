# EXCHANGE RATES FOR REFERENCE
#GOLD BAR = 25 CAPS, 1.6 GOLD BARS = 1 AUREUS, 40 CAPS
#SILVER BAR = 20 CAPS = 5 DENARIUS
#1 DENARIUS = 4 CAPS
#1 AUREUS = 40 CAPS
#1 CAP = 2 NCR
#IF I CATCH YOU CHANGING ONE VALUE WITHOUT ADJUSTING THE OTHERS, I WILL CROSS YOU - LEGATE TYTOS
#'buy2' refers to what the PLAYER buys, 'sell2' refers to what the PLAYER sells.

#legion trade market - legion prices should be 1/4th of cap prices as 1 denar = 4 caps

- type: entity
  id: TrademachineLegion
  parent: Trademachine
  abstract: true
  name: Legion Market Stall
  description: Market stall operated by Legion Plebeians, offering goods from the east.
  components:
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: NcStoreStructuredBoundUi
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        density: 300
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/legionmarket.rsi
    layers:
    - state: legionmarket
  - type: PointLight
    enabled: false

- type: entity
  id: TrademachineLegionCity
  parent: TrademachineLegion
  name: Legion Market Stall
  description: Market stall operated by Legion Plebeians, offering goods from the east.
  suffix: vendor, normal
  components:
  - type: NcStore
    contractTierProfile: Legion
    buyPresets:
    - legion_buy2
    sellPresets:
    - legion_sell2
    contractPresets:
    - PresetLegion
  # #Misfits Change — restored TownieShopkeeper access restriction (players must be shopkeeper to use terminal)
  # #Misfits Add — track Hall of Fame roster for the tier contract system
  - type: AccessReader
    access:
    - [ "CaesarLegionTrader" ]
  - type: NcContractRoster

